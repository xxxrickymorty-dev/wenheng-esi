[project]
name = "wenheng"
version = "1.0.0"
description = "文衡 — ESI 学科信息参考自动化流水线（台账 → 计算 → 图表 → 报告初稿）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "python-docx>=1.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "pillow>=10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "qrcode[pil]>=7.4",
]

[tool.uv]
package = false
default-groups = ["server", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = '-q --strict-markers -m "not slow"'
markers = [
    "slow: 端到端跑整条流水线（约 15 秒），默认也跑，可用 -m 'not slow' 跳过",
]
# 台账含图表/条件格式扩展，openpyxl 只读时必刷这两条警告——是噪音，
# 且与「必须走 zip 级 XML 替换」的结论同源（见 .gitignore 上方注释与 README）。
filterwarnings = [
    "ignore:Unknown extension is not supported:UserWarning",
    "ignore:Conditional Formatting extension is not supported:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 2026-09-21 冻结时只启用「致命级」规则（语法错 / 未定义名 / 无效 noqa 目标），
# 保证 CI 立刻可用、且不为 lint 在提交前做大改。全量风格项（UP009/I001/RUF100
# 等约 500 条）赛后逐批治理——扩规则时一次只开一类，改完一类再开下一类。
select = ["E9", "F63", "F7", "F82"]
