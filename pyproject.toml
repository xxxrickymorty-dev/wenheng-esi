[project]
name = "wenheng"
version = "1.0.0"
description = "文衡 — ESI 学科信息参考自动化流水线（台账 → 计算 → 图表 → 报告初稿）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "python-docx>=1.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "pillow>=10",
]

[dependency-groups]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "qrcode[pil]>=7.4",
]

[tool.uv]
package = false
default-groups = ["server"]
