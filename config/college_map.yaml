# 文衡 · 学院/机构名映射表（「云大作者」列 → 报告用规范名）
#
# 谁读它：`src/college_stats.py`（读馆员的《<期次>论文清单.xlsx》时归一学院/机构名）
# 产物：`out/<期次>/college_stats.json`（报告学院统计表 / 学院贡献度饼图 / 概述段）
#
# ── 三条边界（读之前先看）──────────────────────────────────────────────
# 1. 本表是**数据**不是代码。改本表 = 改报告口径 → 必须把下面的 `parser_version`
#    与 `src/college_stats.py` 的 `_PARSER_VERSION` **一起 +1**，否则旧缓存
#    （`out/<期次>/college_stats.json`）会被继续使用，报告看起来"没改"。
#    （2026-09-24 实测踩过：加了别名但版本没动，报告里天文所仍是两行。）
# 2. 每条映射都要有 `by`（确认人）/ `at`（确认时间）/ `basis`（依据）才被采信。
#    条目可省 `by`/`at` → 继承文件级默认（`default_by` / `default_at`）；
#    `basis` 不继承，必须自己写：**没有依据的写法不许进本表**。
#    还没签认的写法不该写在这里 —— 它应该先出现在
#    `out/<期次>/institution_review.md` 的「待签认」里，由馆员签认后再进本表。
# 3. 本表只回答「同一个机构的多种写法 → 一个规范名」，**不做学院归属判断**
#    （英文地址片段 → 学院那一层是另一件事，见
#    `../评审文档/学院映射草表（待卜彤确认）.md` 与 `../文档/学院归属表（五期报告汇总·20260925）.csv`）。
#    本表的 `college` = 报告那一行印出来的名字，必须与出版件一致。
#
# 规范名口径的证据（2026-10-22 复核）：
#   出版件《云南大学学科信息参考 2026 年第 5 期》PDF 第 9 页（印刷页码 7）
#   「学院顶尖论文发文量与被引频次统计表」= 23 行、总计 291 篇 / 41979 引；
#   与 `out/202609/college_stats.json` 现产逐行一致（含 `中国（西南）天文研究所 6/625`）。

parser_version: 2            # 必须与 src/college_stats.py 的 _PARSER_VERSION 相等
updated: "2026-10-22"
owner: "卜彤（业务口径）· 项目组（实现）"
default_by: "项目组（对照出版件第 5 期第 7 页，待卜彤追认）"
default_at: "2026-10-22"

#: 已知口径（出版件为准，改口径要先改这里再改表）
notes:
  - "单列 vs 挂靠：出版件第 5 期把「云南生物资源国家重点实验室」「云南大学附属医院」「云南大学」都**单列**成行 → 本表跟随出版件，不并入任何学院（待卜彤追认）。"
  - "「云南大学」是清单只写了校名、没有院系的那些论文（202609：1 篇/137 引）；出版件保留为一行，不猜它属于哪个学院。"
  - "改口径的次序：先确认出版件怎么印 → 改本表（补 by/at/basis）→ 同时 +1 parser_version 与 _PARSER_VERSION → 重跑。旧缓存不删也行，版本不匹配会自动重解析。"

