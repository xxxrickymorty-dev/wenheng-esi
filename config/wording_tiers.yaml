# 文衡 · 报告措辞档位表（评价用词）
# 依据：`../调研与论证/discca-试用-20261022/学科竞争力分析平台（DISCCA）试用评测与对文衡的启发-20261022.md` §四.1
#
# ── 这张表管什么、不管什么 ──────────────────────────────────────────────
# 管：报告出句里**评价用词**怎么分档（「接近度较高的学科」里的「较高」、
#     「发展力度持续增强」里的「持续增强」…）。改这张表 = 改措辞，现场可改可预览。
# 不管：**任何数字**。数字只来自动态监测表（运行期 LLM 不进数据路径）——
#     所以本文件里没有也不许有数字槽；`{value}` 只在预览出句时用来显示输入值。
# 缺表 / 坏表 → 直接报错（`TierError`），**不静默回退到硬编码**（`src/sentences.py`）。
#
# ── 三类表 ──────────────────────────────────────────────────────────────
#   level  —— 水平档：一个百分数 → 用词（对应 DISCCA 的「排名百分比档位」；
#             我们的口径是**接近度**百分数，见 GLOSSARY「接近度」）
#   change —— 变动档：方向（up/flat/down）× 幅度（|值| 分档）→ 用词
#             区间一律**左闭右开** [lo, hi)，lo/hi 为 null 表示 ±∞
#   shape  —— 形态档：序列形态（连涨 / 波动上升 / 其他）→ 用词
#
# ── 改表须知 ────────────────────────────────────────────────────────────
# 1. 区间必须连续、无缺口、不重叠；首档 lo=null、末档 hi=null（兜底）；
#    change 表的 up/down 两方向都必须覆盖到 0 且末档 hi=null。
# 2. `word` 不能为空；`used_at` 写清楚这个用词落在报告哪一段（评审时要能对得上）。
# 3. `template` 只给预览出句用（`--preview`），不参与正式出句；
#    可用占位符：{word} 命中档用词 · {value} 输入值 · {phrase} 代码拼好的整段短语。
# 4. **默认值与今天逐字一致**：动第 1/2/5 张表里标了「今天在用」的那一档之前，
#    先跑 `uv run python -m src.sentences --regress 202609` 看一眼。
version: 1
updated: "2026-10-22"
owner: "卜彤（业务口径）· 项目组（实现）"

tables:

  # ────────────────────────────────────────────────────────────────
  # ① 水平档：接近度百分数 → 用词
  #    对应 DISCCA 的「排名百分比档位」（0–10% 领先水平 …）；用词换成我们报告在用的。
  #    202601–202609 五期的 1‰ 接近度（47.15 / 48.97 / 53.62 / 55.13 / 56.74）
  #    全部落在 [40, 60) 这一档 → 用词「较高」，与今天报告逐字一致。
  #    其余四档今天从未出现，用词按同一语域补齐（占位默认，可在配置面改）。
  - id: prox_level
    name: 接近度水平档
    kind: level
    metric: ESI前1‰接近度
    unit: "%"
    better: up
    used_at: "正文/概述·前1%与前1‰段（p2）：与ESI前1‰接近度{word}的学科为…"
    template: "我校目前与ESI前1‰接近度{word}的学科为〈学科〉，接近度为{value:.2f}%"
    bands:
      - {lo: null, hi: 20.0, word: "很低"}
      - {lo: 20.0, hi: 40.0, word: "较低"}
      - {lo: 40.0, hi: 60.0, word: "较高"}        # ← 今天在用（五期实测均落此档）
      - {lo: 60.0, hi: 80.0, word: "很高"}
      - {lo: 80.0, hi: null, word: "极高"}

  # ────────────────────────────────────────────────────────────────
  # ② 变动档：接近度变动（百分点）→ 亮点/警示段用词
  #    驱动量＝本期接近度变化最大的两个学科里**较大的那个**（facts.top2_prox_change）。
  #    五期实测：27.93 … 75.90 百分点，全部落在 ≥8 档 → 「表现较好」，与今天一致。
  - id: prox_verdict
    name: 接近度变动档（亮点/警示段）
    kind: change
    unit: "百分点"
    used_at: "正文/概述·亮点与警示段（p3）、学科发展态势段：在接近度方面较{上期}月{word}，分别上升…"
    template: "本期我校〈学科〉和〈学科〉在ESI前1%接近度方面较〈上期〉月{word}，分别上升{value:.2f}%和〈…〉%"
    bands:
      up:
        - {lo: 0.0, hi: 2.0, word: "变化不大"}
        - {lo: 2.0, hi: 8.0, word: "表现平稳"}
        - {lo: 8.0, hi: null, word: "表现较好"}    # ← 今天在用
      flat:
        - {lo: null, hi: null, word: "变化不大"}
      down:
        - {lo: 0.0, hi: 2.0, word: "变化不大"}
        - {lo: 2.0, hi: 8.0, word: "有所回落"}
        - {lo: 8.0, hi: null, word: "降幅明显"}

  # ────────────────────────────────────────────────────────────────
  # ③ 变动档：接近度尾迹净变化（百分点）→ 预测章「发展力度」用词
  #    驱动量＝2 号目标学科近 7 期接近度尾迹的首尾差（facts.not_entered[].prox_tail）。
  #    五期实测：+16.12 / +14.13 / -1.07 / +13.05 / +16.15 百分点 → 落 ≥8 或 <2 档，
  #    用词「持续增强」/「需要继续加强」，与今天一致。
  - id: prox_strength
    name: 发展力度档（预测章）
    kind: change
    unit: "百分点"
    used_at: "正文/预测章·2 号学科段（forecast_p2）：我校〈学科〉进入ESI前1%的发展力度{word}，…"
    template: "我校〈学科〉进入ESI前1%的发展力度{word}，〈模型说明句〉"
    bands:
      up:
        - {lo: 0.0, hi: 2.0, word: "基本持平"}
        - {lo: 2.0, hi: 8.0, word: "稳步增强"}
        - {lo: 8.0, hi: null, word: "持续增强"}    # ← 今天在用
      flat:
        - {lo: null, hi: null, word: "基本持平"}
      down:
        - {lo: 0.0, hi: 2.0, word: "需要继续加强"}  # ← 今天在用
        - {lo: 2.0, hi: 8.0, word: "有所减弱"}
        - {lo: 8.0, hi: null, word: "明显减弱"}

  # ────────────────────────────────────────────────────────────────
  # ④ 变动档：位次变动（位）→ 概述段 / 学校发展趋势段用词
  #    驱动量＝国内机构排名 / 国内高校排名 / 国际排名的较上期升降（facts.rank_*_delta）。
  #    ⚠ 今天报告**不分幅度**：升 22 位与升 1 位都写「上升」。
  #      所以三档默认同词 —— 要分幅度（如 ≥8 位写「大幅上升」），改这里的词即可。
  - id: rank_shift
    name: 位次变动档
    kind: change
    unit: "位"
    used_at: "正文/概述·数据来源段（p1）、学校发展趋势段：较上期{word}，排在…；位次不变"
    template: "与上期数据相比，我校国内机构排名较〈上期〉{phrase}，排在〈名次〉名"
    bands:
      up:
        - {lo: 0.0, hi: 2.0, word: "上升"}         # ← 今天在用（不分幅度）
        - {lo: 2.0, hi: 8.0, word: "上升"}
        - {lo: 8.0, hi: null, word: "上升"}
      flat:
        - {lo: null, hi: null, word: "位次不变"}    # ← 今天在用
      down:
        - {lo: 0.0, hi: 2.0, word: "下降"}         # ← 今天在用（不分幅度）
        - {lo: 2.0, hi: 8.0, word: "下降"}
        - {lo: 8.0, hi: null, word: "下降"}

  # ────────────────────────────────────────────────────────────────
  # ⑤ 形态档：接近度尾迹形态 → 预测章「趋势描述」用词
  #    判据（与今天一致）：monotone_up＝逐期不回落；volatile_up＝有回落但净变化为正；
  #    other＝其余（含净变化为 0 且期间有回落）。
  #    三种形态都已在用，故三档默认值都是今天的词。
  - id: prox_shape
    name: 接近度尾迹形态档（预测章）
    kind: shape
    used_at: "正文/预测章·1 号学科段（forecast_p1）：我校〈学科〉学科的发展{word}，…"
    template: "我校〈学科〉学科的发展{word}，本期该学科的ESI前1%接近度达到{value:.2f}%"
    bands:
      - {match: monotone_up, word: "一直呈稳步上升趋势"}   # ← 今天在用
      - {match: volatile_up, word: "呈波动上升趋势"}       # ← 今天在用
      - {match: other, word: "呈波动趋势"}                 # ← 今天在用
