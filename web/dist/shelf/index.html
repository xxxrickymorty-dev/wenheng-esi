<!doctype html>

<html lang="zh-CN" data-palette="ynu">

<title>文衡 · 历期卷宗（Working Volumes 复刻）</title>

<style>

/* ==================================================================

   G · 历期卷宗 —— Working Volumes 完整复刻

   ==================================================================

   这一版是**照参考站的结构做全**的探索稿（含 F 版刻意没抄的部分）：

     整屏饱和底色 / 一次只端详一卷 / 常驻规格栏 / 色板标注 /

     3D 实体书（封面·书脊·书口·封头 + 书签带 + 地面长投影）/ 圆形 ⊗ / 卷指示点。



   ⚠ 与 style.css 的铁律冲突之处已标注（见「铁律豁免」注释块）。

     这是探索稿，不是报送件；定稿前必须过投影与打印两关。



   四坑防护照旧携带（F 版踩过的，这里不再踩第二遍）：

     · destroy 摘宿主 → makeHost 重建

     · .stf__parent canvas 劫持 → 高特异性夺回

     · 尺寸测量必须在 loadFromHTML 之前

     · flex 子元素 flex:0 0 auto，否则溢出被压成变形

   ================================================================== */



:root{

  --vol:#1A4B27; --vol-deep:#103A1D; --vol-lift:#356B42;
  --stamp:#B43B31;

  --cream:#F7F0E2; --cream-2:rgba(247,240,226,.74); --cream-3:rgba(247,240,226,.46);

  --cream-4:rgba(247,240,226,.2);

  --paper:#F2E9D8;

  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;

  --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;

  --mono:Consolas,"Cascadia Mono","Courier New",monospace;

  --tex-paper:none; --tex-cloth:none;

  --t-turn:640ms; --ease:cubic-bezier(.32,.72,0,1);

  --bd:52px;                       /* 书厚 */

}

html[data-palette="zhu"]{
  --vol:#B43B31; --vol-deep:#8A2A18; --vol-lift:#D65A38;
  --stamp:#B43B31;
}



*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{

  font-family:var(--sans); background:var(--vol); color:var(--cream);

  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;

  overflow:hidden; transition:background var(--t-turn) var(--ease);

  display:flex; flex-direction:column;

}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

::selection{background:rgba(247,240,226,.28)}

.mono{font-family:var(--mono)}



/* ==================================================================

   一、页眉：左品牌 / 右 edition + 色板名 + ⊗ + 卷指示点

   ================================================================== */

.vh-head{

  display:flex; align-items:flex-start; justify-content:space-between;

  padding:26px 40px 0; flex:none; position:relative; z-index:10;

}

.brand-name{font-family:var(--serif); font-size:16px; letter-spacing:.24em; color:var(--cream)}

.brand-sub{font-family:var(--mono); font-size:9px; letter-spacing:.22em;

  color:var(--cream-3); margin-top:5px}



.back-app{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  color:var(--cream); opacity:.62; text-decoration:none;
  border:1px solid rgba(255,255,255,.28); border-radius:999px;
  padding:5px 12px; margin-right:14px; white-space:nowrap;
}
.back-app:hover{opacity:1; border-color:rgba(255,255,255,.6)}
.head-right{display:flex; align-items:flex-start; gap:26px}

.theme-switch{display:flex; gap:3px; padding:3px; border:1px solid var(--cream-3); border-radius:999px}
.theme-switch button{min-height:44px; padding:6px 11px; border-radius:999px; font-family:var(--mono); font-size:13.5px;
  letter-spacing:.06em; color:var(--cream-2)}
.theme-switch button[aria-pressed="true"]{background:var(--cream); color:var(--vol-deep)}
.theme-switch button:focus-visible{outline:3px solid var(--cream); outline-offset:3px}

.edition{text-align:right}

.edition .no{font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--cream-2)}

.edition .pal{font-family:var(--mono); font-size:10px; letter-spacing:.2em;

  color:var(--cream-3); margin-top:5px}



/* 卷指示点：一横排，当前卷实心 */

.dots{display:flex; gap:7px; align-items:center; padding-top:4px}

.dots button{width:7px; height:7px; border-radius:50%; border:1px solid var(--cream-2);

  transition:background .25s, transform .25s}

.dots button:hover{transform:scale(1.35)}

.dots button.on{background:var(--cream); border-color:var(--cream)}



/* 圆形 ⊗（参考站右上角那颗）——收起 / 展开规格栏 */

.x-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--cream-3);

  display:grid; place-items:center; color:var(--cream-2); flex:none;

  transition:border-color .2s, color .2s, transform .25s}

.x-btn:hover{border-color:var(--cream); color:var(--cream); transform:rotate(90deg)}

.x-btn svg{width:13px; height:13px; display:block}



/* 声音开关：不跟着 ⊗ 转 90°（扬声器转了会被读成「关闭」） */

.snd-btn:hover{transform:none; background:var(--cream); color:var(--vol); border-color:var(--cream)}

.snd-btn svg{width:15px; height:15px}

.snd-btn .off{display:none}

.snd-btn[aria-pressed="false"] .wave{display:none}

.snd-btn[aria-pressed="false"] .off{display:block}



/* ==================================================================

   二、主体：左舞台（书） + 右详情（规格栏）

   ================================================================== */

.vh-main{position:relative; flex:1; display:grid;

  grid-template-columns:1fr minmax(400px,520px); min-height:0; padding:0 40px}

body.detail-off .vh-main{grid-template-columns:1fr 0px}

body.detail-off .detail{opacity:0; pointer-events:none; transform:translateX(24px)}



/* ==================================================================

   书架视图（复刻 complete-shelf 的连续书架）

   ------------------------------------------------------------------

   它的要点（README/PROMPT 都点名了）：

     · 「中心卷必须明确选中」→ 选中那本前移 + 转出封面，其余压暗

     · 「单击即命中，导航不要依赖拖拽」→ 书籍本身就是按钮

     · 「书架视图要极简，不要装饰边框和大段文案」→ 只有书 + 横板 + 投影

   这里用纯 CSS 3D 搭（不上 Three.js）：书脊朝观众，选中时绕左缘转出封面。

   ================================================================== */

.shelf-view{position:absolute; inset:0; z-index:5; display:grid; place-items:center;

  opacity:0; pointer-events:none; visibility:hidden;

  transition:opacity 420ms linear, visibility 0s linear 420ms}

body[data-state="shelf"] .shelf-view{opacity:1; pointer-events:auto; visibility:visible;

  transition:opacity 420ms linear, visibility 0s linear 0s}

/* 🔴 只写 opacity:0 + pointer-events:none 不够 —— 实测仍会「拦住点击」

   （归架后点书架上第一本，被陈列态那张大书的 canvas 接走了）。

   加 visibility:hidden 让它彻底退出命中测试，但要挂在过渡**结束之后**，

   否则淡出动画会被瞬间掐掉。 */

.stage, .detail{transition:opacity 420ms linear, visibility 0s linear 0s}

body[data-state="shelf"] .stage,

body[data-state="shelf"] .detail{opacity:0; pointer-events:none; visibility:hidden;

  transition:opacity 420ms linear, visibility 0s linear 420ms}

/* 书架态随主题使用深色底，木板仍保持中性材质。 */

body[data-state="shelf"]{background:var(--vol-deep)}



.shelf-body{position:relative; perspective:2400px; perspective-origin:50% 46%}

.shelf-rail{display:flex; align-items:flex-end; justify-content:center; gap:12px;

  transform-style:preserve-3d}

/* 横板与地面比书排更宽 —— 「架子」的体量感靠它，不然四本书会像漂在空里 */

.shelf-plank{position:absolute; left:-46%; right:-46%; bottom:-20px; height:20px; border-radius:2px;

  background:linear-gradient(180deg, #6A5038, #33241A);

  box-shadow:0 10px 22px -10px rgba(0,0,0,.6), inset 0 1px 0 rgba(247,240,226,.14)}

.shelf-ground{position:absolute; left:-40%; right:-40%; bottom:-58px; height:58px; border-radius:50%;

  background:rgba(0,0,0,.5); filter:blur(22px); transform:scaleY(.4)}

.shelf-hint{position:absolute; left:50%; bottom:-136px; transform:translateX(-50%);

  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--cream-3);

  white-space:nowrap}



/* 架上的一本：书脊朝外，选中时绕左缘转出封面 */

.sbook{--sw:68px; --sh:436px; --sd:42px; position:relative; flex:none;

  width:var(--sw); height:var(--sh); transform-style:preserve-3d;

  transition:transform .34s var(--ease), opacity .34s linear}

.sbook .sbox{position:absolute; inset:0; transform-style:preserve-3d;

  transition:transform .34s var(--ease)}

.sbook:hover .sbox,.sbook.on .sbox{transform:translateZ(26px) rotateY(-18deg) translateY(-9px)}

/* 未选中的书后退让位 —— 不然选中那本转出的封面会整片盖住右边的邻居，

   一排书看着像只剩两三本。后退 + 轻微下沉 = 「被抽走旁边那本」的物理感。 */

.sbook.dim .sbox{transform:translateZ(-34px) translateY(7px); opacity:.62}

.sbook:focus-visible{outline:2px solid var(--cream); outline-offset:7px}



.sbook .sspine{position:absolute; inset:0; border-radius:1px 3px 3px 1px; overflow:hidden;

  display:grid; place-items:center; background:var(--sc, var(--vol));

  box-shadow:inset -6px 0 11px -6px rgba(0,0,0,.5), inset 6px 0 11px -6px rgba(0,0,0,.34)}

/* 暗化层压得太重会把四卷的色相全压成一种深棕 —— 卷色的可辨识度比「立体感」重要 */

.sbook .sspine::after{content:""; position:absolute; inset:0;

  background:linear-gradient(90deg, rgba(0,0,0,.24), rgba(255,255,255,.06) 40%, rgba(0,0,0,.22))}

.sbook .stitle{position:relative; writing-mode:vertical-rl; text-orientation:upright;

  white-space:nowrap; font-family:var(--serif); font-size:15px; letter-spacing:.3em;

  color:rgba(247,240,226,.9); text-shadow:0 1px 2px rgba(0,0,0,.5)}

.sbook .sno{position:absolute; left:50%; bottom:22px; transform:translateX(-50%);

  writing-mode:vertical-rl; text-orientation:upright; white-space:nowrap;

  font-family:var(--mono); font-size:10px; color:rgba(247,240,226,.74)}

.sbook .sband{position:absolute; left:9px; right:9px; height:1px;

  background:rgba(247,240,226,.34)}



/* 封面：绕左缘转向内侧；选中转出来时能看见。

   底色必须与陈列位的 .f-cover 同族（深色 + 左上高光）——

   ① 否则抽取落点时颜色会突变；

   ② drawCoverArt 画的是**浅色**波纹，铺在奶白底上等于看不见。 */

.sbook .sfront{position:absolute; top:0; left:0; width:262px; height:100%;

  transform-origin:left center;

  transform:translateX(var(--sw)) rotateY(-90deg) translateZ(-1px) translateX(-100%);

  background:linear-gradient(148deg, rgba(255,255,255,.2), rgba(0,0,0,.12) 62%), var(--sc, var(--vol));

  overflow:hidden; border-radius:2px}

.sbook .sfront canvas{position:absolute; inset:0; width:100%; height:100%}

.sbook .sfront .ft{position:absolute; left:22px; top:30px; writing-mode:vertical-rl;

  text-orientation:upright; white-space:nowrap; font-family:var(--serif); font-size:19px;

  letter-spacing:.24em; color:rgba(247,240,226,.9);

  text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* 书口：右侧露出的页芯 */

.sbook .sedge{position:absolute; top:3px; bottom:3px; left:0; width:var(--sd);

  transform-origin:left center; transform:translateX(var(--sw)) rotateY(90deg);

  background:repeating-linear-gradient(90deg,#EFE6D2 0 1px,#DCD0B6 1px 2.2px)}



/* 架上留一个空位：下一期还没出刊（台账 202609 列为空，是事实不是遗漏）。

   它让「这是一个连续的架」读得出来 —— 只有四本时容易看成孤立的四个物件。 */

.sbook-empty{width:68px; height:436px; flex:none; border-radius:2px;

  border:1px dashed rgba(247,240,226,.20); display:grid; place-items:center}

.sbook-empty span{writing-mode:vertical-rl; text-orientation:upright; white-space:nowrap;

  font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:rgba(247,240,226,.34)}



/* ---------- 书舞台 ---------- */

.stage{position:relative; display:grid; place-items:center; min-height:0; perspective:2600px}

.book-wrap{position:relative; transform-style:preserve-3d;

  transition:transform var(--t-turn) var(--ease), opacity 420ms linear}



/* 地面长投影：参考站那种展台打光 —— 要压得住，书才像立在台上 */

.book-shadow{

  position:absolute; left:2%; right:-14%; bottom:-9%; height:72px;

  background:var(--vol-deep); opacity:.72; filter:blur(28px);

  border-radius:50%; transform:rotate(-3deg) scaleY(.4);

  transition:background var(--t-turn) var(--ease)}



/* 三维实体书：真 3D 盒 + 一层「书体露边」

   ------------------------------------------------------------------

   🔴 定位坑：`.face` 基类已设 left:0，若某个面只写 `right:0` + `width`，

   CSS 在 LTR 下**忽略 right**（left/width 优先）—— 书口会跑到左侧贴住书脊，

   而所有 DOM 读数都正常。要用 left 显式算位置。



   还有一件让书「像书」的事：精装书的封面/封底比书芯小一圈，

   于是四边会露出书芯 —— 左边露出的其实是**书脊**（深色），

   其余三边露白。少了这一层，封面就是一张贴在背景上的图。 */

.book3d{

  position:relative; height:clamp(380px,74vh,648px); aspect-ratio:.72;

  transform-style:preserve-3d;

  transform:rotateX(5deg) rotateY(-16deg);

  transition:transform 120ms linear;    /* 拖拽时跟手，故用线性短过渡 */

  cursor:grab;

}

.book3d.grabbing{cursor:grabbing}

/* 🔴 基类必须写成 `.face`（(0,1,0)）而不是 `.book3d .face`（(0,2,0)）。

   否则后面的 `.f-cover { top/left/right/bottom }`、`.f-edge { left: calc(...) }`

   全部被基类的 top:0/left:0/width:100% 压掉 —— 封面不会内缩、书口位置失效，

   而且这些「失效」全都不报错，只看得出「书怎么长得不对」。 */

.face{position:absolute; top:0; left:0; width:100%; height:100%;

  backface-visibility:hidden}



/* 书体正面（露边层）：左 13px 书脊深色，其余书芯奶白 */

.f-body{

  transform:translateZ(calc(var(--bd) / 2 - 1px));

  background:linear-gradient(90deg,var(--vol-deep) 0 13px,#F4EBD9 13px 100%)}



/* 封面：压在书体上，四边内缩 —— 右侧多留一点，好让书口的奶白页芯看得出来 */

.f-cover{

  top:5px; left:14px; right:22px; bottom:6px; width:auto; height:auto;

  transform:translateZ(calc(var(--bd) / 2));

  background:var(--tex-cloth), linear-gradient(148deg,var(--vol-lift),var(--vol) 62%,var(--vol-deep));

  border-radius:2px 3px 3px 2px; overflow:hidden;

  box-shadow:inset 0 0 0 1px rgba(247,240,226,.15), inset 0 0 40px rgba(0,0,0,.3)}

.f-cover .art{position:absolute; inset:0; width:100%; height:100%}

.f-cover .hinge{position:absolute; left:11px; top:0; bottom:0; width:1px;

  background:rgba(0,0,0,.3); box-shadow:1px 0 0 rgba(247,240,226,.13)}

.f-cover .ctitle{

  position:absolute; left:50%; bottom:15%; transform:translateX(-50%);

  font-family:var(--serif); font-size:19px; letter-spacing:.34em;

  color:rgba(247,240,226,.92); white-space:nowrap;

  text-shadow:0 1px 1px rgba(0,0,0,.35)}

.f-cover .csub{

  position:absolute; left:50%; bottom:10.5%; transform:translateX(-50%);

  font-family:var(--mono); font-size:8px; letter-spacing:.24em;

  color:rgba(247,240,226,.62); white-space:nowrap}

.f-cover .seal{

  position:absolute; right:18px; top:16px; width:32px; height:32px; border-radius:3px;

  display:grid; place-items:center; background:var(--cream); color:var(--vol-deep);

  font-family:var(--serif); font-weight:700; font-size:16px;

  box-shadow:inset 0 0 0 2px rgba(247,240,226,.5); transform:rotate(-4deg)}



/* 封底 */

.f-back{transform:translateZ(calc(var(--bd) / -2)) rotateY(180deg);

  background:var(--vol-deep); border-radius:2px}

/* 书脊：左侧面（rotateY 负值时看不到，由 .f-body 左侧那条在正面顶替） */

.f-spine{width:var(--bd);

  transform:translateZ(calc(var(--bd) / -2)) rotateY(-90deg); transform-origin:left center;

  background:linear-gradient(90deg,var(--vol-deep),var(--vol) 45%,var(--vol-deep));

  display:grid; place-items:center}

.f-spine .sp{writing-mode:vertical-rl; text-orientation:upright; white-space:nowrap;

  font-family:var(--serif); font-size:13px; letter-spacing:.3em; color:rgba(247,240,226,.8)}

/* 书口：右侧面 —— 奶白页芯 + 细密横纹。left 必须显式算，写 right 会被忽略 */

.f-edge{left:calc(100% - var(--bd)); width:var(--bd);

  transform:translateZ(calc(var(--bd) / -2)) rotateY(90deg); transform-origin:right center;

  background:repeating-linear-gradient(0deg,#F4EBD9 0 1px,#E2D6BE 1px 2.4px)}

/* 封头 / 封根 */

.f-top{height:var(--bd);

  transform:translateZ(calc(var(--bd) / -2)) rotateX(90deg); transform-origin:center top;

  background:linear-gradient(180deg,#EFE4CE,#D9CBB0)}

.f-bottom{height:var(--bd); top:auto; bottom:0;

  transform:translateZ(calc(var(--bd) / -2)) rotateX(-90deg); transform-origin:center bottom;

  background:var(--vol-deep)}



/* 书签带：从封头垂下，压在封面外侧 */

.ribbon{position:absolute; top:-8px; left:56%; width:6px; height:96px;

  background:var(--vol-deep); transform:translateZ(calc(var(--bd) / 2 + 3px));

  box-shadow:1px 2px 5px rgba(0,0,0,.3);

  transition:background var(--t-turn) var(--ease)}



/* 拖拽提示：只在指针靠近时才出现，平时不打扰 */

.drag-hint{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);

  font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:var(--cream-3);

  opacity:0; pointer-events:none; transition:opacity .3s}

.stage:hover .drag-hint{opacity:1}



/* ---------- 右详情栏 ---------- */

.detail{display:flex; flex-direction:column; justify-content:center;

  padding:0 0 0 20px; min-height:0; transition:opacity 420ms linear, transform 420ms var(--ease)}

.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.24em; color:var(--cream-3);

  margin-bottom:14px}

.detail h1{font-family:var(--serif); font-weight:700;

  font-size:clamp(40px,5.4vw,70px); line-height:1.08; letter-spacing:.03em;

  color:var(--cream); margin-bottom:18px}

.lead{font-family:var(--serif); font-size:14.5px; line-height:1.9; color:var(--cream-2)}



.rule{height:1px; background:var(--cream-4); margin:24px 0}



/* 规格表：小号等宽标签 + 衬线值，两列 —— 参考站里这是主要信息，不是附注 */

.specs{display:grid; grid-template-columns:1fr 1fr; gap:26px 26px}

.spec .k{font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:var(--cream-3);

  margin-bottom:5px}

.spec .v{font-family:var(--serif); font-size:14px; line-height:1.45; color:var(--cream)}

.spec .v .u{font-family:var(--mono); font-size:10px; color:var(--cream-3); letter-spacing:.06em}

.spec .v em{font-style:normal; color:var(--cream)}



/* 状态 + 卷切换箭头 */

.status{display:flex; align-items:flex-end; justify-content:space-between; gap:16px}

.state{font-family:var(--serif); font-size:17px; letter-spacing:.14em; color:var(--cream)}

.state-sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; color:var(--cream-3);

  margin-top:6px}

.arrows{display:flex; gap:12px}

.arrows button{width:40px; height:40px; border-radius:50%; border:1px solid var(--cream-3);

  display:grid; place-items:center; color:var(--cream-2); font-size:17px; line-height:1;

  transition:border-color .2s, color .2s, background .2s}

.arrows button:hover{border-color:var(--cream); color:var(--vol); background:var(--cream)}



/* ==================================================================

   三、页脚：左提示 / 右命令

   ================================================================== */

.vh-foot{flex:none; display:flex; align-items:center; justify-content:space-between;

/* ------------------------------------------------------------------

   TEX —— 程序化贴图（纸 / 布），贴图失败有纯色兜底

   ------------------------------------------------------------------ */

var TEX = (function () {

  function rng(seed) {

    var s = seed >>> 0;

    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

  }

  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function paper(w, h, seed) {

    var c = mk(w, h), x = c.getContext('2d'), r = rng(seed);

    var g = x.createLinearGradient(0, 0, w, h);

    g.addColorStop(0, '#F7F2E4'); g.addColorStop(.55, '#F1E9D6'); g.addColorStop(1, '#E7DCC4');

    x.fillStyle = g; x.fillRect(0, 0, w, h);

    for (var i = 0; i < w * h / 90; i++) {

      var fx = r() * w, fy = r() * h, len = 4 + r() * 22;

      x.strokeStyle = 'rgba(' + (150 + r() * 60 | 0) + ',' + (132 + r() * 50 | 0) + ',' +

        (96 + r() * 40 | 0) + ',' + (.05 + r() * .1).toFixed(3) + ')';

      x.lineWidth = .6; x.beginPath(); x.moveTo(fx, fy);

      x.lineTo(fx + len, fy + (r() - .5) * 1.6); x.stroke();

    }

    var img = x.getImageData(0, 0, w, h), d = img.data;

    for (var k = 0; k < d.length; k += 4) {

      var n = (r() - .5) * 16;

      d[k] = clamp(d[k] + n, 0, 255); d[k + 1] = clamp(d[k + 1] + n, 0, 255);

      d[k + 2] = clamp(d[k + 2] + n, 0, 255);

    }

    x.putImageData(img, 0, 0);

    var v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25,

                                   w / 2, h / 2, Math.max(w, h) * .72);

    v.addColorStop(0, 'rgba(126,101,64,0)'); v.addColorStop(1, 'rgba(126,101,64,.16)');

    x.fillStyle = v; x.fillRect(0, 0, w, h);

    return c.toDataURL('image/png');

  }

  function cloth(w, h, seed) {

    var c = mk(w, h), x = c.getContext('2d'), r = rng(seed);

    for (var i = 0; i < w; i += 3) {

      x.fillStyle = 'rgba(255,240,220,' + (r() * .07 + .02).toFixed(3) + ')';

      x.fillRect(i, 0, 1, h);

    }

    for (var j = 0; j < h; j += 3) {

      x.fillStyle = 'rgba(0,0,0,' + (r() * .1 + .03).toFixed(3) + ')';

      x.fillRect(0, j, w, 1);

    }

    for (var m = 0; m < 500; m++) {

      x.fillStyle = 'rgba(0,0,0,' + (r() * .06).toFixed(3) + ')';

      x.fillRect(r() * w | 0, r() * h | 0, 1 + r() * 3 | 0, 1 + r() * 3 | 0);

    }

    return c.toDataURL('image/png');

  }

  function install() {

    try {

      var s = document.documentElement.style;

      s.setProperty('--tex-paper', 'url("' + paper(420, 600, 20260921) + '")');

      s.setProperty('--tex-cloth', 'url("' + cloth(260, 460, 8821) + '")');

    } catch (e) { console.warn('[TEX] 贴图失败，回退纯色底', e); }

  }

  return { install: install, rng: rng };

})();

    if (samples.page.length) {

      playBuf(samples.page[Math.floor(Math.random() * samples.page.length)], .95);

      return;

    /* —— 以下为兜底：素材解码失败时回落到合成颗粒 —— */

  function fadeBgm(target, ms) {

  function startDrone() {

    /* 三处一起提：总线 / 垫音 / 单音。只提总线会把垫音和单音一起放大但层次不变，

       听感仍是「闷在远处」；垫音提得比单音多一点，才有「底」托住旋律。 */

    musBus.gain.linearRampToValueAtTime(.85, t + 2.2);     /* 缓入，别「啪」一下起来 */

      lg.gain.value = d[1] * .45;

      lfo.connect(lg); lg.connect(g.gain);

  }

  function scheduleNote() {

    if (noteTimer) clearTimeout(noteTimer);

    noteTimer = setTimeout(function () {

      if (!on || document.hidden) { scheduleNote(); return; }

      if (ctx && ctx.state === 'running') {

        var t = ctx.currentTime + .02;

        var f = SCALE[noteIdx % SCALE.length];

        noteIdx += 1 + Math.floor(Math.random() * 2);       /* 不走音阶顺阶，避免听出旋律 */

        var o = ctx.createOscillator(), g = ctx.createGain();

/* ------------------------------------------------------------------

   封面图案：linocut 风同心波纹，每卷一张（seed = 期次）。

   参考站的封面图案是整套设计的主角之一，这里用程序化生成顶上，

   零素材文件，且每期有辨识度。

   ------------------------------------------------------------------ */

/* w/h 可传：架上那本封面只有 200×300，用同一套算法但线宽与波纹基数按尺寸缩放，

   否则缩小的封面上线条会糊成一片。 */

function drawCoverArt(cv, period, w, h) {

  if (!cv) return;

  w = w || 340; h = h || 460;

  cv.width = w; cv.height = h;

  var x = cv.getContext('2d');

  var seed = parseInt(period, 10) || 202607;

  var r = TEX.rng(seed);

  x.clearRect(0, 0, w, h);



  var lw = Math.min(w, h) / 340;                 /* 线宽/半径的整体缩放系数 */

  var cx = w * (0.42 + r() * 0.16), cy = h * (0.34 + r() * 0.08);

  var rings = 7 + Math.floor(r() * 4);

  var base = Math.min(w, h) * (0.05 + r() * 0.03);

  x.lineCap = 'round';

  for (var i = rings; i >= 1; i--) {

    var t = i / rings;

    var rx = base * i * (0.92 + r() * 0.2);

    var ry = base * i * (1.32 + r() * 0.22);

    var wob = 0.16 + r() * 0.2;

    x.beginPath();

    for (var a = 0; a <= 64; a++) {

      var th = a / 64 * Math.PI * 2;

      // 让波纹带一点手绘的不规则（linocut 的刀味）

      var k = 1 + Math.sin(th * 3 + i) * wob * 0.5 + Math.cos(th * 5 - i) * wob * 0.3;

      var px = cx + Math.cos(th) * rx * k;

      var py = cy + Math.sin(th) * ry * k;

      a ? x.lineTo(px, py) : x.moveTo(px, py);

    }

    x.closePath();

    x.strokeStyle = 'rgba(247,240,226,' + (0.20 + (1 - t) * 0.42).toFixed(2) + ')';

    x.lineWidth = lw * (1 + (1 - t) * 0.9);

    x.stroke();

  }

  // 中心实心点 + 一圈亮边

  x.beginPath(); x.arc(cx, cy, 5.5 * lw, 0, Math.PI * 2);

  x.fillStyle = 'rgba(247,240,226,.86)'; x.fill();

  x.beginPath(); x.arc(cx, cy, 10.5 * lw, 0, Math.PI * 2);

  x.strokeStyle = 'rgba(247,240,226,.5)'; x.lineWidth = lw; x.stroke();

}

/* 测量必须在 loadFromHTML 之前（之后未显示页的 clientHeight 全是 0） */

function measurePages(pages) {

  var out = [];

  pages.forEach(function (p, i) {

    var pad = p.querySelector('.pg-pad');

    var rec = { page: i, need: -1, have: -1, diff: -1, bleed: 0, w: 0 };

    var pr = p.getBoundingClientRect();

    rec.w = Math.round(pr.width);

    p.querySelectorAll('.frame,.inner,.sl,.seal').forEach(function (elm) {

      var r = elm.getBoundingClientRect();

      if (r.right > pr.right + 2 || r.bottom > pr.bottom + 2 || r.left < pr.left - 2) rec.bleed++;

    });

    if (!pad) { rec.note = '无版心框'; out.push(rec); return; }

    var clone = pad.cloneNode(true);

    clone.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;width:' +

      pad.clientWidth + 'px;height:auto;display:block;inset:auto';

    p.appendChild(clone);

    rec.need = clone.scrollHeight;

    clone.remove();

    rec.have = pad.clientHeight;

    rec.diff = rec.need - rec.have;

    out.push(rec);

  });

  window.WH_PAGE_BUDGET = out;

  return out;

}



/* 趋势小图：纯数据驱动，纵轴不写死 */

function drawTrend(canvas, trend, curPeriod) {

  if (!canvas) return;

  var x = canvas.getContext('2d');

  var W = canvas.width, H = canvas.height;

  var keys = Object.keys(trend).sort();

  var vals = keys.map(function (k) { return trend[k]; });

  if (!vals.length) return;

  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);

  var pad = { l: 62, r: 20, t: 26, b: 52 };

  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  var span = (hi - lo) || 1;

  var y0 = hi + span * .12, y1 = lo - span * .12;

  var X = function (i) { return pad.l + iw * (keys.length === 1 ? .5 : i / (keys.length - 1)); };

  var Y = function (v) { return pad.t + ih * (1 - (v - y1) / (y0 - y1)); };

  x.clearRect(0, 0, W, H);

  x.strokeStyle = 'rgba(126,101,64,.22)'; x.lineWidth = 1;

  x.font = '600 17px Consolas,monospace'; x.fillStyle = '#8A7C60'; x.textAlign = 'right';

  for (var g = 0; g <= 4; g++) {

    var v = y1 + (y0 - y1) * g / 4, yy = Y(v);

    x.beginPath(); x.moveTo(pad.l, yy); x.lineTo(W - pad.r, yy); x.stroke();

    x.fillText(Math.round(v), pad.l - 10, yy + 6);

  }

  var grd = x.createLinearGradient(0, pad.t, 0, H - pad.b);

  grd.addColorStop(0, 'rgba(126,101,64,.22)'); grd.addColorStop(1, 'rgba(126,101,64,0)');

  x.beginPath(); x.moveTo(X(0), Y(vals[0]));

  vals.forEach(function (v, i) { x.lineTo(X(i), Y(v)); });

  x.lineTo(X(vals.length - 1), H - pad.b); x.lineTo(X(0), H - pad.b); x.closePath();

  x.fillStyle = grd; x.fill();

  x.beginPath();

  vals.forEach(function (v, i) { i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)); });

  x.strokeStyle = '#7E6540'; x.lineWidth = 2.4; x.lineJoin = 'round'; x.stroke();

  var ci = keys.indexOf(curPeriod);

  if (ci < 0) ci = keys.length - 1;

  x.beginPath(); x.arc(X(ci), Y(vals[ci]), 7, 0, Math.PI * 2);

  x.fillStyle = '#B23A2A'; x.fill();

  x.strokeStyle = '#F7F2E6'; x.lineWidth = 2.5; x.stroke();

  x.fillStyle = '#B23A2A'; x.font = '700 19px Consolas,monospace';

  x.textAlign = ci > keys.length - 6 ? 'right' : 'left';

  x.fillText(vals[ci] + ' 篇', X(ci) + (ci > keys.length - 6 ? -12 : 12), Y(vals[ci]) - 12);

  x.fillStyle = '#8A7C60'; x.font = '15px Consolas,monospace'; x.textAlign = 'center';

  [0, Math.floor(keys.length / 2), keys.length - 1].forEach(function (i) {

    x.fillText(keys[i], X(i), H - pad.b + 26);

  });

  x.strokeStyle = 'rgba(126,101,64,.5)'; x.lineWidth = 1.2;

  x.beginPath(); x.moveTo(pad.l, H - pad.b); x.lineTo(W - pad.r, H - pad.b); x.stroke();

}



/* ------------------------------------------------------------------

   FLY / FLIP：确定性过渡

   ------------------------------------------------------------------

   🔴 ghost 必须是**书封本身**，不能是一块纯色。

   之前用纯色块：用户看到「一块色板飞过去 → 真书突然出现」，中间是断的

   （rick 反馈：「先是一个图片挡住，然后出现整个封面」）。

   做法对齐 GSAP Flip 的思路 —— 让运动中的元素与起点、终点**长得一样**，

   只是位置和尺寸在变，视觉才连续。

   ------------------------------------------------------------------ */

var FLY = (function () {

  var ghost = null;



  /* 书封的"人格"：程序化图案 + 书名 + 钤印。

     🔴 不能用 cloneNode 复制源 canvas —— **canvas 的克隆不复制位图**，

     只会得到一块空白。这里用同一个 drawCoverArt 与同一个 seed 重画一张，

     所以飞行中的封面和落点后的真封面图案逐像素同源。 */

  function coverFace(bk) {

    var p = paletteOf(bk.period);

    var d = document.createElement('div');

    /* 底色与 .sbook .sfront、.f-cover 三者同族，搬运途中才不会「换色」 */

    d.style.cssText = 'position:absolute;inset:0;overflow:hidden;background:' + p.vol;

    var gl = document.createElement('div');

    gl.style.cssText = 'position:absolute;inset:0;' +

      'background:linear-gradient(148deg,rgba(255,255,255,.2),rgba(0,0,0,.12) 62%)';

    d.appendChild(gl);

    var cv = document.createElement('canvas');

    cv.width = 420; cv.height = 620;

    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';

    d.appendChild(cv);

    drawCoverArt(cv, bk.period, 420, 620);

    var t = document.createElement('div');

    t.textContent = '学科信息参考';

    t.style.cssText = 'position:absolute;left:50%;bottom:12%;transform:translateX(-50%);' +

      'font-family:var(--serif);font-size:21px;letter-spacing:.34em;white-space:nowrap;' +

      'color:rgba(247,240,226,.92);text-shadow:0 1px 2px rgba(0,0,0,.35)';

    d.appendChild(t);

    var s = document.createElement('div');

    s.textContent = '衡';

    s.style.cssText = 'position:absolute;right:6%;top:5%;width:34px;height:34px;' +

      'display:grid;place-items:center;background:#F7F2E6;color:' + p.vol + ';' +

      'font-family:var(--serif);font-weight:700;font-size:16px;border-radius:3px;' +

      'box-shadow:inset 0 0 0 2px rgba(247,240,226,.5);transform:rotate(-3deg)';

    d.appendChild(s);

    return d;

  }



  function move(from, to, dur, onDone, face) {

    drop();

    var g = document.createElement('div');

    g.style.cssText = 'position:fixed;z-index:45;pointer-events:none;' +

      'border-radius:2px;overflow:hidden;transform-origin:center center;' +

      'background:#F4EBD9;box-shadow:0 30px 60px -24px rgba(0,0,0,.55);';

    if (face) g.appendChild(face);

    g.style.left = from.left + 'px'; g.style.top = from.top + 'px';

    g.style.width = from.width + 'px'; g.style.height = from.height + 'px';

    document.body.appendChild(g);

    ghost = g;

    var d = dur || T.turn;

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) d = 1;

    g.style.transition =

      'left ' + d + 'ms var(--ease), top ' + d + 'ms var(--ease),' +

      'width ' + d + 'ms var(--ease), height ' + d + 'ms var(--ease),' +

      'opacity ' + T.swap + 'ms linear';

    /* 双层 rAF：单层可能被浏览器合并进同一帧，过渡就完全不跑 */

    requestAnimationFrame(function () {

      requestAnimationFrame(function () {

        if (ghost !== g) return;

        g.style.left = to.left + 'px'; g.style.top = to.top + 'px';

        g.style.width = to.width + 'px'; g.style.height = to.height + 'px';

      });

    });

    setTimeout(function () { onDone && onDone(); }, d);

    return g;

  }

  function drop() {

    if (!ghost) return;

    var g = ghost; ghost = null;

    g.style.opacity = '0';

    setTimeout(function () { g.remove(); }, T.swap + 40);

  }

  return {

    /* pick / shelve 的参数是**已算好的矩形**，不是元素。

       为什么不让调用方传元素：起点常常不是元素本身，而是「按目标缩小后的矩形」

       （架上那本是书脊朝外的，跟封面形状不同，只能自算）。

       ⚠ 改签名时务必连着改实现 —— 这里曾经内部还在对矩形调 getBoundingClientRect，

       一抛错就打断 shelveBack，表现成「点背景归架毫无反应」，真因离症状很远。 */

    pick: function (fromRect, toRect, bk, done) {

      move(fromRect, toRect, 820, done, coverFace(bk));

    },

    shelve: function (fromRect, toRect, bk, done) {

      move(fromRect, toRect, 820, done, coverFace(bk));

    },

    /* 开卷：源是陈列位那本（元素），目标是翻书区。

       🔴 落点必须按**单页比例**算，不能直接铺满翻书区 ——

       翻书区是双页比例（1.4），封面是 0.67，照搬会把封面横向拉扁一半。 */

    lift: function (bookEl, bk, done) {

      var wrap = $('#flipWrap').getBoundingClientRect();

      var h = wrap.height * .86, w = h * .7;

      var to = {

        left: wrap.left + wrap.width / 2 - w / 2,

        top: wrap.top + (wrap.height - h) / 2,

        width: w, height: h

      };

      move(bookEl.getBoundingClientRect(), to, T.turn, done, coverFace(bk));

    },

    drop: drop

  };

})();



/* ------------------------------------------------------------------

   状态机：shelf（书架）⟷ stand（陈列）⟷ reading（翻书）

   ------------------------------------------------------------------ */

var SM = (function () {

  var ALLOWED = {

    shelf: ['stand'],                 /* 抽取 */

    stand: ['opening', 'shelf'],      /* 开卷 / 归架 */

    opening: ['reading', 'stand'],

    reading: ['closing'],

    closing: ['stand']

  };

  var state = 'shelf', hist = [], listeners = [];

  function can(n) { return (ALLOWED[state] || []).indexOf(n) >= 0; }

  function go(n, why) {

    if (n === state) return true;

    if (!can(n)) {

      hist.push('✗ ' + state + ' ⇢ ' + n + '（拒绝：' + why + '）');

      console.warn('[SM] 拒绝非法转移', state, '→', n, why);

      return false;

    }

    var p = state; state = n;

    document.body.dataset.state = n;

    hist.push(p + ' → ' + n + '（' + why + '）');

    live(LABEL[n] || n);

    listeners.forEach(function (f) { f(n, p); });

    return true;

  }

  return {

    get: function () { return state; },

    go: go,

    on: function (f) { listeners.push(f); },

    history: function () { return hist.slice(); }

  };

})();

var LABEL = { shelf: '书架陈列', stand: '卷宗合上', opening: '正在展开',

              reading: '阅读中', closing: '正在合上' };



/* ------------------------------------------------------------------

   READER：翻书（DOM 模式）

   ------------------------------------------------------------------ */

var READER = (function () {

  var pf = null, pages = [], cur = null, idx = 0, firstFlip = true;

  function makeHost() {

    var wrap = $('#flipWrap'), old = $('#flipbook');

    if (old && old.parentNode) old.parentNode.removeChild(old);

    var h = el('div'); h.id = 'flipbook';

    wrap.appendChild(h);

    return h;

  }

  function destroy() {

    if (pf) { try { pf.destroy(); } catch (e) { console.warn('[READER] destroy', e); } pf = null; }

    var h = $('#flipbook');

    if (h && h.parentNode) h.parentNode.removeChild(h);

    pages = [];

  }

  function open(bk) {

    destroy();

    cur = bk;

    var host = makeHost();

    pages = buildBook(bk);

    pages.forEach(function (p) { host.appendChild(p); });

    measurePages(pages);

    drawTrend($('#trendCv', host), DATA.trend, bk.period);

    pf = new St.PageFlip(host, {

      width: 420, height: 600, size: 'stretch',

      /* min/max 必须与 420:600 同比例（0.70），否则窄屏会被拉变形。

         上限放到 700×1000 是为了让大屏能真的把书页撑开。 */

      minWidth: 280, maxWidth: 700, minHeight: 400, maxHeight: 1000,

      maxShadowOpacity: .32, showCover: true, mobileScrollSupport: false,

      usePortrait: true, drawShadow: true, flippingTime: 700, startZIndex: 1,

      autoSize: true, useMouseEvents: true, showPageCorners: true, swipeDistance: 20

    });

    pf.loadFromHTML(pages);

    pf.on('flip', function (e) { onFlip(e.data); });

    pf.on('changeState', function (e) { if (e.data === 'read') onFlip(pf.getCurrentPageIndex()); });

    firstFlip = true;

    idx = 0; onFlip(0);

  }

  function onFlip(i) {

    idx = i;

    /* 首帧是「刚进入阅读」本身，不该补翻页声（那一声归 SFX.open 管）；

       否则一开卷会连响两下。 */

    if (firstFlip) firstFlip = false; else SFX.page();

    $('#rPage').textContent = (i + 1) + ' / ' + pages.length;

    $$('#pager i').forEach(function (d, k) { d.classList.toggle('on', k === Math.round(i)); });

    var bk = cur || {};

    $('#rTitle').textContent = bk.label + ' · 总第' + bk.no + '期';

    $('#rMeta').textContent = '顶尖论文 ' + bk.top_papers_now + ' 篇 · 断言 ' +

      bk.n_assert_pass + '/' + bk.n_assert_total;

  }

  function pager(n) {

    var h = '';

    for (var i = 0; i < n; i++) h += '<i></i>';

    $('#pager').innerHTML = h;

  }

  return {

    open: open, destroy: destroy, pager: pager,

    next: function () { if (pf) pf.flipNext(); },

    prev: function () { if (pf) pf.flipPrev(); },

    index: function () { return idx; },

    count: function () { return pages.length; }

  };

})();

  $('#dLead').textContent = '以 ESI / InCites 指标为基准的双月学科态势报告。' +

    '数字只来自台账，正文由骨架出句，模型不进入数据路径 —— ' +

    '本期覆盖 ' + (bk.coverage || '—') + '，流水线断言 ' +

    bk.n_assert_pass + '/' + bk.n_assert_total + ' 全绿。';



  var d1 = rankDelta(bk.rank_intl_delta);

  var tp = bk.top_papers_delta;

  var tpTxt = tp == null ? '—' : (tp > 0 ? '↑' + tp : tp < 0 ? '↓' + (-tp) : '持平');

  var specs = [

    ['期次', bk.period + ' · 总第 ' + bk.no + ' 期'],

    ['覆盖窗口', (bk.coverage || '—').replace(/-/g, ' – ')],

    ['数据源', '台账 · ESI/InCites 原始包'],

    ['断言', bk.n_assert_pass + ' / ' + bk.n_assert_total + ' <span class="u">全绿</span>'],

    ['国际排名', fmt(bk.rank_intl_now) + ' <span class="u">位 ' + d1.txt + '</span>'],

    ['顶尖论文', fmt(bk.top_papers_now) + ' <span class="u">篇 ' + tpTxt + '</span>']

  ];

  $('#dSpecs').innerHTML = specs.map(function (s) {

    return '<div class="spec"><div class="k">' + s[0] + '</div>' +

      '<div class="v">' + s[1] + '</div></div>';

  }).join('');

}



function cn_no(n) {

  var d = ['〇','一','二','三','四','五','六','七','八','九'];

  var s = String(n), out = '';

  if (s.length === 2) {

    if (s[0] !== '1') out += d[+s[0]];

    out += '十';

    if (s[1] !== '0') out += d[+s[1]];

  } else out = d[+s] || s;

  return out;

}



/* 换卷：底色、书封图案、规格栏一起切 */

var switching = false, firstGo = true;

function goTo(i, focusDot) {

  var n = books.length;

  curIdx = ((i % n) + n) % n;

  var bk = books[curIdx];

  applyPalette(bk.period);

  drawCoverArt($('#coverArt'), bk.period);

  $('#coverSub').textContent = 'WENHENG · ESI ' + bk.period;

  renderDetail(bk);

  /* 换卷／抽取／归架都是一次「搬动一本实体书」，共用同一个音 */

  if (firstGo) firstGo = false; else SFX.pull();

  $$('#dots button').forEach(function (b, k) {

    b.classList.toggle('on', k === curIdx);

    b.setAttribute('aria-selected', k === curIdx ? 'true' : 'false');

  });

  if (focusDot && $('#dots button')[curIdx]) $('#dots button')[curIdx].focus();

}



/* ------------------------------------------------------------------

   书架：装配与抽取

   参考站的要点是「中心卷明确选中 + 单击即命中」，

   所以书本身就是 button，不依赖拖拽；选中态用前移 + 转出封面表达。

   ------------------------------------------------------------------ */

var shelfEls = [], shelfIdx = 0;



function setShelfActive(i) {

  shelfIdx = i;

  shelfEls.forEach(function (b, k) {

    b.classList.toggle('on', k === i);

    b.classList.toggle('dim', k !== i);

  });

}



function buildShelf() {

  var rail = $('#shelfRail');

  rail.innerHTML = '';

  shelfEls = [];

  books.forEach(function (bk, i) {

    var p = paletteOf(bk.period);

    var b = el('button', 'sbook');

    b.type = 'button';

    b.style.setProperty('--sc', p.vol);

    b.setAttribute('aria-label', bk.label + ' 总第' + bk.no + '期，抽取查阅');

    b.title = bk.label + ' · 总第' + bk.no + '期';

    b.innerHTML =

      '<span class="sbox">' +

        '<span class="sfront"><canvas width="280" height="450"></canvas>' +

          '<span class="ft">学科信息参考</span></span>' +

        '<span class="sedge"></span>' +

        '<span class="sspine">' +

          '<span class="sband" style="top:30px"></span>' +

          '<span class="stitle">学科信息参考</span>' +

          '<span class="sno">第' + bk.no + '期</span>' +

        '</span>' +

      '</span>';

    drawCoverArt($('canvas', b), bk.period, 280, 450);

    b.addEventListener('click', function () { pickVolume(i); });

    b.addEventListener('mouseenter', function () { setShelfActive(i); });

    b.addEventListener('focus', function () { setShelfActive(i); });

    rail.appendChild(b);

    shelfEls.push(b);

  });

  /* 架上留一个空位：下一期还没出刊（台账 202609 列为空，是事实不是遗漏） */

  rail.appendChild(el('div', 'sbook-empty', '<span>第39期</span>'));

  setShelfActive(0);

  $('#shelfHint').textContent = '滚轮或 ← → 选卷 · 点击抽取 · Enter 确认';

}



/* 抽取：一张小封面从架上位置长成陈列位的大封面。

   🔴 起点与终点都用**投影后的封面矩形**（getBoundingClientRect 已含 3D 变换），

   并且飞行期间把**源与目标两端都藏起来** —— 否则途中会同时看到三张封面

   （ghost + 架上的 + 陈列位的），那正是「不流畅」的来源。 */

function pickVolume(i) {

  if (SM.get() !== 'shelf') return;

  var el = shelfEls[i];

  if (!el) return;

  setShelfActive(i);

  goTo(i, false);          /* 布面摩擦声由 goTo 统一发，这里别再补一声（会连响两下） */

  SM.go('stand', 'pick');



  var bk = books[i];

  var box = el.getBoundingClientRect();

  var coverEl = $('.book3d .f-cover');

  var toRect = coverEl ? coverEl.getBoundingClientRect()

                       : $('#book3d').getBoundingClientRect();

  var w = toRect.width * .24, h = toRect.height * .24;   /* 起手尺寸：目标的一小块 */

  var fromRect = {

    left: box.left + box.width / 2 - w / 2,

    top: box.top + box.height / 2 - h / 2,

    width: w, height: h

  };

  var sbox = el.querySelector('.sbox');

  var wrap = $('#bookWrap');

  if (sbox) sbox.style.opacity = '0';

  if (wrap) wrap.style.opacity = '0';

  FLY.pick(fromRect, toRect, bk, function () {

    FLY.drop();

    if (wrap) {

      wrap.style.transition = 'opacity 200ms linear';

      wrap.style.opacity = '1';

      setTimeout(function () { wrap.style.transition = ''; }, 260);

    }

    if (sbox) sbox.style.opacity = '';

  });

}



/* 归架：反向飞回，落点吸附到架上那一本。

   同样以**封面矩形**为端点，并在飞行期间藏起两端 —— 与抽取对称。 */

function shelveBack() {

  if (SM.get() !== 'stand') return;

  var el = shelfEls[curIdx];

  if (!el) return;

  SFX.pull();                                  /* 搬动一本实体书的声音 */

  var bk = books[curIdx];

  var box = el.getBoundingClientRect();

  var coverEl = $('.book3d .f-cover');

  var fromRect = coverEl ? coverEl.getBoundingClientRect()

                         : $('#book3d').getBoundingClientRect();

  var w = fromRect.width * .24, h = fromRect.height * .24;

  var toRect = {

    left: box.left + box.width / 2 - w / 2,

    top: box.top + box.height / 2 - h / 2,

    width: w, height: h

  };

  var sbox = el.querySelector('.sbox');

  var wrap = $('#bookWrap');

  if (wrap) { wrap.style.transition = 'opacity 180ms linear'; wrap.style.opacity = '0'; }

  if (sbox) sbox.style.opacity = '0';

  FLY.shelve(fromRect, toRect, bk, function () {

    FLY.drop();

    SM.go('shelf', 'returned');

    if (wrap) { wrap.style.opacity = ''; wrap.style.transition = ''; }

    if (sbox) { sbox.style.opacity = ''; }     /* 交还给 CSS（选中/压暗态由类控制） */

  });

}



/* ------------------------------------------------------------------

   书：拖拽旋转 + 复位

   ------------------------------------------------------------------ */

var ROT = { x: 5, y: -10 };

function applyRot() {

  var b = $('#book3d');

  b.style.transform = 'rotateX(' + ROT.x + 'deg) rotateY(' + ROT.y + 'deg)';

}

(function bindDrag() {

  var b = $('#book3d'), dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = 0;

  b.addEventListener('pointerdown', function (e) {

    if (SM.get() !== 'stand') return;

    dragging = true; moved = 0;

    sx = e.clientX; sy = e.clientY; ox = ROT.y; oy = ROT.x;

    b.classList.add('grabbing');

    b.setPointerCapture && b.setPointerCapture(e.pointerId);

  });

  b.addEventListener('pointermove', function (e) {

    if (!dragging) return;

    var dx = e.clientX - sx, dy = e.clientY - sy;

    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));

    ROT.y = clamp(ox + dx * .34, -42, 42);

    ROT.x = clamp(oy - dy * .22, -16, 22);

    applyRot();

  });

  b.addEventListener('pointerup', function (e) {

    if (!dragging) return;

    dragging = false; b.classList.remove('grabbing');

    // 拖动过就不算点击，免得想转视角的人误触开卷

    if (moved < 6) openReader();

  });

  b.addEventListener('pointercancel', function () { dragging = false; b.classList.remove('grabbing'); });

  b.addEventListener('keydown', function (e) {

    if (e.key === 'Enter' || e.key === ' ') { openReader(); e.preventDefault(); }

  });

})();



/* ------------------------------------------------------------------

   开卷 / 合上

   ------------------------------------------------------------------ */

function openReader() {

  if (SM.get() !== 'stand') return;

  SM.go('opening', 'click');

  SFX.open();

  var bk = books[curIdx];

  /* 先藏源再起飞：opacity 不参与布局，源矩形照样有效。

     不藏的话飞行途中会同时看到 ghost 和真书 —— 就是「双影」。 */

  var wrap = $('#bookWrap');

  if (wrap) wrap.style.opacity = '0';

  FLY.lift($('#book3d'), bk, function () {

    if (SM.get() !== 'opening') return;

    try {

      READER.open(bk);

    } catch (err) {

      console.error('[open] 翻书初始化失败，退回陈列', err);

      FLY.drop();

      if (wrap) wrap.style.opacity = '';      /* 失败路径同样要还原，否则书会「消失」 */

      SM.go('closing', 'reader failed');

      SM.go('stand', 'reader failed');

      return;

    }

    READER.pager(8);

    $('#reader').classList.add('on');

    SM.go('reading', 'reader ready');

    requestAnimationFrame(function () {

      requestAnimationFrame(function () { FLY.drop(); });

    });

  });

}

function closeReader() {

  if (SM.get() === 'stand') return;

  if (!SM.go('closing', '合上')) return;

  SFX.close();

  FLY.drop();

  var wait = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : T.swap;

  setTimeout(function () {

    // 收尾必须无条件走完：清理抛异常曾把状态机永久卡在中间态

    try { READER.destroy(); } catch (e) { console.warn('[close] 清理失败', e); }

    $('#reader').classList.remove('on');

    /* 开卷时把陈列位的书藏起来了（避免与 ghost 双影），合上后必须还回来 */

    var wrap = $('#bookWrap');

    if (wrap) wrap.style.opacity = '';

    SM.go('stand', 'closed');

    /* 回架时把视角也复位，免得下次进来是歪的 */

    ROT.x = 5; ROT.y = -10; applyRot();

  }, wait);

}



/* ------------------------------------------------------------------

   事件

   ------------------------------------------------------------------ */

$('#dots').addEventListener('click', function (e) {

  var b = e.target.closest('button');

  if (!b) return;

  goTo($$('#dots button').indexOf(b), true);

});

$('#btnPrev').addEventListener('click', function () { goTo(curIdx + 1, true); });  /* 倒序数组：+1 = 更早 */

$('#btnNext').addEventListener('click', function () { goTo(curIdx - 1, true); });

/* 同一个命令键在不同状态做不同的事：书架态＝抽取，陈列态＝开卷 */

$('#cmdOpen').addEventListener('click', function () {

  if (SM.get() === 'shelf') pickVolume(shelfIdx); else openReader();

});

$('#cmdShelf').addEventListener('click', shelveBack);

$('#cmdReset').addEventListener('click', function () {

  ROT.x = 5; ROT.y = -10;

  var b = $('#book3d');

  b.style.transition = 'transform ' + T.turn + 'ms var(--ease)';

  applyRot();

  setTimeout(function () { b.style.transition = 'transform 120ms linear'; }, T.turn + 40);

  live('视角已复位');

});

$('#btnToggle').addEventListener('click', function () {

  document.body.classList.toggle('detail-off');

  live(document.body.classList.contains('detail-off') ? '规格栏已收起' : '规格栏已展开');

});

/* ---- 声音 ----

   不自动开（浏览器会拦，演示现场也不希望自己响）。但若上次开过，

   就在**第一次用户手势**时恢复 —— 手势是播放的硬前提。 */

function syncSound() {

  var b = $('#btnSound');

  if (!b) return;

  b.setAttribute('aria-pressed', SFX.on() ? 'true' : 'false');

  b.title = SFX.on() ? '声音：开（点击关闭）' : '声音：关（点击开启）';

}

var soundArmed = false;

function armSound() {

  if (soundArmed) return;

  soundArmed = true;

  if (SFX.supported() && SFX.preferOn()) { SFX.set(true); syncSound(); }

}

document.addEventListener('pointerdown', armSound, { once: true });

document.addEventListener('keydown', armSound, { once: true });

$('#btnSound').addEventListener('click', function () {

  if (!SFX.supported()) { live('此浏览器不支持音频合成'); return; }

  soundArmed = true;

  var v = SFX.toggle();

  syncSound();

  live(v ? '声音已开启' : '声音已关闭');

});



/* ---- 点背景即退出（不摆「关闭」按钮，背景本身就是出口）----

   翻书态：点书页之外的背景 = 合上。书页区与上下控制条要排除 ——

   点页面是翻页，点控制条是操作，都不该被当成「退出」。 */

$('#reader').addEventListener('click', function (e) {

  if (e.target.closest('.flip-wrap') || e.target.closest('.reader-bar')) return;

  closeReader();

});



/* 陈列态：点书以外的背景 = 归架（与「点书开卷」互不干扰）。

   ⚠ 两件事都要判断：状态是 stand，且点的不在书上/不在按钮上 ——

   否则点「开卷」按钮会先开卷、再被这层判成归架，一次点击做两件相反的事。 */

$('.vh-main').addEventListener('click', function (e) {

  if (SM.get() !== 'stand') return;

  if (e.target.closest('.book3d')) return;

  if (e.target.closest('button, a, input, select, label')) return;

  shelveBack();

});

$('#rPrev').addEventListener('click', function () { READER.prev(); });

$('#rNext').addEventListener('click', function () { READER.next(); });



document.addEventListener('keydown', function (e) {

  var st = SM.get();

  if (e.key === 'Escape') {

    if (st === 'reading') closeReader();

    else if (st === 'stand') shelveBack();

    return;

  }

  if (st === 'reading') {

    if (e.key === 'ArrowRight') { READER.next(); e.preventDefault(); }

    else if (e.key === 'ArrowLeft') { READER.prev(); e.preventDefault(); }

    return;

  }

  var n = books.length;

  if (st === 'shelf') {

    /* 书架：← → 移动选中，Enter 抽取（单击同样有效 —— 参考站特意点明「不要依赖拖拽」） */

    if (e.key === 'ArrowRight') { setShelfActive((shelfIdx + 1) % n); e.preventDefault(); }

    else if (e.key === 'ArrowLeft') { setShelfActive((shelfIdx - 1 + n) % n); e.preventDefault(); }

    else if (e.key === 'Enter' || e.key === ' ') { pickVolume(shelfIdx); e.preventDefault(); }

    return;

  }

  /* 陈列：← → 换卷 */

  if (e.key === 'ArrowRight') { goTo(curIdx - 1, true); e.preventDefault(); }

  else if (e.key === 'ArrowLeft') { goTo(curIdx + 1, true); e.preventDefault(); }

});



/* 书架态滚轮选卷 */

window.addEventListener('wheel', function (e) {

  if (SM.get() !== 'shelf') return;

  if (Math.abs(e.deltaY) < 4 && Math.abs(e.deltaX) < 4) return;

  var d = (e.deltaY || e.deltaX) > 0 ? 1 : -1;

  setShelfActive((shelfIdx + d + books.length) % books.length);

}, { passive: true });



/* 命令区的文案随状态走：书架态是「抽取」，陈列态才是「开卷」。

   抽成具名函数是为了能在 boot 里补调一次 —— 监听器只在**状态变化**时触发，

   首屏那次不变，于是初始文案就一直是 HTML 里写死的那份。 */

function syncCommands(st) {

  var open = $('#cmdOpen');

  if (open) open.textContent = (st === 'shelf') ? '抽取' : '开卷';

  var sh = $('#cmdShelf');

  if (sh) sh.hidden = (st !== 'stand');

  var rs = $('#cmdReset');

  if (rs) rs.hidden = (st === 'shelf');

  /* 提示随状态改：退出方式从「按钮」改成「点背景」之后，

     不写出来就没人知道 —— 这是拿掉按钮必须付的代价。

     书架态留空：那一屏的提示已经写在书架正下方（#shelfHint），

     页脚再写一遍就是同一句话说两次。 */

  var fh = $('#footHint');

  if (fh) {

    fh.textContent = (st === 'shelf')

      ? ''

      : '拖拽书封转动 · 点击展开 · 点背景归架 ·';

  }

}

SM.on(syncCommands);



function live(t) { var n = $('#live'); if (n) n.textContent = t; }



/* ------------------------------------------------------------------

   启动

   ------------------------------------------------------------------ */

function boot() {

  if (!books.length) {

    document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">' +

      '缺少 data.js —— 请先运行 wenheng/tmp/build_data.py。</p>';

    return;

  }

  TEX.install();

  applyPalette();

  $$('[data-palette-choice]').forEach(function (button) {
    button.setAttribute('aria-pressed', String(button.dataset.paletteChoice === palette));
    button.addEventListener('click', function () { setPalette(button.dataset.paletteChoice); });
  });

  $('#dots').innerHTML = books.map(function () { return '<button type="button"></button>'; }).join('');

  document.body.dataset.state = SM.get();   /* 初始态也要落到 DOM 上，否则首屏两套视图同时可见 */

  syncCommands(SM.get());                   /* 同理：命令区文案不能只靠「状态变化」来初始化 */

  buildShelf();

  goTo(0, false);

  applyRot();

  syncSound();

  if (location.search.indexOf('selftest') >= 0) {

    console.log('%c[selftest] 历期卷宗', 'font-weight:700');

    console.log('卷数 =', books.length, '| 当期 =', books[0].period);

    console.log('封面图案已绘 =', !!$('#coverArt').getContext('2d').getImageData(170, 160, 1, 1).data[3]);

    console.log('规格栏格数 =', $$('#dSpecs .spec').length);

  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyRot);

  else applyRot();

}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);

else boot();



/* 供无头自测驱动 */

window.WH_VOL = {

  state: function () { return SM.get(); },

  history: function () { return SM.history(); },

  index: function () { return curIdx; },

  goto: goTo, open: openReader, close: closeReader,

  budget: function () { return window.WH_PAGE_BUDGET || []; },

  sfx: function () {

    var o = { on: SFX.on(), supported: SFX.supported(), ctx: SFX.state(),

              pressed: $('#btnSound').getAttribute('aria-pressed') };

    var extra = SFX.info ? SFX.info() : {};

    for (var k in extra) if (extra.hasOwnProperty(k)) o[k] = extra[k];

    return o;

  },

  palette: function () {

    return { vol: getComputedStyle(document.documentElement).getPropertyValue('--vol').trim() };

  },

  data: function () { return DATA; }

};

})();

<script>
/* 只有被前端应用托管时才显示「回工作台」；双击 file:// 打开时保持原样 */
(function () {
  if (location.protocol === 'file:') return;

  if (a) a.hidden = false;

  /* 只在被前端托管时加的两条样式（file:// 双击打开时页面保持原样） */
  var st = document.createElement('style');
  st.textContent =
    '.shelf-view, body{overflow-x:hidden}' +   /* 装饰性背板在窄屏会溢出，只裁横向 */
    '.api-note{position:fixed; left:50%; bottom:14px; transform:translateX(-50%);' +
    ' font-family:var(--mono); font-size:11px; letter-spacing:.08em;' +
    ' color:rgba(240,232,216,.62); pointer-events:none; white-space:nowrap}' +
    '.sbook.is-signed::after{content:""; position:absolute; top:10px; right:10px;' +
    ' width:9px; height:9px; border-radius:2px; background:var(--stamp);' +
    ' box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}';
  document.head.appendChild(st);

  /* 书架跟 /api/periods 对齐（契约见 docs/前后端分工与接口契约（2026-09-23）.md）
     目的：**不让两边分叉**——期次与签单状态以服务端为准。
     匹配用前缀（G 是 202605，服务端可能是 202605_复现）；多个候选就当没找到，不乱猜。 */
  fetch('/api/periods', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.periods || !j.periods.length) return;
      var api = j.periods, byKey = {};
      api.forEach(function (p) { byKey[p.period] = p; });
      function find(period) {
        if (byKey[period]) return byKey[period];
        var hit = Object.keys(byKey).filter(function (x) {
          return x.indexOf(period) === 0;
        });
        return hit.length === 1 ? byKey[hit[0]] : null;
      }
      var books = (window.WH_DATA && window.WH_DATA.books) || [];
      var signed = 0, unknown = 0;
      books.forEach(function (b) {
        var p = find(b.period);
        if (!p) { unknown++; return; }
        if (p.status === 'signed') signed++;
      });
      var missing = api.filter(function (p) {
        return !books.some(function (b) { return p.period.indexOf(b.period) === 0; });
      });

      var note = document.createElement('div');
      note.className = 'api-note';
      var txt = '与后端对齐：服务端 ' + api.length + ' 期 · 已签发 ' + signed + ' 期';
      if (missing.length) txt += ' · 架上还没有完整数据的 ' + missing.length + ' 期';
      if (unknown) txt += ' · 有 ' + unknown + ' 期与期次清单对不上（未标注状态）';
      note.textContent = txt;
      document.body.appendChild(note);
    })
    .catch(function () { /* 服务端不在也不影响书架本身 */ });
})();
</script>
