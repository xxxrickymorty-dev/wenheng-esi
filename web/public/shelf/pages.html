const panels=[];
function pages(){return `<div class="book-page-face"></div><div class="book-pages">${Array.from({length:20},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div>`}

function reissue(b){return b.period==='202609'?'':`<div class="cover-reissue" aria-hidden="true"><div class="cp-top"><span class="cp-issue">${b.issue}</span><span class="cp-total">总第 ${b.total} 期</span></div><span class="cp-mask"></span><span class="cp-number">${b.period}</span><span class="cp-date">${b.month}</span></div>`}

function panelMarkup(b,i){
 const entries=`<div class="entry-group"><h2 class="section-label">本期入口</h2><div class="entry-stack"><button class="entry-row" data-read="${i}"><span>翻阅本期<small>封面 · 目录 · 名词解释</small></span><span class="arrow">↗</span></button></div></div><div class="entry-group"><h2 class="section-label">继续查阅</h2><div class="entry-stack"><button class="entry-row" data-toc="${i}"><span>本期目录<small>六章，向下翻到目录</small></span><span class="arrow">↓</span></button><a class="entry-row" href="/app/?period=${b.period}" target="_top"><span>回工作台看完整数值<small>正文、指标表与运行记录</small></span><span class="arrow">↗</span></a></div></div>`;
 const terms=TERMS.map((t,n)=>`<article class="term"><span class="term-no">0${n+1}</span><h2>${t[0]}</h2><p>${t[1]}</p><small>${t[2]}</small></article>`).join('');
 const toc=TOC.map(t=>`<li><button data-read-toc="${i}"><span>${t[0]}</span><span>${t[1]}</span><span>${t[2]}</span></button></li>`).join('');
 return `<section class="issue-panel${i===0?' is-first':''}" id="issue-${b.period}" data-index="${i}" aria-labelledby="title-${b.period}">
  
  <h1 id="title-${b.period}">学科信息参考</h1>
  <p class="byline">${b.issue} · 总第 ${b.total} 期</p><p class="byline-src">${b.design}装帧 · 云南大学图书馆 编</p><div class="title-rule" aria-hidden="true"></div>
  <p class="lede">${b.desc}</p><p class="hero-note">数字只来自本期动态监测表。这里展示成刊的外衣、目录与读法。</p>
  ${entries}
  <section class="editor"><h2 class="section-label">编者</h2><p>云南大学图书馆学科服务部。每一期从取数、核对到出稿、签发，一步一步留痕，再装帧成册。</p><p>这里只陈列封面、目录与名词解释；要看正文和数值，请从上面的入口回到工作台。</p></section>
  <section class="glossary"><h2 class="section-label">同词同义</h2><div class="glossary-grid">${terms}</div></section>
  <section class="contents" id="toc-${b.period}"><p class="kicker">CONTENTS / ${b.period}</p><h2>本期目录</h2><ol class="toc-list">${toc}</ol><aside class="boundary"><h2>馆藏阅读范围</h2><p>陈列馆只向外展开这一册允许公开的三页内容。</p><ul><li>封面</li><li>目录</li><li>名词解释</li><li class="no">正文数值 · 不出馆</li><li class="no">运行记录 · 不出馆</li><li class="no">台账原件 · 不出馆</li></ul></aside></section>
  <p class="panel-end"><span>${i===BOOKS.length-1?'已到最后一册':'继续向下，取出下一册'}</span><button data-jump="${(i+1)%BOOKS.length}">${i===BOOKS.length-1?'回第一册':'下一册'} <span>↓</span></button></p>
 </section>`;
}
const rail=$('rail');
BOOKS.forEach((b,i)=>{
 story.insertAdjacentHTML('beforeend',panelMarkup(b,i));
 const nav=document.createElement('button');nav.type='button';nav.dataset.index=i;nav.dataset.period=b.period;nav.setAttribute('aria-label',`定位到 ${b.period}，${b.issue}`);nav.innerHTML=`<span>${b.period}</span>`;nav.addEventListener('click',()=>jumpToIssue(i));rail.appendChild(nav);

story.querySelectorAll('.issue-panel').forEach(p=>panels.push(p));
const navs=[...rail.children];

function wash(theme,animate){
 const layers=[$('washA'),$('washB')],on=layers.find(x=>x.classList.contains('is-on')),next=layers.find(x=>x!==on)||layers[0];
 next.style.backgroundImage=`linear-gradient(118deg,${theme[0]} 0%,${theme[1]} 34%,${theme[2]} 69%,${theme[3]} 100%)`;
 if(!animate){layers.forEach(l=>l.classList.remove('is-on'));next.classList.add('is-on');return}
 next.classList.add('is-on');if(on)on.classList.remove('is-on');
 document.documentElement.style.setProperty('--stage-solid',theme[1]);
}
function renderBook(i){book.innerHTML=bookMarkup(BOOKS[i])}
function applyAngles(){book.style.setProperty('--rx',angles.x.toFixed(2)+'deg');book.style.setProperty('--ry',angles.y.toFixed(2)+'deg');book.style.setProperty('--rz',angles.z.toFixed(2)+'deg');book.style.setProperty('--lx',Math.max(-46,Math.min(46,-angles.y*1.15)).toFixed(1)+'px');book.style.setProperty('--ly',Math.max(-18,Math.min(18,angles.x*1.6)).toFixed(1)+'px');contact.style.setProperty('--sx',Math.max(-24,Math.min(38,9+(angles.y+22)*-1.1)).toFixed(1)+'px');contact.style.setProperty('--ss',(1+Math.min(.42,Math.abs(angles.y+22)/200)).toFixed(2))}
function setPose(name,animate=true){
 manual=true;angles={...POSES[name]};book.style.transition=animate&&!reduce?'transform .84s var(--ease)':'';applyAngles();
 if(!animate)setTimeout(()=>book.style.transition='',0);
}
function updateChrome(i){
 const b=BOOKS[i];$('stageDesign').textContent=`${b.design}装帧`;$('stageVolume').textContent=`VOL. ${String(b.total).padStart(2,'0')} / ${b.period}`;
 document.documentElement.style.setProperty('--stage-solid',b.theme[1]);
 navs.forEach((n,k)=>n.setAttribute('aria-current',k===i?'true':'false'));
 document.title=`学科信息参考 · ${b.period} — 文衡`;
 live.textContent=`当前展示 ${b.period}，${b.issue}，总第 ${b.total} 期，${b.design}装帧。`;
 try{const u=new URL(location.href);u.searchParams.set('period',b.period);history.replaceState(null,'',u)}catch(e){}
}
function switchTo(i,instant=false){
 if(i===active&&i===rendered&&!isSwapping)return;
 active=i;updateChrome(i);wash(BOOKS[i].theme,!instant);
 if(instant||reduce){renderBook(i);rendered=i;angles={...POSES.front};book.style.transition='';applyAngles();isSwapping=false;pending=-1;isInitial=false;return}
 if(isSwapping){pending=i;return}
 if(i===rendered){isInitial=false;return}
 isSwapping=true;
 const target=i;
 book.style.transition='transform .26s cubic-bezier(.4,0,1,1)';
 angles={x:4,y:94,z:-3};applyAngles();
 setTimeout(()=>{
  if(active!==target){isSwapping=false;if(active!==rendered)switchTo(active,false);return}
  renderBook(target);rendered=target;
  angles={x:4,y:94,z:-3};book.style.transition='';applyAngles();
  requestAnimationFrame(()=>{
   book.style.transition='transform .8s var(--ease)';angles={...POSES.front};applyAngles();
   setTimeout(()=>{
    book.style.transition='';isSwapping=false;manual=false;isInitial=false;
    const p=pending;pending=-1;if(p>=0&&p!==rendered)switchTo(p,false);
   },810);
  });
 },260);
}
function stageOffset(){return innerWidth<=900?document.querySelector('.stage-col').getBoundingClientRect().height:0}
function jumpToIssue(i){const p=panels[(i+BOOKS.length)%BOOKS.length];scrollTo({top:Math.max(0,p.offsetTop-stageOffset()),behavior:reduce?'auto':'smooth'})}
function observe(){
 const mid=innerWidth<=900?innerHeight*.72:innerHeight*.48;let found=0;
 panels.forEach((p,i)=>{const r=p.getBoundingClientRect();if(r.top<=mid&&r.bottom>mid)found=i});
 if(found!==active)switchTo(found);
}
let scrollRaf=0;addEventListener('scroll',()=>{if(scrollRaf)return;scrollRaf=requestAnimationFrame(()=>{scrollRaf=0;observe();if(!manual&&!isSwapping&&!drag){const p=panels[active],r=p.getBoundingClientRect(),prog=Math.max(0,Math.min(1,-r.top/Math.max(1,r.height-innerHeight)));book.style.transition='transform .18s ease-out';angles={x:6+prog*1.8,y:-22-prog*11,z:-3};applyAngles()}})},{passive:true});
function onDown(e){if(isSwapping||(e.button!==undefined&&e.button!==0))return;book.style.transition='none';book.style.setProperty('--hx','0deg');book.style.setProperty('--hy','0deg');drag={id:e.pointerId,x:e.clientX,y:e.clientY,bx:angles.x,by:angles.y};scene.setPointerCapture(e.pointerId);book.classList.add('is-dragging');manual=true}
function onMove(e){

  if(!drag&&e.pointerType==='mouse'&&!reduce){const r=scene.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;book.style.transition='transform .18s ease-out';book.style.setProperty('--lx',(nx*86).toFixed(1)+'px');book.style.setProperty('--ly',(ny*34).toFixed(1)+'px');book.style.setProperty('--hx',(-ny*1.8).toFixed(2)+'deg');book.style.setProperty('--hy',(nx*2.4).toFixed(2)+'deg')}
  return;
 }
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;angles.y=Math.max(-206,Math.min(206,drag.by+dx*.24));angles.x=Math.max(-16,Math.min(18,drag.bx-dy*.14));applyAngles()
}
function onUp(e){if(!drag||drag.id!==e.pointerId)return;drag=null;book.classList.remove('is-dragging')}
scene.addEventListener('pointerdown',onDown);scene.addEventListener('pointermove',onMove);scene.addEventListener('pointerup',onUp);scene.addEventListener('pointercancel',onUp);
scene.addEventListener('pointerleave',()=>{if(drag)return;book.style.transition='transform .42s var(--ease)';book.style.setProperty('--hx','0deg');book.style.setProperty('--hy','0deg');applyAngles()});

 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','f','F'].includes(e.key))return;e.preventDefault();manual=true;
 if(e.key==='ArrowLeft')angles.y=Math.max(-206,angles.y-8);if(e.key==='ArrowRight')angles.y=Math.min(206,angles.y+8);
 if(e.key==='ArrowUp')angles.x=Math.max(-16,angles.x-5);if(e.key==='ArrowDown')angles.x=Math.min(18,angles.x+5);
 if(e.key==='Home'||e.key==='f'||e.key==='F')angles={...POSES.front};applyAngles()
});

function readerContent(i){
 const b=BOOKS[i];
 if(readerIndex===0)return `<p class="kicker">${b.period} / ${b.design}装帧</p><h2>学科信息参考</h2><p class="reader-lead">${b.desc}</p><div class="title-rule"></div><p>${b.issue} · 总第 ${b.total} 期<br>云南大学图书馆 · 学科服务部</p>`;
 if(readerIndex===1)return `<p class="kicker">CONTENTS / ${b.period}</p><h2>本期目录</h2><ol>${TOC.map(t=>`<li><span>${t[0]}</span><span>${t[1]}</span><span>${t[2]}</span></li>`).join('')}</ol>`;
 return `<p class="kicker">GLOSSARY / 一词一义</p><h2>名词解释</h2><div class="reader-terms">${TERMS.map(t=>`<section><h3>${t[0]}</h3><p>${t[1]}</p></section>`).join('')}</div>`;
}
let readerIssue=0;
function paintReader(animate=true){if(animate&&!reduce){readerPage.classList.remove('turning');void readerPage.offsetWidth;readerPage.classList.add('turning')}readerPage.innerHTML=readerContent(readerIssue);$('readerCount').textContent=`${readerIndex+1} / 3`;$('readerPrev').disabled=readerIndex===0;$('readerNext').disabled=readerIndex===2;$('readerTitle').textContent=`学科信息参考 · ${BOOKS[readerIssue].period}`}
function openReader(i,pageIndex=0){readerIssue=i;readerIndex=pageIndex;paintReader(false);reader.showModal()}
story.addEventListener('click',e=>{
 const read=e.target.closest('[data-read]'), toc=e.target.closest('[data-toc]'), readToc=e.target.closest('[data-read-toc]'), jump=e.target.closest('[data-jump]');
 if(read)openReader(Number(read.dataset.read),0);
 else if(toc){const p=story.querySelector(`#toc-${BOOKS[Number(toc.dataset.toc)].period}`);scrollTo({top:p.getBoundingClientRect().top+scrollY-40,behavior:reduce?'auto':'smooth'})}
 else if(readToc)openReader(Number(readToc.dataset.readToc),1);
 else if(jump)jumpToIssue(Number(jump.dataset.jump));
});
$('readerClose').addEventListener('click',()=>reader.close());$('readerPrev').addEventListener('click',()=>{if(readerIndex>0){readerIndex--;paintReader()}});$('readerNext').addEventListener('click',()=>{if(readerIndex<2){readerIndex++;paintReader()}});
reader.addEventListener('click',e=>{if(e.target===reader)reader.close()});
const help=$('helpDialog');$('helpOpen').addEventListener('click',()=>help.showModal());$('helpClose').addEventListener('click',()=>help.close());help.addEventListener('click',e=>{if(e.target===help)help.close()});
addEventListener('keydown',e=>{if(reader.open&&e.key==='ArrowRight'&&readerIndex<2){readerIndex++;paintReader()}else if(reader.open&&e.key==='ArrowLeft'&&readerIndex>0){readerIndex--;paintReader()}});
const qp=new URLSearchParams(location.search).get('period');const start=Math.max(0,BOOKS.findIndex(b=>b.period===qp));
active=start;rendered=start;renderBook(start);updateChrome(start);wash(BOOKS[start].theme,false);applyAngles();isInitial=false;
if(start>0)requestAnimationFrame(()=>{scrollTo({top:Math.max(0,panels[start].offsetTop-stageOffset()),behavior:'instant'});observe()});
else observe();

/* 被书架页嵌入时：左上馆徽与左侧返回箭头通知外层回书架 */
document.querySelector('.chrome .brand').addEventListener('click', () => window.parent.postMessage('backToShelf', '*'));
document.querySelector('.chrome .back').addEventListener('click', () => window.parent.postMessage('backToShelf', '*'));
})();
</script>
