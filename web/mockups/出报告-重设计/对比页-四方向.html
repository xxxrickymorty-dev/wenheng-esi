.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

vory:hover{background:#FFF9E6}\n  .hero .ghost{color:rgba(246,241,222,.8);font-size:13.5px;border-bottom:1px solid rgba(246,241,222,.35);padding-bottom:3px}\n  /* 幕布右下：一条实物般的读数带（实色墨绿压深，不是玻璃） */\n  .reads{position:absolute;right:0;bottom:0;display:flex;background:rgba(9,28,21,.86);border-top:1px solid rgba(246,241,222,.16)}\n  .reads div{padding:16px 26px;border-left:1px solid rgba(246,241,222,.12);text-align:left}\n  .reads .k{font-size:10.5px;letter-spacing:.22em;color:rgba(246,241,222,.55)}\n  .reads .v{font-family:var(--serif);font-size:19px;color:var(--ivory);margin-top:5px}\n  .reads .v small{font-size:12.5px;color:rgba(246,241,222,.7);font-family:var(--sans);margin-left:7px}\n\n  /* ---- 纸面 ---- */\n  .wrap{max-width:1160px;margin:0 auto;padding:44px 44px 90px}\n  .steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);position:relative}\n  .steps .pr{position:absolute;top:0;left:0;height:2px;width:75%;background:var(--green)}\n  .steps .pr-t{position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-2)}\n  .st{padding:18px 16px 16px 0;border-right:1px solid var(--line-2)}\n  .st:last-child{border-right:0}\n  .st .lb{font-size:13.5px;color:var(--ink-3)}\n  .st .ms{font-size:12.5px;color:var(--ink-3);margin-top:3px}\n  .st.done .lb{color:var(--ink-2)}\n  .st.done .ms::before{content:\"✓ \";color:var(--green)}\n  .st.now .lb{color:var(--ink);font-weight:650}\n  .st.now .lb::before{content:\"■ \";font-size:9px;color:var(--green);vertical-align:middle}\n  .grid{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;margin-top:38px;padding-bottom:38px;border-bottom:1px solid var(--line)}\n  .receipt h3{font-size:20px;display:flex;align-items:center;gap:9px}\n  .receipt h3::before{content:\"✓\";font-family:var(--sans);font-size:12px;color:var(--green);border:1px solid var(--green);width:20px;height:20px;display:grid;place-items:center}\n  .receipt p{color:var(--ink-2);font-size:13.5px;max-width:54ch;margin-top:12px}\n  .receipt .lnx{display:flex;gap:22px;margin-top:18px;font-size:13.5px}\n  .receipt .lnx a{border-bottom:1px solid var(--line);padding-bottom:2px}\n  .receipt .lnx a:hover{border-color:var(--green);color:var(--green)}\n  .kv{list-style:none;border-top:2px solid var(--ink)}\n  .kv li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}\n  .kv dt{color:var(--ink-3);flex-shrink:0}\n  .kv dd{color:var(--ink-2);text-align:right}\n\n  .pick{margin-top:44px}\n  .pick .hd{display:flex;align-items:baseline;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px}\n  .pick h2{font-size:22px}\n  .pick .lnk{margin-left:auto;font-size:13.5px;color:var(--green);border-bottom:1px solid var(--green);padding-bottom:2px}\n  .routes{display:flex;gap:26px;margin:14px 0 2px;font-size:13.5px;color:var(--ink-3)}\n  .routes .on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--green);padding-bottom:5px}\n  table{width:100%;border-collapse:collapse}\n  th{font-size:11.5px;letter-spacing:.2em;color:var(--ink-3);text-align:left;font-weight:400;padding:12px 0 9px;border-bottom:1px solid var(--line)}\n  td{padding:9.5px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}\n  td.mdl{color:var(--ink-2)}\n  td.pk b{font-family:var(--serif)}\n  .chg{color:#9C4A3C;font-size:12.5px;margin-left:8px}\n  .chg::before{content:\"◆ \";font-size:9px;vertical-align:1px}\n  .dflt{color:var(--ink-3);font-size:13px}\n  .save{margin-top:14px;font-size:13px;color:var(--ink-3)}\n  .rel{margin-top:26px;padding-top:14px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3);max-width:90ch}\n  .rel b{color:var(--ink-2)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003c!-- 顶栏 -->\n  \u003cheader class=\"top\">\n    \u003cspan class=\"bm\">\u003cb>文衡\u003c/b>\u003cspan>云南大学图书馆 · 学科信息参考\u003c/span>\u003c/span>\n    \u003cnav aria-label=\"工作区\">\n      \u003ca class=\"on\" href=\"#\">出报告\u003c/a>\u003ca href=\"#\ 3c/div>\u003c/div>\n      \u003cdiv class=\"st now\">\u003cdiv class=\"lb\">生成初稿\u003c/div>\u003cdiv class=\"ms\">已出稿 · 2026-10-13 15:03\u003c/div>\u003c/div>\n      \u003cdiv class=\"st\">\u003cdiv class=\"lb\">核验与定稿\u003c/div>\u003cdiv class=\"ms\">待办 · 复核后签单\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"grid\">\n      \u003cdiv class=\"receipt\">\n        \u003ch3>本期报告已生成\u003c/h3>\n        \u003cp>任务结束不代表报告合格或已签发——管理员当前不能下载未签发的初稿。复核无异议后签单，这一版即可交付。\u003c/p>\n        \u003cdiv class=\"lnx\">\u003ca href=\"#\">打开报告 →\u003c/a>\u003ca href=\"#\">去审核台 →\u003c/a>\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003cul class=\"kv\">\n          \u003cli>\u003cdt>期次\u003c/dt>\u003cdd>202609（第 39 期）\u003c/dd>\u003c/li>\n          \u003cli>\u003cdt>预测数据 / 实际输出\u003c/dt>\u003cdd>202609 / 202609\u003c/dd>\u003c/li>\n          \u003cli>\u003cdt>台账文件\u003c/dt>\u003cdd>云大全学科排名、阈值动态检测表.xlsx\u003c/dd>\u003c/li>\n          \u003cli>\u003cdt>最后修改\u003c/dt>\u003cdd>2026 年 9 月 28 日 07:55\u003c/dd>\u003c/li>\n          \u003cli>\u003cdt>任务\u003c/dt>\u003cdd>已完成\u003c/dd>\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"pick\">\n      \u003cdiv class=\"hd\">\u003ch2>本期选模\u003c/h2>\u003ca class=\"lnk\" href=\"#\">去预测台看图改选 →\u003c/a>\u003c/div>\n      \u003cdiv class=\"routes\">\u003cspan class=\"on\">路线1 · 总被引 / ESI 前 1% 被引阈值\u003c/span>\u003cspan>路线2 · 国内排名 / 国内前 1% 机构数\u003c/span>\u003c/div>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth style=\"width:30%\">潜力学科\u003c/th>\u003cth style=\"width:34%\">V1 推荐\u003c/th>\u003cth>本期已选\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>免疫学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"pk\">\u003cb>SARIMA 模型\u003c/b>\u003cspan class=\"chg\">已改选\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分子生物学与遗传学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>多学科\u003c/td>\u003ctd class=\"mdl\">Holt 趋势模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>物理学\u003c/td>\u003ctd class=\"mdl\">经验贝叶斯状态空间模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>神经科学与行为科学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>空间科学\u003c/td>\u003ctd class=\"mdl\">SARIMA 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>精神病学与心理学\u003c/td>\u003ctd class=\"mdl\">经验贝叶斯状态空间模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经济与商业\u003c/td>\u003ctd class=\"mdl\">SARIMA 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv class=\"save\">已保存 · admin · 2026-10-16 12:12\u003c/div>\n      \u003cp class=\"rel\">\u003cb>与报告的关系\u003c/b>　任务启动时固定读取本期已保存选择。重出后，未进 1% 的学科都会按你的选择出图（进本期图册），报告正文用接近度前二；所选模型若无法运行，仍按现有规则回退 V1 推荐并留下提醒。\u003c/p>\n    \u003c/section>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "丁-幕布.html", "baseline": false, "interactive": false}, {"id": "e", "name": "戊 · 跨页", "concept": "整页对折成书：左页深绿品牌面（期题/陈述/签单），右页纸面工作面，中间一条金色细缝。", "typography": "衬线大期题（左页纵向居中）＋无衬线工作面。", "palette": ["#143729", "#F5F3EC", "#C8B584"], "traits": ["44/56 双色对页", "左页 sticky 通高", "金色接缝一枚"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>出报告 · 方向戊「跨页」— 静态稿\u003c/title>\n\u003cstyle>\n  /* ============================================================\n     方向戊 · 跨页（Spread / Duotone）\n     一句话：整页对折成一本书的跨页——左页整幅深绿（品牌面：期题、\n     陈述、签单），右页纸面（工作面：工序、回执、数据、选模）。\n     两页之间一条金色细缝。零圆角、零投影。\n     ============================================================ */\n  :root{\n    --deep:#143729; --deep-2:#0F2C21;\n    --paper:#F5F3EC; --ink:#1E2A23; --ink-2:#4A564D; --ink-3:#7C857B;\n    --line:#DFDBCB; --line-2:#EAE7DB;\n    --ivory:#F6F1DE; --ivory-2:rgba(246,241,222,.78); --ivory-3:rgba(246,241,222,.55);\n    --green:#1A4B27; --gold:#C8B584; --red:#9C4A3C;\n    --serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",SimSun,serif;\n    --sans:system-ui,-apple-system,\"Microsoft YaHei\",\"PingFang SC\",sans-serif;\n  }\n  *,::after,::before{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}\n  h1,h2,h3{font-family:var(--serif);font-weight:600}\n  a{color:inherit;text-decoration:none}\n  button{font:inherit;cursor:pointer}\n  .spread{display:grid;grid-template-columns:44% 56%;min-height:100vh}\n\n  /* ---- 左页：深绿（品牌面）——通高静态，随页自然延展 ---- */\n  .page-l{background:var(--deep);color:var(--ivory);padding:40px 52px 44px;display:flex;flex-direction:column;min-height:100vh}\n  .bm{display:flex;align-items:baseline;gap:10px}\n  .bm b{font-family:var(--serif);font-size:24px;letter-spacing:.14em}\n  .bm span{font-size:10.5px;letter-spacing:.16em;color:var(--ivory-3);line-height:1.6}\n  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ivory-2)}\n  .nav a{padding:7px 0;display:flex;align-items:center;gap:10px}\n  .nav a::before{content:\"\";width:5px;height:5px;background:transparent}\n  .nav a[aria-current]{color:var(--ivory)}\n  .nav a[aria-current]::before{background:var(--gold)}\n  .nav .m{margin-top:14px;font-size:11px;letter-spacing:.24em;color:var(--ivory-3)}\n\n  .center{margin:auto 0;padding:26px 0}\n  .ov{font-size:11.5px;letter-spacing:.32em;color:var(--ivory-3)}\n  .center h1{font-size:clamp(52px,4.6vw,74px);line-height:1.16;letter-spacing:.04em;margin:16px 0 6px}\n  .center .yr{font-size:clamp(20px,1.8vw,26px);color:var(--ivory-2);letter-spacing:.24em;margin-bottom:30px}\n  .center .rule{width:72px;height:1px;background:var(--gold);margin-bottom:30px}\n  .center .stm{font-family:var(--serif);font-size:30px;letter-spacing:.06em}\n  .center .sub{color:var(--ivory-2);font-size:14px;margin-top:10px;max-width:30ch}\n  .center .acts{margin-top:34px;display:flex;align-items:center;gap:20px}\n  .btn-ivory{background:var(--ivory);color:#15271E;border:0;padding:13px 28px;font-size:15px;letter-spacing:.08em;font-weight:600}\n  .btn-ivory:hover{background:#FFF9E6}\n  .center .ghost{color:var(--ivory-2);font-size:13.5px;border-bottom:1px solid rgba(246,241,222,.32);padding-bottom:3px}\n  .footline{font-size:12px;color:var(--ivory-3);display:flex;justify-content:space-between;gap:16px;border-top:1px solid rgba(246,241,222,.14);padding-top:16px}\n\n  /* ---- 右页：纸面（工作面） ---- */\n  .page-r{padding:44px 56px 80px;border-left:1px solid var(--gold);background:var(--paper)}\n  .rtop{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink-3);margin-bottom:34px}\n  .rtop .t{font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600}\n  .rtop .r{margin-left:auto;display:flex;gap:16px;align-items:center}\n  .pal{display:inline-flex;gap:7px}\n  .pal i{width:24px;height:13px;border:1px solid var(--line);display:inline-block}\n  .pal i.g{background:#1A4B27}.pal i.z{background:#B43B31}\n  .pal i.on{outline:2px solid var(--ink);outline-offset:2px}\n\n  .steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}\n  .steps .pt{position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-2)}\n  .steps .pr{position:absolute;top:0;left:0;height:2px;width:75%;background:var(--green)}\n  .st{padding:16px 14px 14px 0;border-right:1px solid var(--line-2)}\n  .st:last-child{border-right:0}\n  .st .lb{font-size:13.5px;color:var(--ink-3)}\n  .st .ms{font-size:12px;margin-top:3px;color:var(--ink-3)}\n  .st.done .lb{color:var(--ink-2)}\n  .st.done .ms::before{content:\"✓ \";color:var(--green)}\n  .st.now .lb{color:var(--ink);font-weight:650}\n  .st.now .lb::before{content:\"■ \";font-size:9px;color:var(--green);vertical-align:middle}\n\n  .receipt{margin-top:38px;padding-bottom:34px;border-bottom:1px solid var(--line)}\n  .receipt h3{font-size:20px;display:flex;align-items:center;gap:9px}\n  .receipt h3::before{content:\"✓\";font-family:var(--sans);font-size:12px;color:var(--green);border:1px solid var(--green);width:20px;height:20px;display:grid;place-items:center}\n  .receipt p{color:var(--ink-2);font-size:13.5px;max-width:56ch;margin-top:12px}\n  .receipt .lnx{display:flex;gap:22px;margin-top:16px;font-size:13.5px}\n  .receipt .lnx a{border-bottom:1px solid var(--line);padding-bottom:2px}\n  .receipt .lnx a:hover{border-color:var(--green);color:var(--green)}\n\n  .kv{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:34px;border-bottom:1px solid var(--line);padding-bottom:26px}\n  .kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}\n  .kv dt{color:var(--ink-3);flex-shrink:0}\n  .kv dd{color:var(--ink-2);text-align:right}\n\n  .pick{margin-top:40px}\n  .pick .hd{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}\n  .pick h2{font-size:21px}\n  .pick .lnk{margin-left:auto;font-size:13px;color:var(--green);border-bottom:1px solid var(--green);padding-bottom:2px}\n  .routes{display:flex;gap:24px;font-size:13px;color:var(--ink-3);margin-bottom:4px}\n  .routes .on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--green);padding-bottom:5px}\n  table{width:100%;border-collapse:collapse}\n  th{font-size:11.5px;letter-spacing:.18em;color:var(--ink-3);text-align:left;font-weight:400;padding:11px 0 8px;border-bottom:1px solid var(--line)}\n  td{padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}\n  td.mdl{color:var(--ink-2)}\n  td.pk b{font-family:var(--serif)}\n  .chg{color:var(--red);font-size:12px;margin-left:8px}\n  .dflt{color:var(--ink-3);font-size:12.5px}\n  .save{margin-top:13px;font-size:12.5px;color:var(--ink-3)}\n  .rel{margin-top:24px;padding-top:14px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3);max-width:92ch}\n  .rel b{color:var(--ink-2)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"spread\">\n  \u003c!-- 左页：品牌面 -->\n  \u003caside class=\"page-l\">\n    \u003cdiv class=\"bm\">\u003cb>文衡\u003c/b>\u003cspan>云南大学图书馆\u003cbr>学科信息参考\u003c/span>\u003c/div>\n    \u003cnav class=\"nav\" aria-label=\"工作区\">\n      \u003ca href=\"#\" aria-current=\"page\">出报告\u003c/a>\n      \u003ca href=\"#\">灵活报告\u003c/a>\n      \u003ca href=\"#\">报告\u003c/a>\n      \u003ca href=\"#\">问文衡\u003c/a>\n      \u003ca class=\"m\" href=\"#\">主 台 账\u003c/a>\n      \u003ca href=\"#\">运行档案\u003c/a>\n      \u003ca href=\"#\" style=\"color:var(--ivory-3)\">陈列馆 ↗\u003c/a>\n    \u003c/nav>\n\n    \u003cdiv class=\"center\">\n      \u003cdiv class=\"ov\">学 科 信 息 参 考 · 出 报 告\u003c/div>\n      \u003ch1>第 39 期\u003c/h1>\n      \u003cdiv class=\"yr\">二 零 二 六 年 九 月\u003c/div>\n      \u003cdiv class=\"rule\">\u003c/div>\n      \u003cdiv class=\"stm\">本期报告已就绪\u003c/div>\n      \u003cp class=\"sub\">复核后签单，这一版才会被标记为「可交付」。\u003c/p>\n      \u003cdiv class=\"acts\">\n        \u003cbutton class=\"btn-ivory\">复核并签单 →\u003c/button>\n        \u003ca class=\"ghost\" href=\"#\">看详细过程\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"footline\">\u003cspan>目录 202609 · 任务已完成\u003c/span>\u003cspan>admin · 管理员\u003c/span>\u003c/div>\n  \u003c/aside>\n\n  \u003c!-- 右页：工作面 -->\n  \u003cmain class=\"page-r\">\n    \u003cdiv class=\"rtop\">\n      \u003cspan class=\"t\">出报告\u003c/span>\n      \u003cspan>期次 202609\u003c/span>\n      \u003cspan class=\"r\">\n        \u003cspan>陈列馆 ↗\u003c/span>\n        \u003cspan class=\"pal\">\u003ci class=\"g on\" title=\"云大绿\">\u003c/i>\u003ci class=\"z\" title=\"朱砂\">\u003c/i>\u003c/span>\n      \u003c/span>\n    \u003c/div>\n\n    \u003csection class=\"steps\" aria-label=\"出报告步骤\">\n      \u003cspan class=\"pt\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"pr\" aria-hidden=\"true\">\u003c/span>\n      \u003cdiv class=\"st done\">\u003cdiv class=\"lb\">下载数据核验\u003c/div>\u003cdiv class=\"ms\">完成 · 64 / 64\u003c/div>\u003c/div>\n      \u003cdiv class=\"st done\">\u003cdiv class=\"lb\">选择章节\u003c/div>\u003cdiv class=\"ms\">完成 · 按大纲全选\u003c/div>\u003c/div>\n      \u003cdiv class=\"st now\">\u003cdiv class=\"lb\">生成初稿\u003c/div>\u003cdiv class=\"ms\">已出稿 · 10-13 15:03\u003c/div>\u003c/div>\n      \u003cdiv class=\"st\">\u003cdiv class=\"lb\">核验与定稿\u003c/div>\u003cdiv class=\"ms\">待办 · 复核后签单\u003c/div>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"receipt\">\n      \u003ch3>本期报告已生成\u003c/h3>\n      \u003cp>任务结束不代表报告合格或已签发——管理员当前不能下载未签发的初稿。复核无异议后签单，这一版即可交付。\u003c/p>\n      \u003cdiv class=\"lnx\">\u003ca href=\"#\">打开报告 →\u003c/a>\u003ca href=\"#\">去审核台 →\u003c/a>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"kv\">\n      \u003cdiv>\u003cdt>预测数据\u003c/dt>\u003cdd>202609\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>实际输出\u003c/dt>\u003cdd>202609\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>台账文件\u003c/dt>\u003cdd>云大全学科排名、阈值动态检测表.xlsx\u003c/dd>\u003c/div>\n      \u003cdiv>\u003cdt>最后修改\u003c/dt>\u003cdd>2026 年 9 月 28 日 07:55\u003c/dd>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"pick\">\n      \u003cdiv class=\"hd\">\u003ch2>本期选模\u003c/h2>\u003ca class=\"lnk\" href=\"#\">去预测台看图改选 →\u003c/a>\u003c/div>\n      \u003cdiv class=\"routes\">\u003cspan class=\"on\">路线1 · 总被引 / ESI 前 1% 被引阈值\u003c/span>\u003cspan>路线2 · 国内排名 / 国内前 1% 机构数\u003c/span>\u003c/div>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth style=\"width:30%\">潜力学科\u003c/th>\u003cth style=\"width:34%\">V1 推荐\u003c/th>\u003cth>本期已选\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>免疫学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"pk\">\u003cb>SARIMA 模型\u003c/b>\u003cspan class=\"chg\">◆ 已改选\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分子生物学与遗传学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>多学科\u003c/td>\u003ctd class=\"mdl\">Holt 趋势模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>物理学\u003c/td>\u003ctd class=\"mdl\">经验贝叶斯状态空间模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>神经科学与行为科学\u003c/td>\u003ctd class=\"mdl\">季节性 ETS 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>空间科学\u003c/td>\u003ctd class=\"mdl\">SARIMA 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>精神病学与心理学\u003c/td>\u003ctd class=\"mdl\">经验贝叶斯状态空间模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经济与商业\u003c/td>\u003ctd class=\"mdl\">SARIMA 模型\u003c/td>\u003ctd class=\"dflt\">默认\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cdiv class=\"save\">已保存 · admin · 2026-10-16 12:12\u003c/div>\n      \u003cp class=\"rel\">\u003cb>与报告的关系\u003c/b>　任务启动时固定读取本期已保存选择。重出后，未进 1% 的学科都会按你的选择出图（进本期图册），报告正文用接近度前二；所选模型若无法运行，仍按现有规则回退 V1 推荐并留下提醒。\u003c/p>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "戊-跨页.html", "baseline": false, "interactive": false}, {"id": "f", "name": "己 · 大字报", "concept": "海报级字号对比：巨幅「39」做底纹、朱砂方块做句点；内容全走可见竖线网格。", "typography": "衬线巨字 + 网格化小字；数字等宽。", "palette": ["#20211C", "#F4F2EA", "#B4392E"], "traits": ["276px 数字底纹", "四根竖细线贯穿", "读数带＝四格对齐线"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>出报告 · 方向己「大字报」— 静态稿\u003c/title>\n\u003cstyle>\n  /* ============================================================\n     方向己 · 大字报（Swiss Poster）\n     一句话：海报级的字号对比——巨幅「39」做底纹，题字与陈述压其上；\n     内容走在严格的分栏网格上（竖细线可见），数据全部对齐线。\n     唯一彩色是一枚朱砂方块。零圆角、零阴影、零渐变。\n     ============================================================ */\n  :root{\n    --paper:#F4F2EA; --ink:#20211C; --ink-2:#4C4E45; --ink-3:#82847A;\n    --line:#DCD9CC; --line-2:#E8E6DB;\n    --green:#1A4B27; --red:#B4392E;\n    --serif:\"Noto Serif SC\",\"Source Han Serif SC\",\"Songti SC\",SimSun,serif;\n    --sans:system-ui,-apple-system,\"Microsoft YaHei\",\"PingFang SC\",sans-serif;\n    --mono:\"Cascadia Mono\",Consolas,monospace;\n  }\n  *,::after,::before{box-sizing:border-box;margin:0;padding:0}\n  body{background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}\n  h1,h2,h3{font-family:var(--serif);font-weight:600}\n  a{color:inherit;text-decoration:none}\n  button{font:inherit;cursor:pointer}\n\n  /* ---- 顶栏 ---- */\n  .top{height:56px;display:flex;align-items:center;gap:28px;padding:0 40px;border-bottom:1px solid var(--ink)}\n  .top .bm{display:flex;align-items:baseline;gap:9px}\n  .top .bm b{font-family:var(--serif);font-size:21px;letter-spacing:.12em}\n  .top .bm span{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3)}\n  .top nav{display:flex;gap:24px;font-size:13px;color:var(--ink-2);margin-left:auto}\n  .top nav a.on{border-bottom:2px solid var(--ink);padding-bottom:2px;font-weight:600}\n  .top .pal{display:inline-flex;gap:7px;margin-left:26px}\n  .top .pal i{width:24px;height:13px;border:1px solid var(--line);display:inline-block}\n  .top .pal i.g{background:#1A4B27}.top .pal i.z{background:#B43B31}\n  .top .pal i.on{outline:2px solid var(--ink);outline-offset:2px}\n\n  /* ---- 网格骨架：所有内容对齐四根竖线 ---- */\n  .grid{max-width:1240px;margin:0 auto;padding:0 40px;position:relative}\n  .grid::before,.grid::after{content:\"\";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}\n  .grid::before{left:25.5%}.grid::after{left:50.5%}\n  .grid .col3{position:absolute;top:0;bottom:0;left:75.5%;width:1px;background:var(--line)}\n\n  /* ---- 海报区 ---- */\n  .poster{padding:56px 0 40px;position:relative}\n  .poster .bg39{position:absolute;right:40px;top:6px;font-family:var(--serif);font-weight:700;\n    font-size:276px;line-height:1;letter-spacing:-.04em;color:#E7E4D4;user-select:none}\n  .poster .ov{font-size:11.5px;letter-spacing:.34em;color:var(--ink-3)}\n  .poster h1{font-size:clamp(46px,5vw,68px);line-height:1.16;letter-spacing:.01em;margin:20px 0 0;max-width:14em;position:relative}\n  .poster .sub{color:var(--ink-2);margin-top:16px;font-size:14.5px}\n  .poster .acts{margin-top:30px;display:flex;align-items:center;gap:22px}\n  .btn-ink{background:var(--ink);color:var(--paper);border:0;padding:13px 26px;font-size:15px;letter-spacing:.06em}\n  .btn-ink:hover{background:#3A3B33}\n  .poster .ghost{font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:3px}\n  .reddot{display:inline-block;width:9px;height:9px;background:var(--red);margin-left:12px;vertical-align:middle}\n\n  /* ---- 读数带：四格对齐网格 ---- */\n  .reads{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:48px}\n  .reads div{padding:18px 20px 16px 0;border-right:1px solid var(--line);position:relative;padding-left:20px}\n  .reads div:first-child{padding-left:0}\n  .reads div:last-child{border-right:0}\n  .reads .k{font-size:10.5px;letter-spacing:.24em;color:var(--ink-3)}\n  .reads .v{margin-top:8px;display:flex;align-items:baseline;gap:  const root=document.documentElement,calm=matchMedia('(prefers-reduced-motion: reduce)'),narrow=()=>matchMedia('(max-width:760px)').matches;
 const ease=n=>getComputedStyle(root).getPropertyValue(`--${n}`).trim()||'ease-out';
 let st={layout:'compare',viewport:'desktop',current:C[0].id,chosen:null},stored=true,zoomActual=false,compareScroll=0,gridKey='',loupeKey='',toastTimer=0;
 try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){for(const key of Object.keys(st))if(key in saved)st[key]=saved[key];if(!byId[st.chosen])st.chosen=null;if(!byId[st.current])st.current=C[0].id;if(!['compare','loupe'].includes(st.layout))st.layout='compare';if(!SIZES[st.viewport])st.viewport='desktop';}}catch{stored=false;}
 function save(){if(!stored)return;try{localStorage.setItem(KEY,JSON.stringify(st));}catch{stored=false;}}
 const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
 const shown=()=>C;
 const services=new Map(C.filter(c=>c.kind==='url').map(c=>[c.content,{ready:null,pending:false}]));
 const startCommand=DATA.serve?(DATA.serve.cwd?`cd "${DATA.serve.cwd.replace(/[\\"$`]/g,'\\$&')}" && ${DATA.serve.command}`:DATA.serve.command):'';

 function serviceNotice(){
  const note=el('div','service-note'),message=el('div','service-message');note.hidden=true;note.setAttribute('role','status');
  message.append(el('h3',null,t('serviceUnavailable')),el('p',null,t('serviceHelp')));
  if(startCommand){const row=el('div','service-command'),button=el('button','tool',t('copyCommand'));button.type='button';button.dataset.copyServe='';button.setAttribute('aria-label',t('copyCommandLabel'));button.addEventListener('click',()=>copy(startCommand));row.append(el('code',null,startCommand),button);message.append(row);}
  note.append(message);return note;
 }
 function syncService(s,c){
  const ready=services.get(c.content).ready,m=s.querySelector('iframe');
  s.classList.toggle('offline',ready===false);s.querySelector('.service-note').hidden=ready!==false;m.hidden=ready!==true;
  if(ready===true){if(m.getAttribute('src')!==c.content){s.classList.remove('ready');m.src=c.content;}}
  else{s.classList.remove('ready');if(m.hasAttribute('src'))m.removeAttribute('src');}
 }
 async function checkService(url){
  const state=services.get(url);if(state.pending)return;state.pending=true;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);
  const target=new URL(url);if(target.hostname==='[::1]')target.hostname='localhost';
  try{await fetch(target.href,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});state.ready=true;}catch{state.ready=false;}
  finally{clearTimeout(timer);state.pending=false;}
  $$('.stage').forEach(s=>{const c=byId[s.dataset.id];if(c.kind==='url'&&c.content===url)syncService(s,c);});
 }
 const checkServices=()=>services.forEach((state,url)=>checkService(url));

 // 动效工具：尊重“减少动态效果”，浏览器不支持时直接落到最终状态
 function animate(node,frames,opts){if(calm.matches||!node?.animate)return;try{node.animate(frames,opts);}catch{node.animate(frames,{...opts,easing:'ease-out'});}}
 let vtSeq=0;
 function morph(update,kind){
  if(calm.matches||!document.startViewTransition||document.hidden){update();return;}
  const n=++vtSeq;root.dataset.vt=kind||'';
  try{document.startViewTransition(update).finished.finally(()=>{if(n===vtSeq)delete root.dataset.vt;});}catch{update();}
 }
 function slideTo(ind,target,instant){
  if(!ind||!target||!target.offsetWidth)return;
  if(instant)ind.style.transition='none';
  ind.style.width=`${target.offsetWidth}px`;ind.style.height=`${target.offsetHeight}px`;ind.style.transform=`translate(${target.offsetLeft}px,${target.offsetTop}px)`;
  if(instant){ind.offsetWidth;ind.style.transition='';}
 }
 const placeThumbs=instant=>$$('.seg').forEach(s=>slideTo(s.querySelector('.thumb'),s.querySelector('[aria-pressed=true]'),instant));
 const placeFilm=instant=>{const f=$('#film');slideTo(f.querySelector('.film-ind'),f.querySelector('[aria-current=true]'),instant);};

 $('#project').textContent=DATA.project;
 $('#brief').textContent=DATA.brief||'';

 function stripMini(c){const s=el('span','strip-mini');(c.palette||[]).forEach(h=>{const i=el('i');i.style.background=h;s.append(i);});return s;}
 function stage(c,interactive){
  const s=el('div','stage');s.dataset.id=c.id;
  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const native=byId[s.dataset.id].nativeViewport,size=native?{w:native.width,h:native.height}:SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?(native?innerHeight-$('#bar').offsetHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom):Infinity):box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=byId[f.parentElement.dataset.id].nativeViewport?'native':st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 // 每个候选都声明了固定画布时，桌面和手机的切换不起作用，收起来。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
