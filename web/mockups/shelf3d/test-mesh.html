<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>增量 ①② · Blender 链路自检（静态稿 · 待审核）</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#2b2622;overflow:hidden;
    font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#e8dfd2}
  #scene{display:block;width:100vw;height:100vh;cursor:pointer}
  .panel{position:fixed;left:22px;top:18px;background:rgba(43,38,34,.90);
    border:1px solid #6b5a45;border-radius:10px;padding:14px 18px;width:390px;
    max-height:calc(100vh - 120px);overflow:auto}
  .panel h1{margin:0 0 4px;font-size:16px;color:#c9a06a;letter-spacing:.02em}
  .panel h2{margin:14px 0 6px;font-size:13.5px;color:#e8dfd2;font-weight:600;
    border-top:1px solid #4a3f34;padding-top:10px}
  .panel table{border-collapse:collapse;font-size:13px;width:100%}
  .panel td{padding:3px 8px 3px 0;vertical-align:top}
  .panel td:first-child{color:#b8ab99;white-space:nowrap}
  .panel .num{font-family:Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}
  .ok{color:#8fce7b}
  .bad{color:#e8836f}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;
    vertical-align:-1px;margin-right:5px;border:1px solid rgba(0,0,0,.35)}
  .cap{position:fixed;left:22px;bottom:20px;font-size:13px;color:#b8ab99;line-height:1.9}
  .cap b{color:#e8dfd2}
  .tip{position:fixed;right:22px;bottom:20px;font-size:13px;color:#9d9080;text-align:right;line-height:1.9}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="panel" id="panel">
  <h1>增量 ①② · 从 Blender 到屏幕</h1>
  <table><tbody>
    <tr><td>方块（链路）</td><td id="cube-line" class="num">…</td></tr>
    <tr><td>桌子（多部件）</td><td id="desk-line" class="num">…</td></tr>
  </tbody></table>
  <h2>桌子逐件核对</h2>
  <table id="desk-rows"><tbody><tr><td>…</td><td></td></tr></tbody></table>
  <h2>判据</h2>
  <table id="verdict"><tbody><tr><td>…</td><td></td></tr></tbody></table>
</div>

<div class="cap">
  <b>链路自检</b>　Blender 里建的几何 → 导出 → 这里出现<br>
  增量① 方块通了；增量② 换成「桌面 + 4 腿」，看多部件与材质槽丢不丢
</div>
<div class="tip">拖动可转视角 · 滚轮缩放<br>棕＝木头（桌面）　银＝金属（腿）</div>

<script src="three-bundle.js"></script>
<script src="meshes.js"></script>
<script>
(function () {
'use strict';

var W = window.WH3D, THREE = W.THREE, OrbitControls = W.OrbitControls;

/* 把 base64 还原成数字数组。导出时按「小端」排的，现在的电脑都是小端。 */
function decodeF32(s) {
  var bin = atob(s), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}
function decodeU16(s) {
  var bin = atob(s), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Uint16Array(u8.buffer);
}

function buildGeometry(part) {
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(decodeF32(part.pos), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(decodeF32(part.nrm), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(decodeF32(part.uv), 2));
  g.setIndex(new THREE.BufferAttribute(decodeU16(part.idx), 1));
  g.computeBoundingBox();
  return g;
}

/* 材质槽 → 桌面上的两套质感。名字对不上就退回一个亮粉色，一眼看出槽丢了。 */
var MAT_FACTORY = {
  wood: function () { return new THREE.MeshPhysicalMaterial({
    color: 0x8a6a4a, roughness: 0.62, metalness: 0.04 }); },
  metal: function () { return new THREE.MeshPhysicalMaterial({
    color: 0x9a9b9e, roughness: 0.19, metalness: 0.90 }); },
  fabric: function () { return new THREE.MeshPhysicalMaterial({
    color: 0x6b5a45, roughness: 0.85, metalness: 0.0, sheen: 0.30 }); },
  _missing: function () { return new THREE.MeshBasicMaterial({ color: 0xff00aa }); }
};
function makeMat(name) {
  var f = MAT_FACTORY[name] || MAT_FACTORY._missing;
  return f();
}

/* ---------- 场景 ---------- */
var canvas = document.getElementById('scene');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2622);

var camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.05, 60);
camera.position.set(1.7, 1.15, 1.85);

var controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.36, 0);
controls.update();

var key = new THREE.DirectionalLight(0xfff2dd, 2.2);
key.position.set(-1.6, 2.4, 1.7);
scene.add(key);
scene.add(new THREE.AmbientLight(0xb8ab99, 0.6));

/* 地面格子：每格 0.5 米，一眼看出桌子是 1.2 × 0.7 */
var grid = new THREE.GridHelper(4, 8, 0x6b5a45, 0x4a3f34);
grid.position.y = 0.0005;
scene.add(grid);

/* ---------- 面板文字 ---------- */
function setRows(tbody, list) {
  tbody.innerHTML = list.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td class="' + (r[2] || '') + '">' + r[1] + '</td></tr>';
  }).join('');
}
function fmt(x) { return (x * 1000).toFixed(1) + ' mm'; }
function tick(ok) { return ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'; }
function sw(name) {
  var c = { wood: '#8a6a4a', metal: '#9a9b9e', fabric: '#6b5a45' }[name] || '#ff00aa';
  return '<span class="sw" style="background:' + c + '"></span>' + name;
}

var M = window.WH_MESHES || {};
var tolM = 0.001;
var verdicts = [];
var deskInfo = { parts: [], legs: 0, mats: {} };

/* ---------- 方块（增量①，回归） ---------- */
var cubeLine = '没读到';
(function () {
  var e = M['test-cube'];
  if (!e) { cubeLine = '没读到 test-cube'; return; }
  var geo = buildGeometry(e.parts[0]);
  var mesh = new THREE.Mesh(geo, makeMat(e.parts[0].mat));
  mesh.position.set(-1.35, 0, 0);
  scene.add(mesh);
  var bb = geo.boundingBox;
  var meas = [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z];
  var d = Math.max(Math.abs(meas[0] - e.bbox[0]), Math.abs(meas[1] - e.bbox[1]), Math.abs(meas[2] - e.bbox[2]));
  var ok = d <= tolM;
  verdicts.push(['方块尺寸没跑偏', tick(ok) + ' 最大差 ' + fmt(d), ok ? 'ok' : 'bad']);
  cubeLine = tick(ok) + ' 1 部件 · ' + decodeU16(e.parts[0].idx).length / 3 + ' 面 · 最大差 ' + fmt(d);
})();

/* ---------- 桌子（增量②） ---------- */
(function () {
  var e = M['test-desk'];
  if (!e) {
    setRows(document.querySelector('#desk-rows tbody'), [['读取 meshes.js', '没找到 test-desk，导出是不是没跑？', 'bad']]);
    return;
  }
  var group = new THREE.Group();
  scene.add(group);

  var rows = [];
  var seenName = {}, seenMat = {};
  var legCenters = [];

  e.parts.forEach(function (part) {
    var geo = buildGeometry(part);
    var mesh = new THREE.Mesh(geo, makeMat(part.mat));
    group.add(mesh);
    var bb = geo.boundingBox;
    var meas = [bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z];

    seenName[part.name] = true;
    seenMat[part.mat] = (seenMat[part.mat] || 0) + 1;
    if (part.name.indexOf('leg') === 0) {
      deskInfo.legs++;
      legCenters.push([
        Math.round((bb.min.x + bb.max.x) / 2 * 1000),
        Math.round((bb.min.z + bb.max.z) / 2 * 1000)
      ]);
    }
    deskInfo.parts.push(part.name + '/' + part.mat);

    rows.push([
      part.name + ' · ' + sw(part.mat),
      '尺寸 ' + fmt(meas[0]) + ' × ' + fmt(meas[1]) + ' × ' + fmt(meas[2])
      + '　底 ' + fmt(bb.min.y),
      'num'
    ]);
  });

  rows.push(['合计', e.parts.length + ' 个部件 · ' + e.bbox.map(fmt).join(' × '), 'num']);
  setRows(document.querySelector('#desk-rows tbody'), rows);

  /* 判据 */
  var hasTop = !!seenName['top'];
  var legsOk = deskInfo.legs === 4;
  var matSplit = Object.keys(seenMat).length >= 2 && (seenMat['wood'] || 0) >= 1 && (seenMat['metal'] || 0) >= 4;
  var uniq = {};
  legCenters.forEach(function (c) { uniq[c[0] + ',' + c[1]] = true; });
  var legsApart = Object.keys(uniq).length === 4;
  var topY = 0;
  e.parts.forEach(function (part) {
    if (part.name === 'top') {
      var geo = buildGeometry(part);
      topY = geo.boundingBox.max.y;
    }
  });
  var topH = Math.abs(topY - 0.75) <= tolM;

  var overAll = [0, 0, 0];
  e.parts.forEach(function (part) {
    var geo = buildGeometry(part);
    overAll[0] = Math.max(overAll[0], geo.boundingBox.max.x - geo.boundingBox.min.x);
  });

  verdicts.push(['桌面在（名叫 top）', tick(hasTop), hasTop ? 'ok' : 'bad']);
  verdicts.push(['4 条腿都在', tick(legsOk) + ' 实际 ' + deskInfo.legs + ' 条', legsOk ? 'ok' : 'bad']);
  verdicts.push(['4 条腿在四个角（不重叠）', tick(legsApart) + ' ' + Object.keys(uniq).length + ' 个位置', legsApart ? 'ok' : 'bad']);
  verdicts.push(['材质可分（木 + 金属）', tick(matSplit) + ' ' + Object.keys(seenMat).map(sw).join(' '), matSplit ? 'ok' : 'bad']);
  verdicts.push(['桌面上沿 = 0.75 m', tick(topH) + ' 实际 ' + fmt(topY), topH ? 'ok' : 'bad']);

  deskInfo.rows = rows;
})();

setRows(document.querySelector('#verdict tbody'), verdicts);

window.__MESH_CHECK = {
  desk_parts: deskInfo.parts,
  desk_legs: deskInfo.legs,
  verdicts: verdicts.map(function (v) { return [v[0], v[2]]; })
};

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

(function loop() {
  requestAnimationFrame(loop);
  renderer.render(scene, camera);
})();
})();
</script>
</body>
</html>
