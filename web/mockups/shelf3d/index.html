<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文衡 · 历期卷宗（书架陈列）</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#2b2622;overflow:hidden;
    font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#e8dfd2}
  #scene{display:block;width:100vw;height:100vh;cursor:pointer}
  .cap{position:fixed;left:22px;bottom:20px;font-size:13.5px;color:#b8ab99;letter-spacing:.02em;line-height:1.9}
  .cap b{color:#e8dfd2;font-weight:600}
  .cap kbd{border:1px solid #6b5a45;border-radius:4px;padding:0 5px;font-size:12px;color:#c9a06a}
  :root{
    /* 卷色：由 JS 按当前期次覆盖——每卷一套，像 G 那样「一卷一色」 */
    --vol:#B8422C; --vol-deep:#8A2A18; --vol-lift:#D65A38;
    --cream:#F7F0E2; --cream-2:rgba(247,240,226,.74); --cream-3:rgba(247,240,226,.46);
    --cream-4:rgba(247,240,226,.2);
    --bd:52px;                       /* 书厚 */
  }
  .warn{position:fixed;left:22px;top:18px;font-size:13px;color:#c9a06a;
    border:1px dashed #6b5a45;border-radius:8px;padding:8px 12px;background:rgba(43,38,34,.7)}
  .tiers{position:fixed;right:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .tiers button{
    font:inherit;font-size:13.5px;color:#b8ab99;background:rgba(43,38,34,.72);
    border:1px solid #4a3f34;border-radius:8px;padding:7px 12px;cursor:pointer;text-align:right}
  .tiers button[aria-current="true"]{color:#f0e6d4;border-color:#c9a06a;background:rgba(60,48,36,.9)}
  .tiers button:hover{border-color:#8a7458}

  /* ---------- 声音开关（默认关；演示现场多半静音） ---------- */
  .snd{position:fixed;right:22px;top:78px;font:inherit;font-size:13px;
    color:#b8ab99;background:rgba(43,38,34,.72);border:1px solid #4a3f34;
    border-radius:8px;padding:7px 12px;cursor:pointer;z-index:30}
  .snd[aria-pressed="true"]{color:#f0e6d4;border-color:#c9a06a;background:rgba(60,48,36,.9)}
  .snd:hover{border-color:#8a7458}

  /* ---------- 页脚：左提示 / 右命令（G 的做法：提示随状态变） ----------
     拿掉「关闭」按钮换成点背景退出时，必须把提示写出来——不写没人知道 */
  .vh-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 26px 18px;font-family:Consolas,"Courier New",monospace;
    font-size:11px;letter-spacing:.16em;color:#9d9080;pointer-events:none}
  .vh-foot .cmds{display:flex;gap:24px;pointer-events:auto}
  .vh-foot .cmds button{font:inherit;font-size:11px;letter-spacing:.16em;
    color:#b8ab99;background:none;border:none;border-bottom:1px solid transparent;
    padding:2px 0;cursor:pointer}
  .vh-foot .cmds button:hover{color:#e8dfd2;border-bottom-color:#c9a06a}
  .vh-foot .cmds button[hidden]{display:none}

  /* ==================================================================
     取书后的那一页（陈列态）——按 G-复刻WorkingVolumes 的实测数值做
     整屏铺满**该卷的卷色**（G2-已抽取 实测：卷色占 81.7%），中间一本大书 + 长投影。
     只做这一层；书架与封面不碰。
     ================================================================== */
  #display{position:fixed;inset:0;z-index:35;display:none;
    background:var(--vol);color:var(--cream);
    transition:background .5s ease}
  body[data-flow="featured"] #display{display:block}
  /* 三维画布在陈列/翻书时必须 visibility:hidden 才真正退出命中测试
     （只写 opacity+pointer-events 仍会拦住点击——技能坑） */
  body[data-flow="featured"] #scene,
  body[data-flow="reading"] #scene{opacity:0;pointer-events:none;visibility:hidden;
    transition:opacity 420ms linear, visibility 0s linear 420ms}
  #scene{transition:opacity 420ms linear, visibility 0s linear 0s}

  .dsp-main{height:100%;display:grid;grid-template-columns:1fr minmax(400px,520px);
    padding:0 40px;align-items:center;min-height:0}
  @media (max-width:1000px){.dsp-main{grid-template-columns:1fr;padding-bottom:96px}}

  /* 左舞台：大书 + 长投影。尺寸/角度取 G 的实测值 */
  .dsp-stage{position:relative;display:grid;place-items:center;min-height:0}
  .book3d{position:relative;height:clamp(380px,74vh,648px);aspect-ratio:.72;
    transform-style:preserve-3d;
    transform:rotateX(5deg) rotateY(-16deg);
    transition:transform 120ms linear;    /* 拖拽要跟手，故用线性短过渡 */
    cursor:grab}
  .book3d.grabbing{cursor:grabbing}
  /* 长投影：模糊椭圆压在书下（软件渲染下实时阴影不出影，见技能坑 4） */
  .dsp-ground{position:absolute;left:50%;bottom:12%;width:82%;height:9%;
    transform:translateX(-50%) scaleY(.42);
    background:rgba(0,0,0,.5);border-radius:50%;filter:blur(22px);z-index:-1}

  /* 露边层：精装书的封面比书芯小一圈，四边露书芯（左露书脊深色、右露奶白书口）。
     少了这层，封面就只是贴在背景上的一张图。 */
  .face{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden}
  .f-body{transform:translateZ(calc(var(--bd) / 2 - 1px));
    background:linear-gradient(90deg,var(--vol-deep) 0 13px,#F4EBD9 13px 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .f-cover{top:5px;left:14px;right:22px;bottom:6px;width:auto;height:auto;
    transform:translateZ(calc(var(--bd) / 2));
    border-radius:2px 3px 3px 2px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(247,240,226,.15), inset 0 0 40px rgba(0,0,0,.3)}
  .f-cover img{width:100%;height:100%;display:block;object-fit:cover}
  .f-back{transform:translateZ(calc(var(--bd) / -2)) rotateY(180deg);background:var(--vol-deep)}
  .f-right{left:calc(100% - var(--bd));width:var(--bd);height:100%;
    transform:translateZ(calc(var(--bd) / -2)) rotateY(90deg);transform-origin:right center;
    background:repeating-linear-gradient(180deg,#F4EBD9 0 2px,#E4D8BE 2px 3px)}
  .f-top{height:var(--bd);width:100%;
    transform:translateZ(calc(var(--bd) / -2)) rotateX(90deg);transform-origin:center top;
    background:var(--vol-deep)}
  .f-bottom{height:var(--bd);top:auto;bottom:0;width:100%;
    transform:translateZ(calc(var(--bd) / -2)) rotateX(-90deg);transform-origin:center bottom;
    background:var(--vol-deep)}
  /* 书签带：从封头垂下 */
  .ribbon{position:absolute;top:-8px;left:56%;width:6px;height:96px;
    background:var(--vol-deep);transform:translateZ(calc(var(--bd) / 2 + 3px));
    box-shadow:1px 2px 5px rgba(0,0,0,.3)}

  /* 右详情栏（G 的规格表是主信息，不是附注） */
  .dsp-detail{display:flex;flex-direction:column;justify-content:center;
    padding:0 0 0 20px;min-height:0}
  .dsp-detail .eyebrow{font-family:Consolas,monospace;font-size:10px;letter-spacing:.24em;
    color:var(--cream-3);margin-bottom:14px}
  .dsp-detail h1{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;font-weight:700;
    font-size:clamp(40px,5.4vw,70px);line-height:1.08;letter-spacing:.03em;
    color:var(--cream);margin:0 0 18px}
  .dsp-detail .lead{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;
    font-size:14.5px;line-height:1.9;color:var(--cream-2);margin:0}
  .dsp-detail .rule{height:1px;background:var(--cream-4);margin:24px 0}
  .dsp-detail .specs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .dsp-detail .spec .k{font-family:Consolas,monospace;font-size:9px;letter-spacing:.2em;
    color:var(--cream-3);margin-bottom:5px}
  .dsp-detail .spec .v{font-family:"Source Han Serif SC","Songti SC",SimSun,serif;
    font-size:14px;line-height:1.45;color:var(--cream);
    font-variant-numeric:tabular-nums}
  .dsp-detail .spec .v .u{color:var(--cream-2)}
  .dsp-detail .src{margin:24px 0 0;font-size:11px;line-height:1.7;color:var(--cream-3)}

  /* 命令与提示在卷色底上要换色（原来那套是暗底配的） */
  body[data-flow="featured"] .vh-foot{color:var(--cream-3)}
  body[data-flow="featured"] .vh-foot .cmds button{color:var(--cream-2)}
  body[data-flow="featured"] .vh-foot .cmds button:hover{color:var(--cream);border-bottom-color:var(--cream)}
  body[data-flow="featured"] .snd{color:var(--cream-2);border-color:var(--cream-4);background:rgba(0,0,0,.15)}
  body[data-flow="featured"] .snd[aria-pressed="true"]{color:var(--vol);background:var(--cream);border-color:var(--cream)}

  /* ---------- 翻书态（2D 覆盖层） ---------- */
  #reader{position:fixed;inset:0;z-index:40;background:#241f1b;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity 420ms linear, visibility 0s linear 0s}
  body[data-flow="reading"] #reader{opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity 420ms linear, visibility 0s linear 0s}
  /* 三维画布在翻书时不能拦点击（opacity/pointer-events 不够，visibility 要挂在延迟上） */
  body[data-flow="reading"] #scene{opacity:.22;pointer-events:none;visibility:hidden;
    transition:opacity 420ms linear, visibility 0s linear 420ms}
  #scene{transition:opacity 420ms linear, visibility 0s linear 0s}
  #reader-slot{width:min(96vw, calc((100vh - 132px) * 1.294));aspect-ratio:1.294;
    max-height:calc(100vh - 132px)}
  @media (max-width:900px),(max-height:560px){
    #reader-slot{width:min(94vw, calc((100vh - 120px) * .648));aspect-ratio:.648}
  }
  #reader-bar{display:flex;gap:14px;align-items:center;color:#b8ab99;font-size:13.5px}
  #reader-bar button{font:inherit;font-size:13.5px;color:#e8dfd2;background:rgba(43,38,34,.8);
    border:1px solid #6b5a45;border-radius:8px;padding:7px 14px;cursor:pointer}
  #reader-bar button:hover{border-color:#c9a06a}
  #reader-bar kbd{border:1px solid #6b5a45;border-radius:4px;padding:0 5px;font-size:12px;color:#c9a06a}

  /* ---------- 报告内页（纸面 + 朱批 + 钤印，跟 v2 陈列面同一个母题） ----------
     坑 4：页容器别用 flex 列——空间不够时会被压扁而不是溢出，检测抓不到 */
  .page{box-sizing:border-box;padding:34px 36px 30px;background:#f4ebd9;color:#2f2a24;
    font:16px/1.85 "Source Han Serif SC","Noto Serif SC",Songti SC,SimSun,serif;
    overflow:hidden;position:relative}
  .page > *{flex:0 0 auto}
  .page h2{margin:0 0 14px;font-size:21px;letter-spacing:.03em;color:#2f2a24}
  .page p{margin:0 0 10px;font-size:15.5px;line-height:1.9}
  .page .small{font-size:13.5px;color:#6f6558}
  .page .num{font-family:Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;
    color:#b23a2a;font-weight:700}
  .page .zhu{position:absolute;right:14px;top:46px;width:96px;
    font-size:12.5px;line-height:1.7;color:#b23a2a;opacity:.8;
    border-left:2px solid #b23a2a;padding-left:8px}
  .page .seal{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-3deg);
    width:64px;height:64px;border:3px solid #b23a2a;border-radius:8px;
    display:grid;place-items:center;color:#b23a2a;font-size:19px;font-weight:700;
    background:rgba(244,235,217,.55)}
  .page .seal.gold{border-color:#a9853f;color:#a9853f}
  .pg-cover{display:block;padding:24px}
  /* 封面七层构成：双线栏框 / 纸签条 / 竖排书名 / 钤印 / 出版项（见 cover-dna.json） */
  .cv-frame{position:relative;height:100%;border:1px solid #cbc6bd;
    box-shadow:inset 0 0 0 6px #f4ebd9, inset 0 0 0 7px #cbc6bd}
  .cv-slip{position:absolute;right:12%;top:8%;bottom:8%;width:34%;
    background:#f7f4ec;border:1px solid rgba(36,31,28,.55);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 0 18px}
  /* 坑：竖排必须 nowrap，否则会静默折列，把书名排成两个词 */
  .pg-cover .vtitle{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;
    font-size:30px;letter-spacing:.32em;color:#241f1c;font-weight:700}
  .cv-period{margin-top:14px;font-size:12px;color:#847f75;
    font-family:Consolas,monospace;letter-spacing:.08em}
  .cv-foot{position:absolute;left:8%;bottom:5%;font-size:13px;color:#a98a5c;letter-spacing:.14em}
  .cv-press{position:absolute;right:8%;top:4%;font-size:11px;color:rgba(36,31,28,.45);letter-spacing:.12em}
  .page .seal{position:absolute;left:11%;top:18%;width:62px;height:62px;
    background:#b13c2c;border-radius:3px;transform:rotate(-3deg);
    display:grid;place-items:center;color:#f7f4ec;font-size:22px;font-weight:700;
    box-shadow:inset 0 0 0 3px rgba(247,242,230,.22)}
  .page .seal.gold{background:transparent;color:#a98a5c;box-shadow:inset 0 0 0 3px #a98a5c}
  .toc{margin:0;padding-left:1.4em;font-size:16px;line-height:2.4}
  .big{width:100%;border-collapse:collapse;font-size:13px}
  .big th,.big td{border-bottom:1px solid #d9cfbc;padding:5px 6px;text-align:left}
  .big th{color:#6f6558;font-weight:600;font-size:12.5px}
  .big td.n{font-family:Consolas,monospace;text-align:right;font-variant-numeric:tabular-nums}
  .todo{margin:0;padding-left:1.3em;font-size:15.5px;line-height:2.2}
  /* 坑 2：库有 .stf__parent canvas{position:absolute;...} 宽泛选择器——
     页内要放 canvas 必须用更高特异性压回去 */
  .page .chart-box{position:relative;width:100%;height:180px;flex:0 0 auto}
  .stf__parent .page .chart-box canvas{position:static;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="tiers" id="tiers" role="group" aria-label="按系列切换"></div>

<button type="button" id="snd" class="snd" aria-pressed="false"
        title="声音默认关着；要听得到得先点一下（浏览器规定）">♪ 声音 关</button>

<p id="live" role="status" aria-live="polite" style="position:absolute;left:-9999px"></p>

<div id="reader" class="content" aria-label="翻书">
  <div id="reader-bar">
    <button type="button" id="btn-prev">← 上一页</button>
    <span id="reader-page">1 / 8</span>
    <button type="button" id="btn-next">下一页 →</button>
    <span class="hint">点书页外的背景合上 · <kbd>←</kbd><kbd>→</kbd> 翻页</span>
  </div>
  <div id="reader-slot"></div>
</div>

<div class="cap">
  <b>文衡 · 历期卷宗</b>　顶＝<b>ESI 双月报告</b> / 中＝学科发展态势 / 底＝年报
</div>

<section id="display" class="content" aria-label="陈列这一册">
  <div class="dsp-main">
    <div class="dsp-stage">
      <div class="book3d" id="dspBook" title="拖拽可转动">
        <div class="face f-body"></div>
        <div class="face f-cover"><img id="dspArt" alt="书封"></div>
        <div class="ribbon"></div>
        <div class="face f-back"></div>
        <div class="face f-right"></div>
        <div class="face f-top"></div>
        <div class="face f-bottom"></div>
      </div>
      <div class="dsp-ground"></div>
    </div>
    <aside class="dsp-detail">
      <div class="eyebrow" id="dEyebrow">—</div>
      <h1 id="dTitle">学科信息参考</h1>
      <p class="lead" id="dLead">—</p>
      <div class="rule"></div>
      <div class="specs" id="dSpecs"></div>
      <p class="src" id="dSrc">数字全部来自《云大全学科排名、阈值动态检测表》，可在演示站逐格回溯。</p>
    </aside>
  </div>
</section>

<footer class="vh-foot">
  <span id="footHint"></span>
  <div class="cmds">
    <button type="button" id="cmdOpen">抽取</button>
    <button type="button" id="cmdShelf" hidden>归架</button>
    <button type="button" id="cmdReset">复位视角</button>
  </div>
</footer>

<script src="three-bundle.js"></script>
<script src="data.js"></script>
<script>
/* ⚠ data.js 是 `window.WH_DATA = {books:…}` **整体覆盖**——摆位数据必须在它之后补，
   否则 tiers 被抹掉，WH_DATA.tiers[i] 读成 undefined[2]，init 当场断掉、点击全绑不上。 */
window.WH_DATA = window.WH_DATA || {};
if (!window.WH_DATA.books) window.WH_DATA.books = [];
/* 三层摆放：底＝年报 / 中＝学科态势 / 顶＝ESI 双月（rick 定的信息架构）。
   期次的真实数字在上面 data.js 的 books 里（来自 out/<期>/，可回溯），
   这里只管「摆在哪一层、哪几个位子」。 */
window.WH_DATA.tiers = [
  { key: 'annual', label: '年报', short: '年报', sub: '每年一本 · 待出刊',
    items: [{ kind: 'empty' }, { kind: 'empty' },
            { kind: 'book', period: 'ANNUAL', no: 1, placeholder: true, caption: '示意 · 未出刊' },
            { kind: 'empty' }, { kind: 'empty' }] },
  { key: 'trend', label: '学科发展态势报告', short: '学科态势', sub: '每期一本 · 待出刊',
    items: [{ kind: 'empty' }, { kind: 'empty' },
            { kind: 'book', period: 'TREND', no: 1, placeholder: true, caption: '示意 · 未出刊' },
            { kind: 'empty' }, { kind: 'empty' }] },
  { key: 'esi', label: 'ESI 双月报告', short: 'ESI 双月', sub: '已出 38 期',
    items: [{ kind: 'dense', count: 5, label: '更早 34 期' },
            { kind: 'book', period: '202601', no: 35 },
            { kind: 'book', period: '202603', no: 36 },
            { kind: 'book', period: '202605', no: 37 },
            { kind: 'book', period: '202607', no: 38 },
            { kind: 'empty' }] }
];
</script>
<script src="meshes.js"></script>
<script src="shelf3d.js"></script>
<script src="vendor/page-flip.browser.js"></script>
<script src="audio/sfx-data.js"></script>
<script src="audio.js"></script>
<script src="flow.js"></script>
<script>
(function () {
  var S = window.WH_SHELF3D;
  var canvas = document.getElementById('scene');
  if (!S.init(canvas)) return;
  S.start();

  /* 右侧系列按钮（键盘也能用） */
  var box = document.getElementById('tiers');
  var tiers = S.tiers();
  tiers.slice().reverse().forEach(function (t) {          /* 顶在上、底在下，跟书架一致 */
    var cfg = window.WH_DATA.tiers[t.index];
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = cfg.label;
    b.setAttribute('aria-current', 'false');
    b.addEventListener('click', function () { S.focus(t.index); sync(); });
    box.appendChild(b);
  });
  function sync() {
    var cur = S.focusIndex();
    Array.prototype.forEach.call(box.children, function (el, i) {
      el.setAttribute('aria-current', String((tiers.length - 1 - i) === cur));
    });
  }
  sync();

  /* 点：书 → 陈列态；陈列态里点同一本 → 翻书；点别的书 → 换一本端详；空白 → 退回 */
  var F = window.WH_FLOW;
  canvas.addEventListener('click', function (e) {
    var st = F.state();
    if (st === 'reading') return;
    var hit = S.hitTest(e.clientX, e.clientY);
    if (hit && hit.period != null) {
      var picked = window.__DEBUG_API.pick();
      if (st === 'featured' && picked && picked.period === hit.period) {
        F.openBook(); sync(); return;
      }
      F.pickBook(hit); sync(); return;
    }
    if (st === 'featured') { F.back(); sync(); return; }
    if (!hit) { S.overview(); sync(); return; }
    S.focus(hit.tierIndex); sync();
  });

  /* 点空白退出：由流程层统一判（要同时看状态与点中的目标，见坑 22） */
  document.addEventListener('click', function (e) {
    var before = F.state();
    F.onBlankClick(e);
    if (F.state() !== before) sync();
  });

  /* ↑↓ 换层（只在整柜态）；Esc / Enter 交给流程层 */
  window.addEventListener('keydown', function (e) {
    if (F.state() !== 'overview') return;
    var n = tiers.length, cur = S.focusIndex();
    if (e.key === 'ArrowUp') { S.focus(cur + 1); sync(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { S.focus(cur - 1); sync(); e.preventDefault(); }
  });

  /* 右侧系列按钮：在陈列/翻书态点它要先回整柜 */
  box.addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON') return;
    if (F.state() !== 'overview') { F.toOverview(); sync(); }
  }, true);

  document.getElementById('btn-next').addEventListener('click', function () {
    window.__DEBUG_API.flipNext(); sync();
  });
  document.getElementById('btn-prev').addEventListener('click', function () {
    window.__DEBUG_API.flipPrev(); sync();
  });

  /* 命令区：抽取 / 归架 / 复位视角（跟 G 一样，三个动作都是显式按钮，
     不指望用户猜手势） */
  document.getElementById('cmdOpen').addEventListener('click', function () {
    if (F.pullFocused()) sync();
  });
  document.getElementById('cmdShelf').addEventListener('click', function () {
    F.toOverview(); sync();
  });
  document.getElementById('cmdReset').addEventListener('click', function () {
    S.overview(); sync();
    var el = document.getElementById('live');
    if (el) el.textContent = '视角已复位';
  });

  /* 声音开关：默认关；点一下才开（浏览器要一次用户手势） */
  var A = window.WH_AUDIO, snd = document.getElementById('snd');
  function syncSnd() {
    var v = A && A.on();
    snd.setAttribute('aria-pressed', v ? 'true' : 'false');
    snd.textContent = v ? '♪ 声音 开' : '♪ 声音 关';
  }
  snd.addEventListener('click', function () { if (A) A.toggle(); syncSnd(); });
  syncSnd();

  /* 首屏也要同步一次（只靠「状态变化」监听会漏掉初始值） */
  F.on(function (st) {
    var lbl = document.getElementById('reader-page');
    if (lbl) lbl.textContent = st === 'reading'
      ? ((window.__DEBUG_API.pageIndex() + 1) + ' / ' + window.__DEBUG_API.pageCount())
      : '—';
    var live = document.getElementById('live');
    if (live && st) live.textContent =
      st === 'overview' ? '整柜' : st === 'featured' ? '陈列态' : '翻书';
  });
  sync();

  window.__SHELF_INFO = S.info();
  window.__AUDIO_INFO = A ? A.info() : null;
})();
</script>
</body>
</html>
