<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文衡 · 对话前门 — 阶段进度流（静态稿）</title>
<style>
  :root { --green:#0e5b43; --ink:#1d2a26; --muted:#7b8a84; --bg:#f4f7f5; --bub:#e8f1ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  header { padding:18px 22px; background:#fff; border-bottom:1px solid #e2e9e5;
           display:flex; align-items:baseline; gap:10px; }
  header b { color:var(--green); font-size:17px; }
  header span { color:var(--muted); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:26px 20px 60px; }
  .turn { display:flex; gap:12px; margin-bottom:22px; }
  .av { flex:0 0 34px; width:34px; height:34px; border-radius:50%; display:flex;
        align-items:center; justify-content:center; font-size:14px; color:#fff; }
  .av.me { background:#9fb3ab; }
  .av.wh { background:var(--green); font-weight:600; }
  .bub { background:#fff; border:1px solid #e2e9e5; border-radius:12px;
         padding:12px 16px; max-width:560px; }
  .me .bub { background:var(--bub); border-color:#d7e5dc; }
  .stage { color:var(--muted); display:flex; align-items:center; gap:9px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green);
         animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.25; transform:scale(.8);} 50%{opacity:1; transform:scale(1);} }
  .answer { display:none; }
  .answer .num { border-bottom:1px dashed #9fc0af; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:8px; }
  .badge { display:inline-block; border:1px solid #d7e5dc; border-radius:999px;
           padding:0 8px; margin-right:6px; color:#4a5f57; background:#f7faf8; }
  .note { margin-top:26px; padding:12px 16px; background:#fff; border:1px dashed #cfdcd5;
          border-radius:10px; color:#55665f; font-size:13px; }
  button { margin-top:14px; background:var(--green); color:#fff; border:0; border-radius:8px;
           padding:8px 16px; font-size:14px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--green); border:1px solid #cfdcd5; margin-left:8px; }
</style>
</head>
<body>
<header><b>文衡</b><span>云南大学图书馆 · 对话前门 —— 阶段进度流（静态稿，供审核）</span></header>
<main>
  <div class="turn me"><div class="av me">你</div><div class="bub">查一下化学的接近度</div></div>

  <div class="turn"><div class="av wh">文</div>
    <div class="bub">
      <div class="stage" id="stage"><span class="dot"></span><span id="stageText">正在理解这句话…</span></div>
      <div class="answer" id="answer">
        最新的化学接近度是 <span class="num">676.06</span> %（期次 <span class="num">202609</span>），
        也就是最近有效期次 <span class="num">202609</span>，数据截至 <span class="num">2026</span>-<span class="num">09</span>。
        <div class="meta"><span class="badge">大模型作答</span><span class="badge">盾 · 5 个数字已登记</span>点数字看来源</div>
      </div>
    </div>
  </div>

  <button onclick="play()">重播</button>
  <button class="ghost" onclick="fast()">快速重播</button>

  <div class="note">
    说明：阶段来自**真实节点**（进对话能力 → 进问答能力 → 模型规划 → 模型写答案），规则模式少事件、不演；
    **不播正文**——数字必须先过「数字盾」再整段展示（所以答案是整段出现，不是打字机）。
  </div>
</main>
<script>
  const steps = ["正在理解这句话…", "正在查台账…", "正在规划查哪些数…", "正在写答案…"];
  let timers = [];
  function play(stepMs = 900) {
    timers.forEach(clearTimeout); timers = [];
    const stage = document.getElementById("stage");
    const text = document.getElementById("stageText");
    const answer = document.getElementById("answer");
    stage.style.display = "flex"; answer.style.display = "none";
    steps.forEach((s, i) => timers.push(setTimeout(() => { text.textContent = s; }, i * stepMs)));
    timers.push(setTimeout(() => { stage.style.display = "none"; answer.style.display = "block"; },
                          steps.length * stepMs + 300));
  }
  function fast() { play(250); }
  play();
</script>
</body>
</html>
