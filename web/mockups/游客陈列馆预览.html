<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文衡 · 陈列馆访客预览</title>
<style>
:root{--ink:#33241b;--paper:#f4ead6;--paper2:#ead9ba;--seal:#a53a29;--wood:#3c261a;--wood2:#70452b;--gold:#c99c4f;--line:#b99568}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#5d3826,#21140f 68%);color:var(--paper);font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #ffe49b;outline-offset:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
header{max-width:1100px;margin:auto;padding:26px 30px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(244,234,214,.23)}.brand{font-family:SimSun,serif;letter-spacing:.2em;font-size:20px}.role{font-size:14px;border:1px solid rgba(244,234,214,.45);padding:7px 10px;border-radius:99px;color:#f9e6ba}.hint{max-width:1100px;margin:0 auto;padding:13px 30px;color:#ead9ba;font-size:14px}.hint kbd{font:inherit;border:1px solid #cda976;border-bottom-width:2px;padding:1px 5px;border-radius:4px;color:#fff5d5}
.stage{max-width:1100px;margin:auto;padding:10px 30px 52px}.shelf-wrap{position:relative;min-height:445px;padding:74px 46px 22px;background:linear-gradient(90deg,#2a190f,#4e301f 11%,#3b2418 88%,#24150e);box-shadow:inset 0 28px 42px rgba(0,0,0,.6),inset 24px 0 34px rgba(0,0,0,.45),inset -24px 0 34px rgba(0,0,0,.45),0 25px 45px rgba(0,0,0,.32)}.shelf-wrap:before{content:"";position:absolute;inset:22px 23px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px);pointer-events:none}.rail{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,24px);min-height:310px}.book{position:relative;width:112px;height:275px;border:0;border-radius:5px 7px 4px 4px;background:linear-gradient(90deg,var(--deep),var(--red) 15%,var(--red) 85%,var(--deep));box-shadow:8px 8px 10px rgba(0,0,0,.4),inset 2px 0 rgba(255,255,255,.18);color:#f8e9c9;cursor:pointer;transition:transform .25s,filter .25s}.book:hover,.book[aria-current="true"]{transform:translateY(-22px);filter:brightness(1.15)}.book[aria-current="true"]{outline:2px solid var(--gold)}.book:after{content:"";position:absolute;right:9px;top:0;height:100%;border-right:1px solid rgba(255,238,192,.45)}.spine{height:100%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:.14em;font-family:SimSun,serif;font-size:17px}.spine small{font:12px/1 sans-serif;margin-top:14px;letter-spacing:.03em}.board{position:absolute;left:20px;right:20px;bottom:19px;height:30px;background:linear-gradient(#9d7044,#5e371f 42%,#2d190f);box-shadow:inset 0 2px rgba(255,239,199,.38),0 10px 15px rgba(0,0,0,.48)}.selected{position:relative;z-index:2;text-align:center;margin-top:26px;color:#ead9ba}.selected strong{display:block;font:22px SimSun,serif;color:#ffe8b6;margin-bottom:6px}.selected span{font-size:14px}
.reader{display:none;max-width:920px;margin:26px auto 0}.reader.open{display:block}.shelf-view.hidden{display:none}.reader-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#ead9ba}.reader-tools button{border:1px solid rgba(244,234,214,.5);background:transparent;color:inherit;border-radius:5px;padding:9px 13px;cursor:pointer}.spread{display:grid;grid-template-columns:1fr 1fr;min-height:535px;background:var(--paper);color:var(--ink);box-shadow:0 24px 48px rgba(0,0,0,.45)}.page{position:relative;padding:54px clamp(24px,4vw,56px) 46px;background:linear-gradient(105deg,rgba(255,255,255,.35),transparent 45%),var(--paper);border-right:1px solid #cfb990;overflow:auto}.page:last-child{border-right:0;background:linear-gradient(255deg,rgba(255,255,255,.24),transparent 45%),var(--paper2)}.page-no{position:absolute;bottom:18px;right:30px;font:13px Georgia,serif;color:#826647}.page h1{font:42px SimSun,serif;font-weight:normal;letter-spacing:.18em;margin:36px 0 18px;color:#4b241d}.page h2{font:25px SimSun,serif;margin:0 0 22px;color:#4b241d}.cover-page{display:flex;flex-direction:column;justify-content:center;text-align:center}.cover-page:before{content:"文";position:absolute;right:26px;top:20px;color:rgba(165,58,41,.2);font:72px SimSun,serif}.cover-rule{width:62%;height:2px;background:var(--seal);margin:18px auto}.cover-meta{line-height:2;color:#5d4430}.toc{list-style:none;margin:0;padding:0}.toc li{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding:11px 0}.toc li span:last-child{margin-left:auto;font-family:Georgia,serif}.glossary dt{font-weight:700;font-size:17px;margin-top:17px;color:#612b22}.glossary dd{margin:7px 0 0;line-height:1.75}.end-page{display:flex;align-items:center;justify-content:center;text-align:center}.end-page div{border:1px solid var(--seal);padding:32px 25px;color:#682b22}.end-page b{display:block;font:28px SimSun,serif;margin-bottom:12px}.nav{display:flex;justify-content:center;gap:12px;margin-top:16px}.nav button{min-width:92px;border:0;border-radius:4px;padding:11px 16px;background:var(--seal);color:white;cursor:pointer}.nav button:disabled{opacity:.45;cursor:not-allowed}.counter{text-align:center;color:#ead9ba;margin-top:10px;font-size:14px}
@media(max-width:700px){header,.hint,.stage{padding-left:16px;padding-right:16px}.brand{font-size:16px}.shelf-wrap{padding:42px 20px 22px;min-height:390px}.rail{gap:7px}.book{width:54px;height:235px}.spine{font-size:13px}.spine small{font-size:10px}.spread{grid-template-columns:1fr;min-height:470px}.page{min-height:470px;border-right:0}.reader-tools{font-size:13px}.selected{margin-top:18px}}
</style>
</head>
<body>
<header><div class="brand">文衡 · 陈列馆</div><div class="role">访客预览</div></header>
<p class="hint">选择一本报告，打开后可浏览封面、目录与名词解释。键盘：<kbd>←</kbd><kbd>→</kbd> 选择，<kbd>Enter</kbd> 打开，<kbd>Esc</kbd> 返回书架。</p>
<main class="stage">
  <section class="shelf-view" id="shelfView" aria-label="历期报告书架">
    <div class="shelf-wrap"><div class="rail" id="rail"></div><div class="board"></div></div>
    <div class="selected"><strong id="selectedTitle"></strong><span>按 Enter 打开这本报告</span></div>
  </section>
  <section class="reader" id="reader" aria-label="报告预览">
    <div class="reader-tools"><button type="button" id="close">← 返回书架</button><span id="bookName"></span></div>
    <div class="spread" id="spread"></div>
    <div class="nav"><button type="button" id="prev">上一页</button><button type="button" id="next">下一页</button></div><div class="counter" id="counter"></div>
  </section>
</main>
<script>
const toc=[['名词解释',''],['一 概述','1'],['二 我校学科发展情况','2'],['三 我校潜力学科趋势预测','26'],['四 云南省主要高校学科发展基本情况','28'],['五 我校顶尖论文清单','30']];
const glossary=[['高被引论文（Highly Cited Paper）','指在同一学科、同一出版年，文章的被引频次进入全球前1%的论文，高被引论文可以展现某学科中最为被关注的论文。'],['热点论文（Hot Paper）','指最近两年发表，在最近两个月内被引次数进入本学科的全球前0.1%的论文。热点论文可以揭示学科发展前沿和热点。'],['顶尖论文（Top paper）','高被引论文与热点论文的合称。'],['阈值','学科进入ESI前1%、1‰的最低被引频次。'],['潜力学科','是指有可能进入ESI全球前1%的学科，潜力值=（学科总被引频次/阈值）×100%，潜力值越高，表示该学科进入全球前1%的可能性越大。'],['学科规范化引文影响力（CNCI）','一篇论文的CNCI值是通过其实际被引次数除以同文献类型、同出版年、同学科领域文献的期望被引次数计算得到。CNCI指标消除了出版年、学科领域与文献类型差异造成的影响，不仅可以用以实现跨学科论文学术影响力的比较，并且可以将论文与全球平均水平进行对比：如果CNCI>1，说明该论文的学术表现超过了全球平均水平，反之则说明该论文的学术表现低于全球平均水平。'],['排名百分位','学科排名与学科机构总数的比值，比值越小，排名越靠前。'],['引文影响力','论文篇均被引频次（均值）。']];
const books=[
 {period:'202601',label:'2026年1月',no:35,red:'#744c37',deep:'#482c20',cover:['','学科信息参考','2026年第1期（总第35期）','云南大学发展规划处  图书馆编      2026年1月']},
 {period:'202603',label:'2026年3月',no:36,red:'#8b5534',deep:'#58321d',cover:['','学科信息参考','2026年第2期（总第36期）','云南大学发展规划处  图书馆编      2026年3月']},
 {period:'202605',label:'2026年5月',no:37,red:'#6b5a3b',deep:'#3e351e',cover:['','学科信息参考','2026年第3期（总第37期）','云南大学发展规划处  图书馆编      2026年5月']},
 {period:'202607',label:'2026年7月',no:38,red:'#8b4333',deep:'#51261f',cover:['','学科信息参考','2026年第4期（总第38期）','云南大学发展规划处  图书馆编      2026年7月']},
 {period:'202609',label:'2026年9月',no:39,red:'#a53a29',deep:'#5c241d',cover:['','学科信息参考','2026年第5期（总第39期）','云南大学发展规划处  图书馆编      2026年9月']}
];
let selected=4,page=0;const rail=document.getElementById('rail'),spread=document.getElementById('spread');
function add(tag,txt,cls){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=txt;return node}
function renderShelf(){rail.replaceChildren();books.forEach((book,index)=>{const button=document.createElement('button');button.type='button';button.className='book';button.style.setProperty('--red',book.red);button.style.setProperty('--deep',book.deep);button.setAttribute('aria-current',String(index===selected));button.setAttribute('aria-label','选择 '+book.label+' 第'+book.no+'期');const spine=add('span','学科信息参考','spine');spine.append(add('small','第 '+book.no+' 期'));button.append(spine);button.addEventListener('click',()=>{selected=index;renderShelf()});button.addEventListener('dblclick',openReader);rail.append(button)});document.getElementById('selectedTitle').textContent=books[selected].label+' · 总第 '+books[selected].no+' 期'}
function pageShell(){const node=document.createElement('article');node.className='page';return node}
function cover(book){const p=pageShell();p.classList.add('cover-page');p.append(add('div',book.cover[1]),add('div','', 'cover-rule'),add('h1',book.cover[2]),add('p',book.cover[3],'cover-meta'));return p}
function contents(){const p=pageShell();p.append(add('h2','目录'));const list=document.createElement('ol');list.className='toc';toc.forEach(row=>{const li=document.createElement('li');li.append(add('span',row[0]),add('span',row[1]));list.append(li)});p.append(list);return p}
function glossaryPage(start){const p=pageShell();p.append(add('h2','名词解释'));const dl=document.createElement('dl');glossary.slice(start,start+4).forEach(item=>{dl.append(add('dt',item[0]),add('dd',item[1]))});p.append(dl);return p}
function end(){const p=pageShell();p.classList.add('end-page');const box=document.createElement('div');box.append(add('b','预览至此'),add('span','已展示本报告的封面、目录与名词解释。'));p.append(box);return p}
function readerPages(){const pages=[cover(books[selected]),contents(),glossaryPage(0),glossaryPage(4),end()];return matchMedia('(max-width:700px)').matches?pages.map(item=>[item]):[[pages[0],pages[1]],[pages[2],pages[3]],[pages[4]]]}
function renderReader(){const sheets=readerPages();if(page>=sheets.length)page=sheets.length-1;spread.replaceChildren(...sheets[page].map((node,i)=>{const copy=node.cloneNode(true);copy.append(add('span',String(page+1+i),'page-no'));return copy}));document.getElementById('bookName').textContent=books[selected].label+' · 第 '+books[selected].no+' 期';document.getElementById('counter').textContent='第 '+(page+1)+' / '+sheets.length+(matchMedia('(max-width:700px)').matches?' 页':' 组书页');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===sheets.length-1}
function openReader(){page=0;document.getElementById('shelfView').classList.add('hidden');document.getElementById('reader').classList.add('open');renderReader();document.getElementById('close').focus()}
function closeReader(){document.getElementById('reader').classList.remove('open');document.getElementById('shelfView').classList.remove('hidden');renderShelf();rail.querySelectorAll('button')[selected].focus()}
document.getElementById('close').onclick=closeReader;document.getElementById('prev').onclick=()=>{if(page){page--;renderReader()}};document.getElementById('next').onclick=()=>{if(page<readerPages().length-1){page++;renderReader()}};
addEventListener('resize',()=>{if(document.getElementById('reader').classList.contains('open')){page=0;renderReader()}});document.addEventListener('keydown',event=>{const reading=document.getElementById('reader').classList.contains('open');if(reading){if(event.key==='Escape')closeReader();if(event.key==='ArrowRight')document.getElementById('next').click();if(event.key==='ArrowLeft')document.getElementById('prev').click();return}if(event.key==='ArrowRight'){selected=(selected+1)%books.length;renderShelf()}if(event.key==='ArrowLeft'){selected=(selected+books.length-1)%books.length;renderShelf()}if(event.key==='Enter')openReader()});renderShelf();
</script>
</body>
</html>
