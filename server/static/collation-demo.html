  数据取自 out/202607/red_slots.json + meta.json，由 server/make_collation_snapshot.py 生成，

  正式入口：演示站 `/app/?view=reading&period=202607`（老 /p/<期次> 已 302）

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对勘本 · 202607 · 文衡（静态快照）</title>
<style id="whc-snapshot-style">
/* 文衡 · 全站样式（2026-09-15 定稿：B 骨架 + A 朱批资产）
   ------------------------------------------------------------------
   骨架取自 B「仪表·瑞士制」——直角、硬线、等宽微标签、面板头、读数格、
   套准十字。它不是装饰，是这套产品的语义：流水线是一台被校准过的仪器，
   所以用标尺语言而非 SaaS 卡片的圆角+投影语言。

   资产取自 A「朱批·学术志」——朱砂作为唯一的强调色（取代 B 的国际橙），
   金作待人工项，宋体用于标题与正文校勘，楷体用于校记与手工项，钤印用于
   品牌与签单。朱色在本产品里只承担一件事：标「本期改动 / 需要人拍板」。

   两条铁律（来自设计清单第三节「硬风险」）：
   1. 零 CDN。全部系统字体栈，断网/评审电脑拦 CDN 也不会崩版。
   2. 不用深色底做主背景。评审现场多为投影，打印稿也要能看。

   令牌在本文件 :root 单点声明；对勘本样式（原 collation.css，2026-09-24 已并入
   离线快照内联）不再自带一套色板；
   --paper/--zline/--song 等旧名保留为别名，两页同源。
*/
:root {
  /* --- B 骨架：暖灰 + 石墨 --- */
  --bg: #EFEDE7;
  --panel: #FBFAF7;
  --panel-2: #F4F2EC;
  --ink: #15171B;
  --ink-2: #4C5057;
  --ink-3: #8C9095;
  --line: #D8D5CC;
  --line-2: #C7C3B8;

  /* --- A 朱批：朱砂 / 金 --- */
  --zhu: #B23A2A;
  --zhu-deep: #8E2B1D;
  --zhu-wash: rgba(178, 58, 42, .07);
  --gold: #A98A5C;

  /* --- 语义灯 --- */
  --ok: #0E8F5A;
  --ok-wash: rgba(14, 143, 90, .08);
  --warn: #C77B00;
  --warn-wash: rgba(199, 123, 0, .08);

  /* --- 字体：全部系统栈，零 CDN --- */
  --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", SimSun, serif;
  --kai: KaiTi, "STKaiti", "Kaiti SC", serif;
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;

  /* --- 版心 --- */
  --wrapw: 1120px;
  --mono-label: 10px;        /* 等宽微标签字号，瑞士制的最小文字层 */

  /* --- 圆角与投影（2026-09-23 与新工作区系统对齐：同名同值，两套界面同源） --- */
  --r: 14px;
  --r-sm: 10px;
  --shadow: 0 1px 2px rgba(47, 42, 36, .06), 0 8px 24px rgba(47, 42, 36, .06);

  /* --- 对勘本（离线快照）的旧名别名（同源，色板只在上面的 :root 声明） --- */
  --paper: var(--bg);
  --paper-2: var(--panel);
  --paper-3: #E7E3D9;
  --zline: var(--line);
  --zline-2: var(--line-2);
  --zline-3: #E4E1D8;
  --zc-ok: var(--ok);
  --song: var(--serif);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--ink);
  font-size: 14px; line-height: 1.75; -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(178, 58, 42, .18); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: none; }
code, .mono, pre, kbd { font-family: var(--mono); }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.wrap { max-width: var(--wrapw); margin: 0 auto; padding-inline: 40px; }
.upper { text-transform: uppercase; letter-spacing: .18em; }

/* 朱批资产：朱色只作强调，不作装饰 */
.zhu { color: var(--zhu); }
.kai { font-family: var(--kai); }
.song { font-family: var(--serif); }

/* ---------- 套准十字（B 资产：印刷套准标记） ---------- */
.reg { position: fixed; width: 22px; height: 22px; z-index: 30; pointer-events: none; opacity: .38; }
.reg::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ink); }
.reg::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--ink); }
.reg.tl { left: 14px; top: 14px; }
.reg.tr { right: 14px; top: 14px; }
.reg.bl { left: 14px; bottom: 14px; }
.reg.br { right: 14px; bottom: 14px; }
@media (max-width: 1180px) { .reg { display: none; } }

/* ---------- 顶栏 ---------- */
.topbar { background: var(--panel); border-bottom: 2px solid var(--ink); position: sticky; top: 0; z-index: 20; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 62px; }
.brand { display: flex; align-items: center; gap: 13px; }
/* 钤印（A 资产）：朱底白字、微旋转、内描边模拟印泥 */
.seal {
  display: inline-grid; place-items: center; background: var(--zhu); color: #F7F2E6;
  font-family: var(--serif); font-weight: 700; border-radius: 7px;
  box-shadow: inset 0 0 0 2px rgba(247, 242, 230, .22);
  transform: rotate(-3deg); letter-spacing: 0; flex: none;
}
.seal-sm { width: 34px; height: 34px; font-size: 19px; }
.brand .logo { font-family: var(--serif); font-weight: 700; font-size: 21px; letter-spacing: .12em; color: var(--ink); }
.brand .sub {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; color: var(--ink-3);
  border-left: 1px solid var(--line-2); padding-left: 13px;
}
.topbar nav { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.who { color: var(--ink-2); }
.ghost { color: var(--ink-3); border-bottom: 1px solid transparent; transition: border-color .18s, color .18s; }
.ghost:hover { color: var(--zhu); border-bottom-color: var(--zhu); }

/* ---------- 版式 ---------- */
/* 用 padding-block 而不是 padding 简写：.wrap 的 padding-inline 若被
   `main{padding:30px 0 60px}` 覆盖（类选择器权重高于元素选择器，且会整条覆盖），
   竖向内边距会被抹成 0，首行内容就顶到粘性顶栏下面被压掉。 */
main { padding-block: 30px 60px; }

/* 报头：等宽眉批 + 宋体主标 + 说明。骨架是 B 的，主标字体是 A 的。 */
.masthead { padding-bottom: 26px; border-bottom: 2px solid var(--ink); margin-bottom: 26px; }
.masthead .kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: .3em; color: var(--zhu); margin-bottom: 14px; }
.masthead h1 { font-family: var(--serif); font-size: 27px; font-weight: 700; letter-spacing: .06em; line-height: 1.4; }
.masthead .lead { margin-top: 11px; color: var(--ink-2); font-size: 13.5px; max-width: 720px; }
.masthead .lead b { color: var(--ink); font-weight: 600; }
.masthead .lead .zhu { font-weight: 600; }

/* ---------- 面包屑 ---------- */
/* 注意：别在非对勘本页面借用 .whc-crumb——对勘本样式只在快照/对勘页
   body.whc-body 下生效，借来的类不会生效，面包屑会贴着顶栏被压掉。 */
.crumb {
  display: flex; align-items: center; flex-wrap: wrap; margin-bottom: 18px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3);
}
.crumb a { color: var(--ink-2); border-bottom: 1px solid var(--line-2); }
.crumb a:hover { color: var(--zhu); border-bottom-color: var(--zhu); }
.crumb .sep { padding: 0 9px; color: var(--line-2); }

/* ---------- 面板（取代圆角白卡） ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 22px; }
.panel-h {
  display: flex; align-items: center; gap: 12px; padding: 11px 18px;
  border-bottom: 1px solid var(--line); background: var(--panel-2);
  border-radius: var(--r) var(--r) 0 0;
}
.panel-h .no { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3); flex: none; }
.panel-h h1, .panel-h h2 { font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .08em; }
.panel-h .hint { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); }
.panel-h .led { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.panel-h .led.ok { background: var(--ok); }
.panel-h .led.warn { background: var(--warn); }
.panel-h .led.bad { background: var(--zhu); }
.panel-b { padding: 20px; }
.panel-b > p:last-child { margin-bottom: 0; }
.panel-foot {
  padding: 11px 18px; border-top: 1px solid var(--line); background: var(--panel-2);
  border-radius: 0 0 var(--r) var(--r);
  font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.grid2 .panel { margin-bottom: 22px; }
@media (max-width: 880px) { .grid2 { grid-template-columns: 1fr; } }

/* 兼容旧类名：仍按面板渲染，避免漏改处退化成裸块 */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 22px; padding: 20px; }

/* ---------- 读数格（B 资产：4+1 张大数字，42px 等宽） ---------- */
.readouts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border-top: 2px solid var(--ink); background: var(--panel);
  border-radius: var(--r); overflow: hidden;
}
.readout { padding: 20px 22px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.readout:last-child { border-right: none; }
.readout .v { font-family: var(--mono); font-weight: 600; font-size: 38px; line-height: 1.05; letter-spacing: -.02em; }
.readout .v.ok { color: var(--ok); }
.readout .v.zhu { color: var(--zhu); }
.readout .k {
  margin-top: 8px; font-family: var(--mono); font-size: var(--mono-label);
  letter-spacing: .22em; color: var(--ink-3); text-transform: uppercase;
}
/* 标尺纹：B 的“校准过”语汇，用在这里提示这不是增长数字而是仪表读数 */
.readout .gauge {
  height: 7px; margin-top: 12px; border: 1px solid var(--ink);
  background: repeating-linear-gradient(90deg, transparent 0 7px, rgba(21, 23, 27, .16) 7px 8px);
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-block; padding: 9px 18px; border: 1px solid var(--ink); border-radius: 9px;
  background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12px;
  letter-spacing: .16em; cursor: pointer; touch-action: manipulation;
  transition: background-color .18s, border-color .18s, color .18s;
}
.btn:hover { background: var(--zhu); border-color: var(--zhu); color: #fff; }
.btn.primary { background: var(--zhu); border-color: var(--zhu); }
.btn.primary:hover { background: var(--zhu-deep); border-color: var(--zhu-deep); }
.btn.primary:disabled { background: var(--ink-3); border-color: var(--ink-3); cursor: not-allowed; }
.btn.line, .btn.ghost { background: transparent; color: var(--ink); }
.btn.line:hover, .btn.ghost:hover { background: var(--ink); color: #fff; }
.btn.wide { width: 100%; padding: 12px 18px; font-size: 13px; }
.btn.ghost { border: none; padding: 4px 0; font-family: var(--mono); }
.btn.ghost:hover { background: transparent; color: var(--zhu); }

/* ---------- 表单 ---------- */
label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 18px; }
label.check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
input[type=text], input[type=password], input:not([type]), select, input[type=file] {
  width: 100%; margin-top: 6px; padding: 9px 10px; font-size: 13.5px;
  border: 1px solid var(--line-2);
  /* 显式给出底色与字色：Windows 暗色模式下原生 select 会变成黑底黑字（看不清） */
  background: #fff; color: var(--ink);
  font-family: var(--sans); border-radius: var(--r-sm); touch-action: manipulation;
  transition: border-color .18s;
}
/* 键盘聚焦保留系统 outline（可见焦点），鼠标点击只变边框。
   直接 `outline: none` 会让键盘用户彻底看不到焦点在哪。 */
input:focus, select:focus { border-color: var(--zhu); }
input:focus:not(:focus-visible), select:focus:not(:focus-visible) { outline: none; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--zhu); outline-offset: 1px; }
input[type=checkbox] { width: auto; accent-color: var(--zhu); }
.or {
  display: flex; align-items: center; gap: 12px; margin: 20px 0 16px;
  font-family: var(--mono); font-size: var(--mono-label); letter-spacing: .24em; color: var(--ink-3);
}
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.or span { padding: 0; background: transparent; position: static; }
.run-form { margin-top: 2px; }

/* ---------- 提示条 ---------- */
.alert { padding: 9px 13px; font-size: 12.5px; margin-bottom: 14px; border-left: 3px solid var(--ink-3); background: var(--panel-2); border-radius: var(--r-sm); }
.alert.err { border-left-color: var(--zhu); color: var(--zhu); background: var(--zhu-wash); }
.alert.warn { border-left-color: var(--warn); color: var(--warn); background: var(--warn-wash); }

/* ---------- 状态标签（药丸形；2026-09-23 起与新工作区系统一致） ---------- */
.badge, .chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px;
  font-family: var(--mono); font-size: var(--mono-label); letter-spacing: .14em;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2);
  border-radius: 999px; text-transform: uppercase; white-space: nowrap;
}
.badge::before, .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }

/* 10 态任务状态（唯一来源 src/agent/states.py，勿在别处另起名）。
   语义分三档：进行中=朱砂脉动 / 正常收尾=墨绿 / 需人工或异常=朱砂 / 待签单=茶褐 */
.badge.pending { border-color: var(--line-2); color: var(--ink-3); }
.badge.pending::before { background: var(--ink-3); }
.badge.running, .badge.retrying { border-color: var(--zhu); color: var(--zhu); }
.badge.running::before, .badge.retrying::before { background: var(--zhu); animation: pulseDot 1.1s infinite; }
.badge.stalled { border-color: var(--warn); color: var(--warn); }
.badge.stalled::before { background: var(--warn); animation: pulseDot 1.1s infinite; }
.badge.waiting_approval { border-color: var(--ink-2); color: var(--ink-2); }
.badge.waiting_approval::before { background: var(--ink-2); }
.badge.completed { border-color: var(--ok); color: var(--ok); }
.badge.completed::before { background: var(--ok); }
.badge.warned { border-color: var(--warn); color: var(--warn); }
.badge.warned::before { background: var(--warn); }
.badge.escalated, .badge.failed, .badge.cancelled { border-color: var(--zhu); color: var(--zhu); }
.badge.escalated::before, .badge.failed::before, .badge.cancelled::before { background: var(--zhu); }

/* 旧 4 态名：读盘已归一，这里只作历史缓存/书签页的兜底，新代码别再用 */
.badge.done { border-color: var(--ok); color: var(--ok); }
.badge.done::before { background: var(--ok); }
.badge.warn { border-color: var(--warn); color: var(--warn); }
.badge.warn::before { background: var(--warn); }
.badge.interrupted { border-color: var(--zhu); color: var(--zhu); }
.badge.interrupted::before { background: var(--zhu); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.ok::before { background: var(--ok); }
.chip.bad { border-color: var(--zhu); color: var(--zhu); }
.chip.bad::before { background: var(--zhu); }
@keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.engine { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- 工序表（B 的 .seq：编号 + 名称 + 状态，一行一道闸） ---------- */
.seq { list-style: none; }
.seq li {
  display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center;
  padding: 13px 2px; border-bottom: 1px solid var(--line);
}
.seq li:last-child { border-bottom: none; }
.seq .no { font-family: var(--mono); font-size: 15px; color: var(--ink-3); font-weight: 500; }
.seq li.done .no { color: var(--ok); }
.seq li.warn .no { color: var(--warn); }
.seq li.failed .no { color: var(--zhu); }
.seq b { display: block; font-weight: 600; font-size: 13.5px; }
.seq .desc { display: block; color: var(--ink-3); font-size: 12px; }
.seq .st { font-family: var(--mono); font-size: var(--mono-label); letter-spacing: .18em; color: var(--ink-3); text-align: right; }

/* 保留旧类名 .mini-steps（若还有引用，按 seq 的观感渲染） */
.mini-steps { list-style: none; counter-reset: m; }
.mini-steps li { position: relative; padding: 10px 0 10px 40px; border-bottom: 1px solid var(--line); }
.mini-steps li:last-child { border-bottom: none; }
.mini-steps li::before {
  counter-increment: m; content: counter(m, decimal-leading-zero);
  position: absolute; left: 0; top: 12px; font-family: var(--mono); font-size: 13px; color: var(--ink-3);
}
.mini-steps b { display: block; font-size: 13.5px; }
.mini-steps span { font-size: 12px; color: var(--ink-3); }

/* ---------- 任务页 ---------- */
.job-head .panel-b { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.job-status { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.job-status b { color: var(--ink); }
.steps { list-style: none; }
.step { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.step:last-child { border-bottom: none; }
.step .dot { width: 9px; height: 9px; margin-top: 6px; background: var(--line-2); flex: none; border-radius: 50%; }
.step b { display: block; font-size: 13.5px; }
.step span { font-size: 12px; color: var(--ink-3); display: block; }
.step em.detail { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--ink-2); display: block; margin-top: 3px; }
/* 状态用朱批语义：跑动=朱（正在被校），完成=绿（已核），被拦=朱 */
.step.start .dot { background: var(--zhu); animation: pulseDot 1s infinite; }
.step.start b { color: var(--zhu); }
.step.done .dot { background: var(--ok); }
.step.done em.detail { color: var(--ok); }
.step.warn .dot { background: var(--warn); }
.step.warn em.detail { color: var(--warn); }
.step.failed .dot { background: var(--zhu); }
.step.failed em.detail { color: var(--zhu); }

.kv { display: grid; gap: 0; }
.kv > div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 8px 0; }
.kv > div:last-child { border-bottom: none; }
.kv dt { color: var(--ink-3); font-family: var(--mono); font-size: var(--mono-label); letter-spacing: .16em; text-transform: uppercase; align-self: center; }
.kv dd { font-family: var(--mono); font-weight: 600; font-size: 13.5px; }

/* ---------- 瀑布 ---------- */
.waterfall { display: grid; gap: 8px; }
.wf-row { display: grid; grid-template-columns: 116px 1fr 56px; align-items: center; gap: 10px; }
.wf-label { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); text-align: right; white-space: nowrap; }
.wf-track { position: relative; height: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.wf-bar { position: absolute; top: 1px; bottom: 1px; background: var(--ink); }
.wf-bar.done { background: var(--ok); }
.wf-bar.warn { background: var(--warn); }
.wf-bar.running { background: var(--zhu); animation: pulseDot 1s infinite; }
.wf-time { font-family: var(--mono); font-size: 11px; color: var(--ink); text-align: right; }

/* ---------- 控制台（终端该是深的，但用墨色不用蓝） ---------- */
.console {
  background: #17150F; color: #D9D2C2; padding: 16px; font-size: 12px; line-height: 1.65;
  max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid var(--ink);
}

/* ---------- 产出 ---------- */
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.artifact {
  display: flex; flex-direction: column; gap: 4px; padding: 15px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.artifact:hover { border-color: var(--zhu); }
.artifact.primary { border-color: var(--zhu); background: var(--zhu-wash); }
.artifact b { font-family: var(--serif); color: var(--ink); font-size: 14.5px; letter-spacing: .04em; }

/* ---------- 表格（密集型：等宽大写表头 + 重底线） ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
th {
  font-family: var(--mono); font-weight: 500; font-size: var(--mono-label);
  letter-spacing: .2em; color: var(--ink-3); background: var(--panel-2);
  border-bottom: 1px solid var(--ink); text-transform: uppercase; white-space: nowrap;
}
tr:hover td { background: var(--zhu-wash); }
.table-scroll { overflow-x: auto; }
/* 红色件清单：改前用灰删除线，改后用朱色 —— 与对勘本同一套朱批语义 */
.slots .old { color: var(--ink-3); }
.slots .new { color: var(--zhu); font-weight: 600; }
.slots .src { color: var(--ink-2); font-family: var(--mono); font-size: 11px; }
.group-chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 4px 0 16px; }
.filters { display: flex; align-items: center; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
.filters input { max-width: 320px; margin-top: 0; }

/* ---------- 三条治理机制 ---------- */
.ticks { list-style: none; }
.ticks li { position: relative; padding-left: 20px; margin-bottom: 12px; font-size: 13px; }
.ticks li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; background: var(--zhu); }
.ticks b { color: var(--ink); }

/* ---------- 二维码 ---------- */
.qr-card { text-align: center; }
.qr-card img, .qr-card canvas { width: 140px; height: 140px; margin: 6px auto 10px; display: block; border: 1px solid var(--line); padding: 8px; background: #fff; }

/* ---------- 登录：牌匾（B 资产） ---------- */
.login-wrap { display: flex; justify-content: center; align-items: center; min-height: 78vh; padding: 40px 0; }
.plaque { width: min(430px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.plaque .strip {
  display: flex; justify-content: space-between; background: var(--ink); color: #EDEAE2;
  padding: 9px 18px; font-family: var(--mono); font-size: var(--mono-label); letter-spacing: .2em;
}
.plaque .body { padding: 30px 30px 26px; }
.plaque .mark { font-family: var(--serif); font-weight: 700; font-size: 34px; letter-spacing: .18em; line-height: 1; }
.plaque .mark i { font-style: normal; color: var(--zhu); }
.plaque .tagline { margin-top: 12px; color: var(--ink-3); font-size: 12.5px; letter-spacing: .06em; }
.plaque hr { border: none; border-top: 1px solid var(--line); margin: 22px 0; }
.login-card { width: 100%; }
.login-card h1 { font-family: var(--serif); font-size: 22px; }
.login-card h1 span { font-size: 13px; color: var(--ink-3); font-weight: 400; display: block; margin-top: 4px; }
.login-form { margin-top: 6px; }

/* ---------- 页脚 ---------- */
.foot {
  padding: 22px 40px; border-top: 1px solid var(--line); color: var(--ink-3);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-align: center; max-width: var(--wrapw); margin: 0 auto;
}

/* ---------- 红件清单：图表槽位预览 ---------- */
/* 图是白底 PNG（matplotlib 出的），在深色面板上必须给白底，否则边框糊掉 */
.chart { display: block; margin-bottom: 5px; }
.chart img {
  display: block; width: 148px; height: auto; background: #fff;
  border: 1px solid var(--line); transition: border-color .18s;
}
.chart:hover img { border-color: var(--zhu); }

/* ---------- 图册页：一屏看全期次图 ---------- */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.gcard { display: block; border: 1px solid var(--line); background: var(--panel); transition: border-color .18s; }
.gcard:hover { border-color: var(--zhu); }
.gcard img {
  display: block; width: 100%; height: auto; background: #fff;
  border-bottom: 1px solid var(--line);
}
.gcard .cap {
  padding: 8px 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.5;
  color: var(--ink-2); word-break: break-all;
}
.gcard:hover .cap { color: var(--zhu); }
.gsec { margin-bottom: 8px; }
.gsec-h {
  display: flex; align-items: baseline; gap: 10px;
  padding: 14px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
.gsec-h h3 { font-family: var(--serif); font-size: 14.5px; font-weight: 600; letter-spacing: .06em; }
.gsec-h .n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- 数字排版 / 长列表 / 键盘可达（2026-09-20 UX review 后加） ---------- */
/* 等宽数字：读数与表格里的数才能逐位对齐，「1」和「8」不等宽时列看着是歪的 */
.readout .v, .mono, .tabular, table.dense td, table.dense th {
  font-variant-numeric: tabular-nums;
}
/* 溯源页有 354+ 行：让浏览器跳过视口外的行（长列表不加这个会明显卡顿）。
   只加在表格行上，锚点跳转（#todo-panel 等 div）不受影响。 */
table.dense tbody tr { content-visibility: auto; contain-intrinsic-size: auto 30px; }
/* 键盘用户跳过顶栏直达主内容：平时藏起来，聚焦时落在左上角 */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 200;
  background: var(--zhu); color: #fff; padding: 8px 14px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ---------- 双模式产线：模式开关 + 灵活报告正文（2026-09-20 第二条产线） ---------- */
/* 一个开关两条产线：并排两张卡，当前产线压朱色上边线，另一张是链接。 */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .modes { grid-template-columns: 1fr; } }
.mode {
  display: block; padding: 14px 16px; border: 1px solid var(--line);
  border-top: 2px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--panel-2); color: inherit; text-decoration: none;
}
.mode.cur { border-top-color: var(--zhu); background: var(--panel); }
a.mode:hover { border-color: var(--zhu); }
.mode-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.mode-h b { font-family: var(--serif); font-size: 15px; letter-spacing: .04em; }
.mode p { margin: 6px 0 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.mode p.muted { color: var(--ink-3); }

/* 灵活报告正文：内联渲染的 md 片段。表格复用 .dense，这里只补标题/引用/图的间距，
   并把「非报送件」的性质在版心上做出来（左缘朱线 = 参考件，不是报送件）。 */
.flexdoc { border-left: 3px solid var(--zhu); padding: 2px 0 2px 16px; margin: 4px 0 0; }
.flexdoc h2 { font-family: var(--serif); font-size: 17px; font-weight: 600;
  margin: 22px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.flexdoc h3 { font-size: 15px; margin: 16px 0 6px; }
.flexdoc h4 { font-size: 14px; margin: 12px 0 5px; }
.flexdoc p { margin: 8px 0; line-height: 1.8; }
.flexdoc ul, .flexdoc ol { padding-left: 22px; margin: 8px 0; }
.flexdoc li { margin: 4px 0; line-height: 1.75; }
.flexdoc blockquote { margin: 10px 0; padding: 8px 12px; background: var(--panel-2);
  border-left: 2px solid var(--zhu); border-radius: 0 var(--r-sm) var(--r-sm) 0; color: var(--ink-2); }
.flexdoc blockquote p { margin: 3px 0; }
.flexdoc figure { margin: 14px 0; text-align: center; }
.flexdoc figure img { max-width: 100%; border: 1px solid var(--line);
  border-radius: var(--r-sm); background: #fff; }
.flexdoc hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.flexdoc table.dense { margin: 10px 0; font-size: 13px; }

/* 文衡 · 对勘本（collation）
   骨架取「仪表·瑞士制」的网格与字距；语义取「朱批」——朱色只标「本期改动」，不作装饰色。
   本文件只作用于 body.whc-body，不影响控制台 / 任务页 / 红色件清单。

   2026-09-15 定稿：色板不再在本文件里另立一套，改为继承 style.css 的 :root 令牌
   （--paper/--paper-2/--zline/--song/--zc-ok 是那边的别名）。两页同源，改色只改一处。 */

.whc-body { background: var(--paper); color: var(--ink); }
.whc-body .topbar { background: var(--paper-2); }
.whc-body .brand .logo { color: var(--ink); }
.whc-body main.wrap { max-width: 1280px; }
.whc-body .topbar .wrap { max-width: 1280px; }
.whc-body .foot { max-width: 1280px; }
.whc-body .mono, .whc-body code { font-family: var(--mono); }

/* ---------- 面包屑 ---------- */
.whc-crumb { padding: 14px 0 0; font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }
.whc-crumb a { color: var(--ink-2); border-bottom: 1px solid var(--zline-2); }
.whc-crumb a:hover { color: var(--zhu); border-bottom-color: var(--zhu); text-decoration: none; }
.whc-crumb .sep { padding: 0 8px; color: var(--zline-2); }

/* ---------- 题首 ---------- */
.whc-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
  padding: 30px 0 20px; border-bottom: 1px solid var(--zline-2); flex-wrap: wrap; }
.whc-kicker { font-size: 11px; letter-spacing: .3em; color: var(--ink-3); margin-bottom: 14px; }
.whc-kicker em { color: var(--zhu); font-style: normal; }
.whc-hero h1 { font-size: 19px; font-weight: 500; line-height: 1.45; letter-spacing: .03em; color: var(--ink-2); }
.whc-hero h1 .big { font-family: Consolas, monospace; font-size: 46px; line-height: 1;
  color: var(--zhu); letter-spacing: -.01em; vertical-align: -3px; margin: 0 5px; }
.whc-hero .lead { margin-top: 11px; font-size: 12.5px; color: var(--ink-3); letter-spacing: .06em; }
.whc-hero .lead b { color: var(--ink-2); font-weight: 600; }
.whc-hero .lead .z { color: var(--zhu); }
.whc-hr { display: flex; align-items: center; gap: 26px; position: relative; }
.whc-sign { text-align: right; font-size: 11.5px; letter-spacing: .13em; color: var(--ink-3); line-height: 1.9; }
.whc-sign b { display: block; font-size: 13px; color: var(--ink-2); letter-spacing: .2em; font-weight: 500; }
.whc-sign .done { display: none; color: var(--zhu); }
.whc-btn { background: var(--zhu); color: #f8f3e8; border: none; padding: 13px 24px; font-size: 13px;
  letter-spacing: .34em; font-family: var(--song); cursor: pointer; transition: background .2s; }
.whc-btn:hover { background: var(--zhu-deep); }
.whc-btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--zline-2); letter-spacing: .18em; padding: 11px 18px; }
.whc-btn.ghost:hover { border-color: var(--zhu); color: var(--zhu); background: transparent; }
.whc-btn[disabled] { opacity: .45; cursor: default; }
.whc-stamp { position: absolute; right: 4px; top: -22px; width: 96px; height: 96px; border: 4px solid var(--zhu);
  border-radius: 4px; display: grid; place-items: center; color: var(--zhu); font-family: var(--song);
  font-weight: 700; font-size: 28px; transform: rotate(-13deg) scale(1.6); opacity: 0;
  pointer-events: none; mix-blend-mode: multiply; line-height: 1; }
.whc-stamp small { position: absolute; bottom: 11px; font-size: 8px; letter-spacing: .26em; font-weight: 400; font-family: "Microsoft YaHei", sans-serif; }
.whc.signed .whc-stamp { animation: whcStamp .5s cubic-bezier(.2, .9, .3, 1.4) forwards; }
.whc.signed .whc-btn.sign { display: none; }
.whc.signed .whc-sign .todo { display: none; }
.whc.signed .whc-sign .done { display: block; }
@keyframes whcStamp { 60% { opacity: .95; transform: rotate(-8deg) scale(.96); } 100% { opacity: .9; transform: rotate(-9deg) scale(1); } }

/* ---------- 期次印记链 ----------
   首屏的主导航：横向一排期次，签过的用朱印，失效的用金，正在看的加粗下划线。
   它同时是「历期都对勘过了」这件事的证据条——比一张最近任务表格更贴业务。 */
.whc-chain { display: flex; align-items: center; gap: 0; flex-wrap: wrap; margin-top: 16px; }
.whc-chain .ch-l {
  font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--ink-3);
  margin-right: 12px;
}
.whc-chain .ch-i {
  display: inline-flex; align-items: baseline; gap: 7px; padding: 5px 12px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: .04em;
  border: 1px solid var(--zline); border-right: none; background: var(--paper-2);
  transition: all .16s;
}
.whc-chain .ch-i:last-child { border-right: 1px solid var(--zline); }
.whc-chain .ch-i i { font-style: normal; font-size: 9.5px; letter-spacing: .12em; color: var(--ink-3); }
.whc-chain .ch-i:hover { background: var(--zhu-wash); color: var(--zhu); border-color: var(--zhu); }
.whc-chain .ch-i.on { background: var(--ink); color: #EDEAE2; border-color: var(--ink); }
.whc-chain .ch-i.on i { color: #B7B1A4; }
.whc-chain .ch-i.sg i { color: var(--zhu); }
.whc-chain .ch-i.st i { color: var(--gold); }

/* ---------- 工具条 ---------- */
.whc-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0 0; }
.whc-sw { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none;
  border: 1px solid var(--zline-2); padding: 6px 13px; font-size: 12px; letter-spacing: .12em; color: var(--ink-3); background: var(--paper-2); }
.whc-sw:hover { border-color: var(--zhu); }
.whc-sw .dot { width: 24px; height: 12px; border: 1px solid var(--zline-2); position: relative; background: var(--paper-3); transition: all .2s; flex: none; }
.whc-sw .dot::after { content: ""; position: absolute; left: 1px; top: 1px; width: 8px; height: 8px; background: var(--ink-3); transition: all .2s; }
.whc-sw.on { color: var(--zhu); border-color: var(--zhu); }
.whc-sw.on .dot { border-color: var(--zhu); background: var(--zhu-wash); }
.whc-sw.on .dot::after { left: 13px; background: var(--zhu); }
.whc-q { flex: 1; min-width: 180px; max-width: 320px; margin: 0; padding: 7px 10px; font-size: 13px;
  border: 1px solid var(--zline-2); background: var(--paper-2); color: var(--ink); font-family: inherit; border-radius: 0; }
.whc-q:focus { outline: none; border-color: var(--zhu); }
.whc-hint { font-size: 11.5px; letter-spacing: .1em; color: var(--ink-3); }
.whc-hint b { color: var(--zhu); font-weight: 500; font-family: Consolas, monospace; }

/* ---------- 三栏 ---------- */
.whc-grid { display: grid; grid-template-columns: 208px minmax(0, 1fr) 306px; margin-top: 14px;
  border: 1px solid var(--zline-2); background: var(--paper-2); align-items: start; }
@media (max-width: 1120px) {
  .whc-grid { grid-template-columns: 1fr; }
  .whc-nav { border-right: none !important; border-bottom: 1px solid var(--zline); }
  .whc-main { border-right: none !important; }
}
.whc-nav { border-right: 1px solid var(--zline); padding: 18px 0; position: sticky; top: 57px; }
.whc-nav-h { font-size: 10.5px; letter-spacing: .28em; color: var(--ink-3); padding: 0 18px 12px; }
.whc-ni { display: flex; align-items: center; gap: 9px; padding: 9px 18px; cursor: pointer;
  border-left: 2px solid transparent; transition: all .16s; }
.whc-ni:hover { background: var(--zhu-wash); }
.whc-ni.on { border-left-color: var(--zhu); background: var(--zhu-wash); }
.whc-ni .no { font-family: var(--song); font-size: 12px; color: var(--ink-3); width: 15px; flex: none; }
.whc-ni.on .no { color: var(--zhu); }
.whc-ni .nm { flex: 1; font-size: 12.5px; color: var(--ink-2); letter-spacing: .03em; }
.whc-ni.on .nm { color: var(--ink); }
.whc-ni .ct { font-family: Consolas, monospace; font-size: 11.5px; color: var(--ink-3); }
.whc-ni.on .ct { color: var(--zhu); }
.whc-nav-t { margin-top: 10px; padding: 12px 18px 0; border-top: 1px solid var(--zline-3);
  display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; color: var(--ink-3); }
.whc-nav-t b { font-family: Consolas, monospace; font-size: 14px; color: var(--ink); font-weight: 500; letter-spacing: 0; }

.whc-main { border-right: 1px solid var(--zline); padding: 20px 26px 26px; min-height: 420px; }
.whc-mh { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding-bottom: 11px; border-bottom: 1px solid var(--zline-3); margin-bottom: 16px; }
.whc-mh h2 { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
.whc-mh h2 em { font-family: Consolas, monospace; font-style: normal; font-size: 11px; color: var(--ink-3); letter-spacing: .04em; margin-left: 9px; }
.whc-mh .tip { font-size: 11px; letter-spacing: .1em; color: var(--ink-3); }
.whc-empty { padding: 40px 0; text-align: center; font-size: 13px; color: var(--ink-3); line-height: 2; }
.whc-more { margin-top: 14px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; }
.whc-more button { background: none; border: 1px solid var(--zline-2); color: var(--ink-2);
  padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: .1em; }
.whc-more button:hover { border-color: var(--zhu); color: var(--zhu); }

/* ---------- 对勘卡 ---------- */
.dc { border: 1px solid var(--zline); background: var(--paper-2); margin-bottom: 12px; transition: border-color .18s; }
.dc:hover, .dc.hi { border-color: var(--zhu); }
.dc-h { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-bottom: 1px solid var(--zline-3);
  background: var(--paper); flex-wrap: wrap; }
.dc-loc { font-family: Consolas, monospace; font-size: 11.5px; color: var(--ink-2); letter-spacing: .02em; }
.dc-src { font-family: Consolas, monospace; font-size: 11px; color: var(--ink-3); margin-left: auto; word-break: break-all; }
.dc-tag { font-size: 10px; letter-spacing: .1em; padding: 1px 7px; border: 1px solid; flex: none; }
.dc-tag.z { border-color: var(--zhu); color: var(--zhu); }
.dc-tag.m { border-color: var(--gold); color: var(--gold); }
.dc-b { padding: 12px 13px 13px; font-family: var(--song); font-size: 15.5px; line-height: 2; }
.dv-r { display: flex; gap: 10px; align-items: flex-start; }
.dv-r + .dv-r { margin-top: 2px; }
/* 标签列宽度按「上期 202605」这类最长标签留位，不换行——否则 4 字标签会竖排断开 */
.dv-k { flex: none; min-width: 62px; padding-top: 6px; white-space: nowrap;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 10px; letter-spacing: .1em; color: var(--ink-3); }
.dv-v { flex: 1; min-width: 0; word-break: break-word; }
.dv-r.up .dv-v { color: var(--ink); }
.dv-r.dn .dv-v { color: var(--ink-3); }
.del { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--zline-2); }
.ins { color: var(--zhu); font-weight: 600; text-emphasis: filled dot var(--zhu); text-emphasis-position: under right;
  -webkit-text-emphasis: filled dot var(--zhu); -webkit-text-emphasis-position: under right; }
.hand { color: var(--gold); border-bottom: 1px dashed var(--gold); font-family: "Microsoft YaHei", sans-serif; font-size: 13px; padding: 0 2px; }
.el { color: var(--zline-2); font-family: "Microsoft YaHei", sans-serif; font-size: 12px; }
.dc-note { padding: 0 13px 11px; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
.whc.clean .del, .whc.clean .el { display: none; }
.whc.clean .ins { color: inherit; font-weight: inherit; text-emphasis: none; -webkit-text-emphasis: none; }
.whc.clean .dv-r.dn { display: none; }
.whc.clean .hand { color: var(--gold); border-bottom-color: var(--gold); }

/* ---------- 表格格（大表）---------- */
.cellwrap { overflow-x: auto; border: 1px solid var(--zline); background: var(--paper-2); }
table.cells { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cells th { text-align: left; font-weight: 500; font-size: 10.5px; letter-spacing: .18em; color: var(--ink-3);
  padding: 8px 10px; border-bottom: 1px solid var(--zline-2); background: var(--paper); white-space: nowrap; }
table.cells td { padding: 6px 10px; border-bottom: 1px dashed var(--zline-2); vertical-align: top; }
table.cells tr:hover td { background: var(--zhu-wash); }
table.cells td.c-loc { font-family: Consolas, monospace; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
table.cells td.c-old { color: var(--ink-3); }
table.cells td.c-old .del { text-decoration-color: var(--zline-2); }
table.cells td.c-new { color: var(--zhu); font-weight: 600; }
table.cells td.c-new .ins { text-emphasis: none; -webkit-text-emphasis: none; }
.whc.clean table.cells td.c-old { display: none; }

/* ---------- 图表槽 ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.chc { border: 1px solid var(--zline); background: var(--paper-2); padding: 12px 13px; }
.chc b { display: block; font-size: 13px; letter-spacing: .04em; margin-bottom: 4px; }
/* 缩略图：matplotlib 出的是白底 PNG，放暖灰卡上必须自己铺白底，否则边框糊在一起。
   图例文字在这个尺寸下读不清是正常的 —— 点开就是原图，缩略图只负责「哪张图在哪一格」。 */
.chc .thumb { display: block; margin: 0 0 9px; border: 1px solid var(--zline); background: #fff; }
.chc .thumb img { display: block; width: 100%; height: auto; }
.chc a.thumb:hover { border-color: var(--zhu); }
.chc .thumb.miss {
  background: var(--paper); border-style: dashed; color: var(--ink-3);
  font-size: 11px; letter-spacing: .1em; text-align: center; padding: 20px 0;
}
.chc .fn { font-family: Consolas, monospace; font-size: 11.5px; color: var(--zhu); word-break: break-all; }
.chc .src { font-family: Consolas, monospace; font-size: 10.5px; color: var(--ink-3); margin-top: 5px; word-break: break-all; }
.chc .from { font-size: 11px; color: var(--ink-3); margin-top: 5px; letter-spacing: .06em; }

/* ---------- 右栏：校记 ---------- */
.whc-side { padding: 18px 18px 24px; background: var(--paper); position: sticky; top: 57px; }
.whc-sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 13px;
  padding-bottom: 10px; border-bottom: 1px solid var(--zline-2); }
.whc-sh h2 { font-size: 12px; font-weight: 600; letter-spacing: .24em; }
.whc-sh em { font-family: Consolas, monospace; font-style: normal; font-size: 10.5px; color: var(--ink-3); }
.whc-side .ph { font-size: 11.5px; color: var(--ink-3); line-height: 2; }
.sd { padding: 11px 0; border-bottom: 1px dashed var(--zline-2); }
.sd:last-child { border-bottom: none; }
.sd dt { font-size: 10px; letter-spacing: .2em; color: var(--ink-3); margin-bottom: 3px; }
.sd dd { font-size: 13px; word-break: break-all; }
.sd dd.mono { font-family: Consolas, monospace; font-size: 12px; }
.sd dd.z { color: var(--zhu); font-weight: 600; }
.sd-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.sd-bar button { background: none; border: 1px solid var(--zline-2); color: var(--ink-2); font-size: 11px;
  padding: 5px 11px; cursor: pointer; font-family: inherit; letter-spacing: .08em; }
.sd-bar button:hover { border-color: var(--zhu); color: var(--zhu); }
.whc-gates { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--zline-2); }
.whc-gates .g { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-2); padding: 4px 0; letter-spacing: .06em; }
.whc-gates .gd { width: 8px; height: 8px; background: var(--zc-ok); flex: none; }
.whc-gates .g.wait .gd { background: transparent; border: 1px solid var(--gold); }
.whc-gates .g.wait { color: var(--gold); }
.whc.signed .whc-gates .g.wait .gd { background: var(--zc-ok); border-color: var(--zc-ok); }
.whc.signed .whc-gates .g.wait { color: var(--zc-ok); }
.whc-gates .gs { margin-left: auto; font-family: Consolas, monospace; font-size: 10.5px; color: var(--ink-3); }

/* ---------- 溯源浮层 ---------- */
.whc-pop { position: fixed; z-index: 200; background: var(--ink); color: #f2eee3; padding: 12px 15px;
  min-width: 240px; max-width: 440px;
  box-shadow: 0 20px 46px -18px rgba(23, 21, 15, .6); display: none; font-size: 12px; line-height: 1.7; border-left: 3px solid var(--zhu); }
.whc-pop.on { display: block; }
.whc-pop .ph { font-size: 10px; letter-spacing: .26em; color: #9a9587; margin-bottom: 7px; }
.whc-pop .pc { font-family: Consolas, monospace; font-size: 13.5px; color: #fff; word-break: break-all; margin-bottom: 8px; }
.whc-pop .pr { font-size: 10px; letter-spacing: .2em; color: #9a9587; margin-top: 7px; }
.whc-pop .pr b { display: block; font-family: Consolas, monospace; font-size: 12px; color: #fff; font-weight: 400;
  letter-spacing: 0; line-height: 1.7; word-break: break-word; margin-top: 2px; }
.whc-pop .pf { margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(242, 238, 227, .16); font-size: 11px; color: #9a9587; }

.whc-tail { margin-top: 20px; padding: 14px 0 0; border-top: 1px solid var(--zline-2);
  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; font-size: 11px; letter-spacing: .1em; color: var(--ink-3); }

/* ---------- 签单区（审批动作，不是动画） ---------- */
/* 题首是 flex-wrap:wrap，靠 flex-basis:100% 让它独占一行落在按钮下方 */
.whc-signpanel { flex: 1 0 100%; margin-top: 16px; padding: 13px 16px; border: 1px solid var(--zline-2);
  background: var(--paper-2); border-left: 3px solid var(--ink-3); display: flex; flex-wrap: wrap;
  align-items: center; gap: 10px 18px; }
.whc-signpanel .ro-t { font-size: 12.5px; letter-spacing: .1em; color: var(--ink); font-weight: 600; }
.whc-signpanel .ro-d { flex: 1; min-width: 240px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; line-height: 1.7; }
.whc-signpanel .ro-f { margin-left: auto; }
.whc-signpanel .ro-ack { flex: 1 0 100%; font-size: 12px; color: var(--ink-2); letter-spacing: .05em;
  display: flex; align-items: center; gap: 8px; cursor: pointer; }
.whc-signpanel .ro-ack input { accent-color: var(--zhu); width: 14px; height: 14px; flex: none; }
.whc-signpanel .ro-ack b { color: var(--zhu); font-family: Consolas, monospace; }
.whc-signpanel .ro-note { flex: 1; min-width: 200px; padding: 8px 10px; font-size: 12.5px; font-family: inherit;
  border: 1px solid var(--zline-2); background: var(--paper); color: var(--ink); border-radius: 0; }
.whc-signpanel .ro-note:focus { outline: none; border-color: var(--zhu); }
.whc-signpanel .ro-btns { display: flex; gap: 8px; }
.whc-signpanel.form { border-left-color: var(--zhu); }
.whc-signpanel.ok { border-left-color: var(--zc-ok); }
.whc-signpanel.ok .ro-t { color: var(--zc-ok); }
.whc-signpanel.stale { border-left-color: var(--gold); }
.whc-signpanel.stale .ro-t { color: var(--gold); }
.whc-signpanel.ro { border-left-color: var(--zline-2); }
.whc-signpanel.ro .ro-t { color: var(--ink-2); }

.whc-gates .g.stale { color: var(--gold); }
.whc-gates .g.stale .gd { background: var(--gold); }

/* ---------- 操作闪回 ---------- */
/* 工具条是 flex-wrap:wrap，靠 flex-basis:100% 独占一行 */
.whc-flash { flex: 1 0 100%; margin: 0 0 10px; padding: 9px 13px; font-size: 12px; letter-spacing: .06em;
  border-left: 3px solid var(--ink-3); background: var(--paper-2); }
.whc-flash.err { border-left-color: var(--zhu); color: var(--zhu); }
.whc-flash.ok { border-left-color: var(--zc-ok); color: var(--zc-ok); }
.whc-flash.warn { border-left-color: var(--gold); color: var(--gold); }

    }
    while (i < n) push('del', a.charAt(i++));
    while (j < m) push('ins', b.charAt(j++));
    return ops;
  }

  /* 只取改动附近的一段窗口，避免把 50 字截断串整行摊开 */
  function diffWindow(oldS, newS, pad) {
    pad = pad || 14;
    if (oldS === newS) return null;
    var ops = diffOps(oldS, newS), i0 = -1, i1 = -1, k;
    for (k = 0; k < ops.length; k++) {
      if (ops[k].t !== 'eq') { if (i0 < 0) i0 = k; i1 = k; }
    }
    if (i0 < 0) return null;
    var s = Math.max(0, i0 - pad), e = Math.min(ops.length - 1, i1 + pad);
    var up = '', dn = '';
    for (k = s; k <= e; k++) {
      var o = ops[k];
      if (o.t === 'eq') { up += fmt(o.s); dn += fmt(o.s); }
      else if (o.t === 'del') up += '<span class="del">' + fmt(o.s) + '</span>';
      else dn += '<span class="ins">' + fmt(o.s) + '</span>';
    }
    var head = s > 0 ? '<span class="el">…</span>' : '';
    var tail = e < ops.length - 1 ? '<span class="el">…</span>' : '';
    return { up: head + up + tail, dn: head + dn + tail };
  }

  /* ---------------- 卡片 ---------------- */
  function cardHTML(sl) {
    var w = diffWindow(sl.old, sl.new, 14);
    var lab = sl.oldLabel || '母版原文';
    var head = '<div class="dc-h"><span class="dc-loc">' + esc(sl.loc) + '</span>' +
      (sl.manual ? '<span class="dc-tag m">待人工 ' + manualCount(sl.new) + '</span>' : '<span class="dc-tag z">已替换</span>') +
      '<span class="dc-src">' + esc(sl.source) + '</span></div>';
    var body;
    if (!w) {
      body = '<div class="dv-r up"><span class="dv-k">本期</span><div class="dv-v">' +
        (esc(sl.new) || '<span class="el">（空）</span>') + '</div></div>' +
        '<div class="dc-note">与' + esc(lab) + '逐字一致（本槽无改动，或为整段替换）。</div>';
    } else {
      body = '<div class="dv-r dn"><span class="dv-k">' + esc(lab) + '</span><div class="dv-v">' + w.up + '</div></div>' +
        '<div class="dv-r up"><span class="dv-k">本期</span><div class="dv-v">' + w.dn + '</div></div>';
    }
    return '<article class="dc" data-loc="' + esc(sl.loc) + '">' + head + '<div class="dc-b">' + body + '</div></article>';
  }

  /* 图表槽位就地铺图：`chartUrl` 由服务端给（走 resolve_chart 解析磁盘真图后才会有），
     没有就退回纯文件名 —— 宁可显示「未落盘」，也不放一个裂图。 */
  function chartsHTML(list, live) {
    var out = '<div class="charts">';
    list.forEach(function (sl) {
      var fn = String(sl.new).replace('[图] ', '');
      var u = sl.chartUrl || '';
      /* 离线快照（make_collation_snapshot.py）没有服务端取图，整块缩略图就不渲染——
         否则会满屏「图未落盘」，把真缺图的情况淹掉。 */
      var pic = '';
      if (u) {
        pic = '<a class="thumb" href="' + esc(u) + '" target="_blank" rel="noopener"' +
          ' title="点开原图：' + esc(fn) + '"><img src="' + esc(u) + '" alt="' + esc(fn) +
          '" loading="lazy"></a>';
      } else if (live) {
        pic = '<div class="thumb miss">图未落盘</div>';
      }
      out += '<div class="chc" data-loc="' + esc(sl.loc) + '">' + pic +
        '<b>' + esc(sl.loc.replace('正文/', '')) + '</b>' +
        '<span class="fn">' + esc(fn) + '</span>' +
        '<div class="from">原状：' + esc(sl.old) + '</div>' +
        '<div class="src">' + esc(sl.source) + '</div></div>';
    });
    return out + '</div>';
  }

  function cellsHTML(list, expanded) {
    var shown = expanded ? list : list.slice(0, CELL_CAP);
    var out = '<div class="cellwrap"><table class="cells"><thead><tr>' +
      '<th>位置</th><th>对照值</th><th>本期填充</th><th>来源</th></tr></thead><tbody>';
    shown.forEach(function (sl) {
      var w = diffWindow(sl.old, sl.new, 6);
      var up = w ? w.up : esc(sl.old);
      /* 空格提示用「这一行自己的」参照标签：大表里 T01/表头、上期值、学科名列三者来源不同，
         取列表首项的标签会串味（学科名列曾被写成「母版表头为空」） */
      if (!up || !strip(up).length) up = '<span class="el">（' + esc(sl.oldLabel || '对照值') + '为空）</span>';
      out += '<tr data-loc="' + esc(sl.loc) + '">' +
        '<td class="c-loc">' + esc(sl.loc) + '</td>' +
        '<td class="c-old">' + up + '</td>' +
        '<td class="c-new">' + (w ? w.dn : esc(sl.new)) + '</td>' +
        '<td class="c-loc">' + esc(sl.source) + '</td></tr>';
    });
    out += '</tbody></table></div>';
    var note = '共 ' + list.length + ' 格 · 对照值出处逐行见「来源」列';
    if (!expanded && list.length > CELL_CAP) {
      out += '<p class="whc-more">' + note + '，先显示前 ' + CELL_CAP + ' 格。' +
        '<button data-expand="1">展开全部 ' + list.length + ' 格</button>' +
        ' <button data-csv="1">复制为 TSV</button></p>';
    } else if (list.length) {
      out += '<p class="whc-more">' + note + '。<button data-csv="1">复制为 TSV</button></p>';
    }
    return out;
  }

  /* ---------------- 过滤 ---------------- */
  function filtered(sec) {
    var q = state.q.trim().toLowerCase();
    return sec.slots.filter(function (sl) {
      if (state.manualOnly && !sl.manual) return false;
      if (q && haystack(sl).indexOf(q) < 0) return false;
      return true;
    });
  }
  function sectionCount(sec) { return filtered(sec).length; }

  /* ---------------- 渲染 ---------------- */
  var C = D.counts || { total: 0, text: 0, cell: 0, chart: 0, manual: 0 };
  var T = D.totals || C;          /* 题首/汇总用全量；快照可只内联抽样 */
  var A = D.assertions || { total: 0, fail: 0 };
  var AP = D.approval || {};                                   /* 审批（签单）记录 */
  var AS = D.approvalStatus || (AP.signed ? 'signed' : 'unsigned');
  var FL = D.flash || {};                                      /* POST 后的闪回 */
  var JOB = D.jobId || '';
  /* 签单/撤回统一按期次投递（服务端给 signUrl/revokeUrl）；任务入口是由期次页
     共用的同一套端点，所以这里不再从 JOB 拼路径——拼接在看板/期次两个入口下
     会各造一个 URL，签完回跳就会跳错页。 */
  var SIGN = D.signUrl || (JOB ? '/jobs/' + encodeURIComponent(JOB) + '/collation/sign' : '');
  var REVOKE = D.revokeUrl || (JOB ? '/jobs/' + encodeURIComponent(JOB) + '/collation/revoke' : '');
  var BACK = D.backUrl || '';
  var LIVE = !!SIGN;

  function hiddenBack() {
    return BACK ? '<input type="hidden" name="back" value="' + esc(BACK) + '">' : '';
  }

  /* 期次印记链：每期一枚印，点开进当期对勘本。这是首屏的主导航。 */
  function periodChainHTML() {
    var ps = D.periods || [];
    if (ps.length < 2) return '';
    var cur = D.periodDir || D.period;
    var out = '<div class="whc-chain"><span class="ch-l">期 次 印 记</span>';
    ps.forEach(function (p) {
      var cls = 'ch-i' + (p.period === cur ? ' on' : '') +
        (p.status === 'signed' ? ' sg' : p.status === 'stale' ? ' st' : '');
      var tag = p.status === 'signed' ? '已钤印' : p.status === 'stale' ? '失效' : '待签';
      out += '<a class="' + cls + '" href="' + esc(p.url) + '"' +
        (p.period === cur ? ' aria-current="page"' : '') +
        ' title="' + esc((p.signed_at ? p.signed_at + ' · ' + p.signed_actor : '尚未签单')) + '">' +
        esc(p.period) + '<i>' + tag + '</i></a>';
    });
    return out + '</div>';
  }

  /* 签单区：签单是审批动作，不是动画。真实表单 POST，状态由服务端落库后回带。 */
  function signFormHTML() {
    return '<form class="whc-signpanel form" method="post" action="' + esc(SIGN) + '">' + hiddenBack() +
      '<div class="ro-t">钤印签单 · 逐条核对后方可放行</div>' +
      (T.manual
        ? '<label class="ro-ack"><input type="checkbox" name="ack" value="1" required>' +
          '我已知悉仍有 <b>' + T.manual + '</b> 处【手工：…】待人工补录项，确认放行</label>'
        : '<label class="ro-ack"><input type="checkbox" checked disabled>' +
          '待人工补录项为 0，机器断言全绿</label>') +
      '<input class="ro-note" type="text" name="note" maxlength="120"' +
      ' placeholder="批注（可选，会写进审批记录）">' +
      '<div class="ro-btns">' +
      '<button type="submit" class="whc-btn">确 认 签 单</button>' +
      '<button type="button" class="whc-btn ghost" id="whcSignCancel">取消</button>' +
      '</div></form>';
  }

  function signZoneHTML() {
    if (!LIVE) {
      return '<div class="whc-signpanel ro">' +
        '<span class="ro-t">静态快照 · 签单动作需在演示站内进行</span>' +
        '<span class="ro-d">签单要绑住当时那份报告并落库，快照里没有服务端，故只作只读展示。</span></div>';
    }
    if (AS === 'signed') {
      return '<div class="whc-signpanel ok">' +
        '<span class="ro-t">已钤印 · 放行报送</span>' +
        '<span class="ro-d">' + esc(AP.actor || '') + ' · ' + esc(AP.signed_at || '') +
        (AP.note ? ' · 批注：' + esc(AP.note) : '') + '</span>' +
        '<form method="post" action="' + esc(REVOKE) + '" class="ro-f"' + hiddenBack() +
        ' onsubmit="return confirm(\'确认撤回本次签单？撤回会保留操作历史。\')">' +
        '<button type="submit" class="whc-btn ghost">撤 回 签 单</button></form></div>';
    }
    if (AS === 'stale') {
      /* 失效后可以直接重签（服务端允许），不必先撤销——少一步，别给人添堵 */
      if (state.signPanel) return signFormHTML();
      return '<div class="whc-signpanel stale">' +
        '<span class="ro-t">签名已失效 · 需重新签单</span>' +
        '<span class="ro-d">上次签单（' + esc(AP.actor || '') + ' · ' + esc(AP.signed_at || '') +
        '）之后报告初稿或红色件数据被重新生成，签名不再对应当前稿件。核对后可直接重签。</span>' +
        '<form method="post" action="' + esc(REVOKE) + '" class="ro-f">' + hiddenBack() +
        '<button type="submit" class="whc-btn ghost">清 除 失 效 记 录</button></form></div>';
    }
    return state.signPanel ? signFormHTML() : '';
  }

  function heroHTML() {
    var lead = '上期 <b>' + esc(D.periodPrev || '—') + '</b> → 本期 <b>' + esc(D.period) + '</b>' +
      ' · 机器断言 <b class="' + (A.fail ? '' : 'z') + '">' + (A.total - A.fail) + '/' + A.total +
      (A.fail ? ' 有 ' + A.fail + ' 项未过' : ' 全绿') + '</b>' +
      ' · 文字槽 <b>' + T.text + '</b> · 大表格 <b>' + T.cell + '</b> · 图表 <b>' + T.chart + '</b>' +
      ' · 待人工补录 <b class="z">' + T.manual + '</b> 处';
    var signState;
    if (AS === 'signed') {
      /* 文案保留占位但不可见：签单区已写明「已钤印」，这里再写一遍会和钤印图章压字。
         visibility 而非 display，是为了让 .whc-hr 保住高度，图章落点才不会偏。 */
      signState = '<span class="todo" style="display:none"></span>' +
        '<span class="done" style="visibility:hidden">已钤印 · 放行报送</span>';
    } else if (AS === 'stale') {
      signState = '<span class="done" style="display:block;color:var(--gold)">签名已失效</span>';
    } else {
      signState = '<span class="todo">待签人<b>' + esc(D.actor || '馆员') + ' · 学科服务部</b>' + esc(D.signedAt || '') + '</span>';
    }
    var canSign = (AS === 'unsigned' || AS === 'stale') && LIVE && !state.signPanel;
    var btn = canSign
      ? '<button class="whc-btn sign" id="whcSign"' + (A.fail ? ' disabled title="机器断言未过，闸门不放行"' : '') + '>钤 印 签 单</button>'
      : '';
    return '<div>' +
      '<div class="whc-kicker">期次 ' + esc(D.period) + ' · 槽位级对勘 · <em>全链路确定性脚本</em></div>' +
      '<h1>本期改动<span class="big">' + T.total + '</span>处，逐条指向台账单元格</h1>' +
      '<p class="lead">' + lead + '</p>' +
      periodChainHTML() + '</div>' +
      '<div class="whc-hr">' +
      '<div class="whc-sign">' + signState + '</div>' +
      btn +
      '<div class="whc-stamp">文衡<small>学 科 服 务</small></div></div>' +
      signZoneHTML();
  }

  function flashHTML() {
    if (FL.err) return '<p class="whc-flash err">闸门未放行：' + esc(FL.err) + '</p>';
    if (FL.signed) return '<p class="whc-flash ok">签单已落库，写入 out/' + esc(D.outDir || D.period) + '/approval.json 与《审批记录.md》</p>';
    if (FL.revoked) return '<p class="whc-flash warn">已撤回签单，操作历史保留在审批记录中</p>';
    if (AS === 'stale') return '<p class="whc-flash warn">上次签单之后报告被重新生成，签名已失效，请重新核对后签单</p>';
    return '';
  }

  function barHTML() {
    return flashHTML() +
      '<span class="whc-sw' + (state.zhu ? ' on' : '') + '" id="whcSw"><span class="dot"></span>朱批层</span>' +
      '<input class="whc-q" id="whcQ" placeholder="搜索位置 / 改动文字 / 来源…">' +
      '<span class="whc-sw' + (state.manualOnly ? ' on' : '') + '" id="whcSwM"><span class="dot"></span>仅看待人工 <b>' + T.manual + '</b></span>' +
      '<span class="whc-hint">点击 <b>位置</b> 查看台账来源 · 按 ← → 换分组</span>';
  }

  function navHTML() {
    var total = 0, out = '<div class="whc-nav-h">槽 位 分 组</div>';
    D.sections.forEach(function (sec) {
      var n = sectionCount(sec);
      total += n;
      out += '<a class="whc-ni' + (state.sec === sec.id ? ' on' : '') + '" data-sec="' + sec.id + '">' +
        '<span class="no">' + sec.count + '</span>' +
        '<span class="nm">' + esc(sec.name) + '</span>' +
        '<span class="ct">' + n + '</span></a>';
    });
    out += '<div class="whc-nav-t"><span>命中</span><b>' + total + '</b></div>';
    return out;
  }

  function mainHTML() {
    var sec = D.sections.filter(function (s) { return s.id === state.sec; })[0];
    if (!sec) return '<div class="whc-empty">该分组不存在。</div>';
    var list = filtered(sec);
    /* 分组是按位置前缀切的，所以「学科图表槽位」里会夹进非图的格子（实测 T17/r0c1 是
       「清除母版残留文本」）。提示按「图」计数，别把清理格也算成一张图。 */
    var nChart = 0, nPic = 0;
    list.forEach(function (s) {
      if (s.kind !== 'chart') return;
      nChart++;
      if (s.chartUrl) nPic++;
    });
    var tipTxt = list.length + ' / ' + sec.count + ' 处 · 朱色为改动';
    if (nChart) {
      tipTxt = nChart + ' 张图已铺 ' + nPic +
        (nPic < nChart ? '（缺 ' + (nChart - nPic) + '）' : '') + ' · 点图看原图';
    }
    var head = '<div class="whc-mh"><h2>' + esc(sec.name) + '<em>' + esc(sec.note || '') + '</em></h2>' +
      '<span class="tip">' + tipTxt + '</span></div>';
    if (!list.length) return head + '<div class="whc-empty">没有匹配的槽位。</div>';

    var texts = [], charts = [], cells = [];
    list.forEach(function (sl) {
      (sl.kind === 'chart' ? charts : sl.kind === 'cell' ? cells : texts).push(sl);
    });
    var out = head;
    texts.forEach(function (sl) { out += cardHTML(sl); });
    if (charts.length) out += chartsHTML(charts, LIVE);
    if (cells.length) out += cellsHTML(cells, state.expandCells === sec.id);
    return out;
  }

  function sideHTML() {
    var sl = state.focus;
    var h = '<div class="whc-sh"><h2>校 记</h2><em>' + (sl ? esc(sl.loc) : esc(D.period) + ' · 汇总') + '</em></div>';
    if (!sl) {
      return h + '<dl class="sd">' +
        '<dt>本期槽位</dt><dd class="mono">' + T.total + ' 处</dd>' +
        '<dt>文字 / 大表 / 图表</dt><dd class="mono">' + T.text + ' / ' + T.cell + ' / ' + T.chart + '</dd>' +
        '<dt>待人工补录</dt><dd class="z">' + T.manual + ' 处</dd>' +
        '<dt>机器断言</dt><dd class="mono">' + (A.total - A.fail) + ' / ' + A.total + (A.fail ? ' · ' + A.fail + ' 项未过' : ' · 全绿') + '</dd>' +
        '</dl><p class="ph">把光标移到左侧任意一条改动上，这里显示它的台账出处。</p>' +
        gatesHTML();
    }
    var body = '';
    if (sl.kind === 'chart') {
      body = '<dt>槽位类型</dt><dd>图表' + (has(sl.old, '母版旧图') ? '（替换母版旧图）' : '（新插入）') + '</dd>' +
        '<dt>插入文件</dt><dd class="mono z">' + esc(String(sl.new).replace('[图] ', '')) + '</dd>' +
        '<dt>原状</dt><dd>' + esc(sl.old) + '</dd>' +
        '<dt>来源</dt><dd class="mono">' + esc(sl.source) + '</dd>';
    } else if (sl.kind === 'cell') {
      body = '<dt>槽位类型</dt><dd>大表数值格</dd>' +
        '<dt>' + esc(sl.oldLabel || '母版此格') + '</dt><dd class="mono">' + (esc(sl.old) || '（空）') + '</dd>' +
        '<dt>本期填充</dt><dd class="mono z">' + esc(sl.new) + '</dd>' +
        '<dt>来源</dt><dd class="mono">' + esc(sl.source) + '</dd>';
    } else {
      body = '<dt>槽位类型</dt><dd>正文段落</dd>' +
        '<dt>改动字符</dt><dd class="mono z">' + changedChars(sl) + ' 字</dd>' +
        '<dt>待人工</dt><dd class="mono">' + (manualCount(sl.new) || 0) + ' 处</dd>' +
        '<dt>来源</dt><dd class="mono">' + esc(sl.source) + '</dd>';
    }
    var bar = '<div class="sd-bar"><button data-copy="' + esc(sl.loc) + '">复制位置</button>' +
      (sl.kind === 'cell' ? '' : '<button data-quote="1">看原文片段</button>') + '</div>';
    return h + '<dl class="sd">' + body + '</dl>' + bar + gatesHTML();
  }

  function changedChars(sl) {
    var ops = diffOps(sl.old, sl.new), n = 0;
    ops.forEach(function (o) { if (o.t !== 'eq') n += o.s.length; });
    return n;
  }

  function gatesHTML() {
    var gate;
    if (AS === 'signed') {
      gate = '<div class="g" id="whcGateSign"><span class="gd"></span>人工审批门<span class="gs">已签单 · 放行</span></div>';
    } else if (AS === 'stale') {
      gate = '<div class="g stale" id="whcGateSign"><span class="gd"></span>人工审批门<span class="gs">签名失效 · 需重签</span></div>';
    } else {
      gate = '<div class="g wait" id="whcGateSign"><span class="gd"></span>人工审批门<span class="gs">待签单</span></div>';
    }
    return '<div class="whc-gates">' +
      '<div class="g"><span class="gd"></span>机器断言闸<span class="gs">' + (A.fail ? A.fail + ' 项未过' : '全绿') + '</span></div>' +
      '<div class="g"><span class="gd"></span>金样回测闸<span class="gs">逐格比对</span></div>' +
      gate +
      '</div>';
  }

  function tailHTML() {
    var src = '<span>数据源：out/' + esc(D.outDir || D.period) + '/red_slots.json · 与红色件清单同源 · 大模型不进入数据路径</span>';
    var B = D.bigtable || null;
    var mid = (B && B.enriched)
      ? '<span>大表跨期对勘：' + B.enriched + ' 格已补入上期值（out/' + esc(B.prevDir || B.prevPeriod) + '/table2.csv，按学科名对齐）</span>'
      : '<span>大表母版为空白模板，未接上期数据</span>';
    var note;
    if (D.snapshotNote) {
      note = '<span class="z">' + esc(D.snapshotNote) + '</span>';
    } else if (AS === 'signed') {
      note = '<span>审批已落库：out/' + esc(D.outDir || D.period) + '/approval.json · 已绑定签单时的报告指纹</span>';
    } else if (AS === 'stale') {
      note = '<span class="z">签单指纹与当前稿件不符，签名失效</span>';
    } else {
      note = '<span>机器跑完不等于可以报送，需人工钤印签单</span>';
    }
    return src + mid + note;
  }

  /* ---------------- 事件 ---------------- */
  function bindOnce(el, ev, fn) { el.addEventListener(ev, fn); }

  function paint() {
    root.querySelector('#whcHero').innerHTML = heroHTML();
    root.querySelector('#whcBar').innerHTML = barHTML();
    root.querySelector('#whcNav').innerHTML = navHTML();
    root.querySelector('#whcMain').innerHTML = mainHTML();
    root.querySelector('#whcSide').innerHTML = sideHTML();
    root.querySelector('#whcFoot').innerHTML = tailHTML();
    wire();
  }

  function pickFocus(sl) {
    state.focus = sl || null;
    root.querySelector('#whcSide').innerHTML = sideHTML();
    wireSide();
    root.querySelectorAll('.dc, .chc, tr[data-loc]').forEach(function (n) {
      n.classList.toggle('hi', !!(state.focus && n.dataset.loc === state.focus.loc));
    });
  }

  function wire() {
    var sw = root.querySelector('#whcSw');
    bindOnce(sw, 'click', function () {
      state.zhu = !state.zhu;
      sw.classList.toggle('on', state.zhu);
      root.classList.toggle('clean', !state.zhu);
    });
    var swm = root.querySelector('#whcSwM');
    bindOnce(swm, 'click', function () {
      state.manualOnly = swm.classList.toggle('on');
      ensureVisible();
      paint();
    });
    var q = root.querySelector('#whcQ');
    if (q) {
      q.value = state.q;
      bindOnce(q, 'input', function () {
        state.q = q.value;
        var nav = root.querySelector('#whcNav');
        nav.innerHTML = navHTML();
        nav.querySelectorAll('.whc-ni').forEach(function (a) {
          bindOnce(a, 'click', function () { goto(a.dataset.sec); });
        });
        ensureVisible(true);
        root.querySelector('#whcMain').innerHTML = mainHTML();
        wireMain();
      });
    }
    root.querySelectorAll('.whc-ni').forEach(function (a) {
      bindOnce(a, 'click', function () { goto(a.dataset.sec); });
    });
    var s = root.querySelector('#whcSign');
    if (s) bindOnce(s, 'click', function () { state.signPanel = true; paint(); });
    var sc = root.querySelector('#whcSignCancel');
    if (sc) bindOnce(sc, 'click', function () { state.signPanel = false; paint(); });
    wireMain();
    wireSide();
  }

  function wireMain() {
    var main = root.querySelector('#whcMain');
    main.querySelectorAll('.dc, .chc').forEach(function (n) {
      var sl = findSlot(n.dataset.loc);
      bindOnce(n, 'mouseenter', function () { if (sl) pickFocus(sl); });
      var loc = n.querySelector('.dc-loc') || n.querySelector('b');
      if (loc) {
        bindOnce(loc, 'click', function (ev) { ev.stopPropagation(); if (sl) popup(ev, sl); });
      }
    });
    main.querySelectorAll('tr[data-loc]').forEach(function (n) {
      var sl = findSlot(n.dataset.loc);
      bindOnce(n, 'mouseenter', function () { if (sl) pickFocus(sl); });
    });
    main.querySelectorAll('button[data-expand]').forEach(function (b) {
      bindOnce(b, 'click', function () { state.expandCells = state.sec; paint(); });
    });
    main.querySelectorAll('button[data-csv]').forEach(function (b) {
      bindOnce(b, 'click', function () {
        var rows = filtered(currentSection()).filter(function (x) { return x.kind === 'cell'; });
        var tsv = '位置\t母版原值\t本期填充\t来源\n' + rows.map(function (r) {
          return [r.loc, r.old, r.new, r.source].join('\t');
        }).join('\n');
        copy(tsv, b, '已复制 ' + rows.length + ' 行');
      });
    });
  }

  function wireSide() {
    root.querySelectorAll('#whcSide button[data-copy]').forEach(function (b) {
      bindOnce(b, 'click', function () { copy(b.dataset.copy, b, '已复制'); });
    });
    var qb = root.querySelector('#whcSide button[data-quote]');
    if (qb) bindOnce(qb, 'click', function (ev) {
      ev.stopPropagation();
      if (state.focus) popup(ev, state.focus);
    });
  }

  function strip(h) { return String(h).replace(/<[^>]+>/g, ''); }

  function copy(text, btn, okMsg) {
    var done = function () { var t = btn.textContent; btn.textContent = okMsg; setTimeout(function () { btn.textContent = t; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { }
      document.body.removeChild(ta);
    }
  }

  function currentSection() {
    return D.sections.filter(function (s) { return s.id === state.sec; })[0] || D.sections[0];
  }
  function findSlot(loc) {
    for (var i = 0; i < D.sections.length; i++) {
      var arr = D.sections[i].slots;
      for (var j = 0; j < arr.length; j++) if (arr[j].loc === loc) return arr[j];
    }
    return null;
  }
  function goto(id) {
    state.sec = id;
    state.expandCells = null;
    if (window.history && window.history.replaceState) window.history.replaceState(null, '', '#' + id);
    paint();
    window.scrollTo(0, 0);
  }
  function ensureVisible(silent) {
    var sec = currentSection();
    if (sec && sectionCount(sec)) return;
    var next = D.sections.filter(function (s) { return sectionCount(s); })[0];
    if (next) state.sec = next.id;
  }

  /* 溯源浮层 */
  var pop = document.getElementById('whcPop');
  function popup(ev, sl) {
    if (!pop) return;
    pop.innerHTML = '<div class="ph">台 账 槽 位</div><div class="pc">' + esc(sl.loc) + '</div>' +
      '<div class="pr"><span>' + esc(sl.oldLabel || '母版原值') + '</span><b>' + esc(sl.old || '（空）') + '</b></div>' +
      '<div class="pr"><span>本期写入</span><b>' + esc(sl.new) + '</b></div>' +
      '<div class="pf">' + esc(sl.source) + (sl.manual ? ' · 待人工补录' : '') + '</div>';
    pop.classList.add('on');
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var x = ev.clientX + 14, y = ev.clientY + 16;
    if (x + w > window.innerWidth - 16) x = ev.clientX - w - 14;
    if (y + h > window.innerHeight - 16) y = ev.clientY - h - 12;
    pop.style.left = Math.max(12, x) + 'px';
    pop.style.top = Math.max(12, y) + 'px';
  }
  document.addEventListener('click', function () { if (pop) pop.classList.remove('on'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && pop) pop.classList.remove('on');
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      var ids = D.sections.map(function (s) { return s.id; });
      var i = ids.indexOf(state.sec);
      var next = e.key === 'ArrowRight' ? (i + 1) % ids.length : (i + ids.length - 1) % ids.length;
      goto(ids[next]);
    }
  });

  /* 首发：URL 哈希可直达某分组（#bigtable / #forecast …），便于分享与复核 */
  var first = D.sections.filter(function (s) { return s.count; })[0];
  state.sec = first ? first.id : (D.sections[0] || {}).id;
  var hash = (location.hash || '').replace(/^#/, '');
  if (hash && D.sections.some(function (s) { return s.id === hash; })) state.sec = hash;
  /* 已签单：给根节点挂 signed，钤印动画在签单后回带的那一屏上落下 */
  if (AS === 'signed') root.classList.add('signed');
  paint();
})();

</script>
