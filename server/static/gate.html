<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请先登录 · 文衡</title>
<!--
  未登录访问 /app/** 时的登录门页面（server/protected_static.py 在导航请求上返回它）。
  样式照陈列馆的「请先登录」卡（library.css 的 .library-page/.library-message/.library-action，
  令牌取工作区「云大绿」）；单文件、零依赖、零 CDN——本仓铁律。
  改这里的观感=改所有未登录访客看到的第一眼，改完跑 tests/test_protected_static.py。
-->
<style>
  :root {
    --bg: #F4F3ED; --card: #FFFDF8; --line: #DDE1D8;
    --ink: #222B25; --ink-2: #3F4C42; --zhu: #1A4B27;
    --shadow: 0 1px 2px rgba(34, 43, 37, .06), 0 8px 24px rgba(34, 43, 37, .06);
    --r: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.7 system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page { min-height: 100vh; padding: clamp(18px, 4vw, 48px) clamp(14px, 3vw, 32px) 56px; }
  .shell { width: min(100%, 1180px); margin: 0 auto; }
  .card {
    margin: 0; padding: clamp(22px, 4vw, 36px);
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--card); box-shadow: var(--shadow);
  }
  h1 {
    margin: 0; font-size: 21px; line-height: 1.35; font-weight: 600;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", SimSun, serif;
  }
  p { margin: 10px 0 18px; color: var(--ink-2); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 9px 16px;
    border: 1px solid var(--zhu); border-radius: 9px;
    background: var(--zhu); color: #fff; font-weight: 600; text-decoration: none;
  }
  .btn:hover { filter: brightness(.96); }
  .btn:focus-visible { outline: 3px solid var(--zhu); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="card" role="alert">
        <h1>请先登录</h1>
        <p>登录后才能进入工作区、查看已开放的馆藏预览。</p>
        <a class="btn" href="/login">前往登录</a>
      </section>
    </div>
  </main>
</body>
</html>
