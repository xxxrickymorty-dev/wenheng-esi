<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}文衡 · 学科信息参考自动化{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body {% block body_attrs %}{% endblock %}>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><span class="logo">文衡</span><span class="sub">学科信息参考 · 自动化流水线</span></a>
    <nav>
      {% if user %}
      <span class="who">{{ user }}</span>
      <a class="ghost" href="/logout">退出</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="foot wrap">
  <span>演示环境 · 数据为公开 ESI/InCites 指标 · 大模型不进入数据路径 · 数字 100% 可回溯台账单元格</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
